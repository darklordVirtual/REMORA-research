version: 2
updates:
  # Python package dependencies (root pyproject.toml / requirements).
  #
  # Grouped by risk class (fasttrack Gate 0.3), not as one universe-bump:
  # regression attribution requires a reviewable, bounded dependency change.
  # PR #133 (168 packages in one PR) is the failure mode this prevents.
  # Anything not matching a group arrives as its own PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # CI-economics review 2026-08-05: 3 concurrent PRs keeps the queue
    # reviewable; the merged 15-package ml-stack bump was still too broad
    # for causal attribution, so it is split into three narrower stacks.
    open-pull-requests-limit: 3
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      runtime-framework:
        applies-to: version-updates
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn*"
          - "pydantic*"
          - "httpx*"
          - "psycopg*"
          - "anyio"
      numerical-core:
        applies-to: version-updates
        patterns:
          - "numpy"
          - "scipy"
          - "scikit-learn"
      huggingface-stack:
        applies-to: version-updates
        patterns:
          - "torch*"
          - "transformers*"
          - "sentence-transformers"
          - "huggingface*"
          - "hf-*"
          - "tokenizers"
          - "safetensors"
      agent-sdk:
        applies-to: version-updates
        patterns:
          - "openai"
          - "groq"
          - "langchain*"
          - "langsmith"
      dev-tools:
        applies-to: version-updates
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "hypothesis"
          - "coverage*"
          - "types-*"
          - "sqlglot"
      # Lock entries no declared install set installs: the environment the
      # evidence was measured in (experiment SDKs, plotting, platform wheels).
      # A bump here changes the lock digest and the replication pack's history
      # but runs no test, so they arrive together in one pull request rather
      # than one each. Last, so a name an earlier group covers stays there.
      # Regenerate with `python scripts/lock_measurement_only.py`; CI checks
      # the list with --check. Security updates are not affected: this group
      # applies to version updates only.
      measurement-env:
        applies-to: version-updates
        patterns:
          - "accelerate"
          - "agentdojo"
          - "aioboto3"
          - "aiofiles"
          - "alembic"
          - "anthropic"
          - "bcrypt"
          - "black"
          - "boltons"
          - "bracex"
          - "cachebox"
          - "causal-learn"
          - "click-option-group"
          - "cohere"
          - "contourpy"
          - "cycler"
          - "deepdiff"
          - "defusedxml"
          - "distro"
          - "dnspython"
          - "dowhy"
          - "email-validator"
          - "exceptiongroup"
          - "ezdxf"
          - "face"
          - "fastapi-sso"
          - "fastavro"
          - "feedparser"
          - "fonttools"
          - "fpdf2"
          - "git-filter-repo"
          - "glom"
          - "google-auth"
          - "google-genai"
          - "graphviz"
          - "greenlet"
          - "grpcio"
          - "h2"
          - "hpack"
          - "httpx-sse"
          - "hyperframe"
          - "ifcopenshell"
          - "importlib_metadata"
          - "invoke"
          - "isodate"
          - "isort"
          - "kiwisolver"
          - "langchain"
          - "langchain-core"
          - "langchain-protocol"
          - "langgraph"
          - "langgraph-checkpoint"
          - "langgraph-prebuilt"
          - "langgraph-sdk"
          - "langsmith"
          - "lark"
          - "Mako"
          - "matplotlib"
          - "mcp"
          - "momentchi2"
          - "oauthlib"
          - "opentelemetry-instrumentation"
          - "opentelemetry-instrumentation-requests"
          - "opentelemetry-instrumentation-threading"
          - "opentelemetry-util-http"
          - "orderly-set"
          - "orjson"
          - "ormsgpack"
          - "outcome"
          - "paramiko"
          - "patsy"
          - "peewee"
          - "playwright"
          - "pyasn1"
          - "pyasn1_modules"
          - "pycryptodome"
          - "pydantic-settings"
          - "pydot"
          - "pyee"
          - "PyGithub"
          - "PyMuPDF"
          - "PyNaCl"
          - "pyparsing"
          - "pypdf"
          - "PySocks"
          - "pytest-asyncio"
          - "python-multipart"
          - "python-nmap"
          - "pytokens"
          - "pywin32"
          - "requests-toolbelt"
          - "ruamel.yaml"
          - "ruamel.yaml.clib"
          - "scapy"
          - "seaborn"
          - "selenium"
          - "semantic-version"
          - "semgrep"
          - "sgmllib3k"
          - "shapely"
          - "SQLAlchemy"
          - "sse-starlette"
          - "statsmodels"
          - "tomli"
          - "trio"
          - "trio-websocket"
          - "types-requests"
          - "uuid_utils"
          - "wcmatch"
          - "websocket-client"
          - "wsproto"

    # pydantic pins pydantic-core to an exact build (==2.46.4 for pydantic
    # 2.13.4). Bumping it on its own makes the lockfile unresolvable, which is
    # what took every install-based job down in PR #311. The version is owned
    # by the pydantic release, so it only moves when pydantic itself moves.
    #
    # huggingface-hub 2: sentence-transformers 6.1 and datasets 4.8 both
    # declare huggingface-hub<2.0, so the lock cannot resolve the dev,nli
    # and agentharm install sets (PR #664). Lift when both widen the range.
    ignore:
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
      - dependency-name: "huggingface_hub"
        update-types: ["version-update:semver-major"]
      # mcp 2: REMORA does not import mcp; it is transitive. Security fixes
      # land on 1.x (1.30.0, GHSA-84m7-p3x7-pcfv). A major with no consumer
      # here to test it waits until a dependency requires it (ADR D10).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Probity's invocation_axes reader for the reproduction job. The pin stays
  # exact, so a release reaches CI only as a pull request that runs the job.
  - package-ecosystem: "pip"
    directory: "/ci/agent-evidence-vectors"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1

  # Frontend dependencies, same risk-class principle.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      ui-libraries:
        applies-to: version-updates
        patterns:
          - "@radix-ui/*"
          - "react*"
          - "@tanstack/*"
          - "tailwind*"
          - "@tailwindcss/*"
          - "lucide-react"
          - "class-variance-authority"
          - "clsx"
      build-tools:
        applies-to: version-updates
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "vitest*"
          - "@vitest/*"
          - "typescript*"
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
          - "wrangler"
          - "nitro"
          - "openapi-typescript"

    # Four frontend toolchain majors are held back so the rest of the group
    # stays mergeable. Each hold has a stated condition for lifting it, and
    # the migration itself is tracked in issue #323.
    #
    # typescript: openapi-typescript 7.x declares `typescript: ^5.x` as a peer
    #   and generates the API client, so a TypeScript major cannot be
    #   installed at all — npm ci fails with ERESOLVE before any job runs
    #   (PR #313). Lift when openapi-typescript widens the peer range.
    # eslint / @eslint/js: v10 removes eslintrc support and the deprecated
    #   SourceCode and rule-context methods, so it needs every plugin in
    #   eslint.config.js confirmed compatible first.
    # eslint-plugin-react-hooks: v7 changes the recommended rule set, which
    #   eslint.config.js spreads wholesale.
    # eslint-plugin-react-refresh: 0.5 produced 98 new
    #   only-export-components warnings on the route modules when measured,
    #   and `npm run lint` runs --max-warnings=0.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The five Cloudflare Workers. Until 2026-10-01 they had no entry at all, so
  # their lockfiles never received an update and 70+ advisories accumulated in
  # their (development-scope) toolchains: undici, ws, sharp, esbuild, vitest.
  # Same risk-class principle as the frontend: security fixes grouped, the
  # Workers toolchain grouped, everything else as its own PR.
  - package-ecosystem: "npm"
    directories:
      - "/workers/agent-control"
      - "/workers/aromer"
      - "/workers/law-search"
      - "/workers/mcp-gateway"
      - "/workers/rag-oracle"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      workers-toolchain:
        applies-to: version-updates
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/*"
          - "vitest*"
          - "@vitest/*"
          - "typescript*"
          - "esbuild"

    # vitest 5: @cloudflare/vitest-pool-workers (0.22.0, the latest) declares
    #   `vitest: ^4.1.0` as a peer, so rag-oracle cannot install vitest 5 at
    #   all; npm ci fails with ERESOLVE (PR #667). Lift when the pool widens
    #   its peer range.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # Keep the SHA-pinned GitHub Actions current (security hardening).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    # CodeQL init/analyze must share one release SHA; keep Dependabot atomic.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
