version: 2
updates:
  # Python package dependencies (root pyproject.toml / requirements).
  #
  # Grouped by risk class (fasttrack Gate 0.3), not as one universe-bump:
  # regression attribution requires a reviewable, bounded dependency change.
  # PR #133 (168 packages in one PR) is the failure mode this prevents.
  # Anything not matching a group arrives as its own PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # CI-economics review 2026-08-05: 3 concurrent PRs keeps the queue
    # reviewable; the merged 15-package ml-stack bump was still too broad
    # for causal attribution, so it is split into three narrower stacks.
    open-pull-requests-limit: 3
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      runtime-framework:
        applies-to: version-updates
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn*"
          - "pydantic*"
          - "httpx*"
          - "psycopg*"
          - "anyio"
      numerical-core:
        applies-to: version-updates
        patterns:
          - "numpy"
          - "scipy"
          - "scikit-learn"
      huggingface-stack:
        applies-to: version-updates
        patterns:
          - "torch*"
          - "transformers*"
          - "sentence-transformers"
          - "huggingface*"
          - "hf-*"
          - "tokenizers"
          - "safetensors"
      agent-sdk:
        applies-to: version-updates
        patterns:
          - "openai"
          - "groq"
          - "langchain*"
          - "langsmith"
      dev-tools:
        applies-to: version-updates
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "hypothesis"
          - "coverage*"
          - "types-*"
          - "sqlglot"

    # pydantic pins pydantic-core to an exact build (==2.46.4 for pydantic
    # 2.13.4). Bumping it on its own makes the lockfile unresolvable, which is
    # what happened in PR #311. The version is owned by the pydantic release,
    # so it is only ever updated as a consequence of bumping pydantic itself.
    ignore:
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"

  # Frontend dependencies, same risk-class principle.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      ui-libraries:
        applies-to: version-updates
        patterns:
          - "@radix-ui/*"
          - "react*"
          - "@tanstack/*"
          - "tailwind*"
          - "@tailwindcss/*"
          - "lucide-react"
          - "class-variance-authority"
          - "clsx"
      build-tools:
        applies-to: version-updates
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "vitest*"
          - "@vitest/*"
          - "typescript*"
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
          - "wrangler"
          - "nitro"
          - "openapi-typescript"

  # Keep the SHA-pinned GitHub Actions current (security hardening).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
