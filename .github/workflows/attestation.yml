name: Review Attestation

# Produces the SHA-bound external-review handoff for a review tag, generated
# on a CLEAN CI checkout (not by hand): commit-bound test attestation,
# governance benchmark pack, and credibility pack, all built from and verified
# against the same commit, uploaded as ONE artifact (P0-6 + REM-021 handoff).
# Triggered on review tags and manual dispatch rather than every push, since
# it re-runs the full deterministic suite to bind a green result to an exact
# commit SHA.
on:
  push:
    tags:
      - "review-*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    name: Generate SHA-bound review handoff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Digests of the two attestation files, passed to the sign job through
      # the job-output channel rather than inside the artifact they describe.
      attestation_sha256: ${{ steps.digests.outputs.attestation_sha256 }}
      report_sha256: ${{ steps.digests.outputs.report_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python 3.14
        # 3.14 is the published environment pinned in paper/remora_paper.md §16.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api]" -c /tmp/constraints.txt

      - name: Remove any stale attestation files from the checkout
        # Guards against stale-green: if the generator dies before writing
        # (dirty-tree refusal, install failure, crash), no leftover PASS files
        # can be uploaded by the always() step below — if-no-files-found: error
        # then fails the upload instead. Attestation files are gitignored and
        # never committed (see artifacts/credibility-pack/ATTESTATION.md), so
        # this is a belt-and-suspenders no-op on a clean checkout.
        run: |
          rm -f artifacts/credibility-pack/test-attestation.json
          rm -f artifacts/credibility-pack/test-report.txt

      - name: Generate attestation (fails if worktree dirty or suite not green)
        # --require-clean refuses to attest from an uncommitted state; the CI
        # checkout is clean, so a green run binds the result to this exact SHA.
        # A red suite still writes gate: FAIL files, which always() uploads so
        # the failure is inspectable — never a stale PASS.
        run: python scripts/generate_test_attestation.py --require-clean

      - name: Build governance benchmark package (manifest bound to this SHA)
        # Runs after the attestation so the generator's clean-tree check sees
        # the untouched checkout; the pack build rewrites its own output dir.
        run: python scripts/build_governance_benchmark_package.py

      - name: Verify handoff is bound to this exact commit
        # The committed pack manifest necessarily records the previous commit
        # (a commit cannot contain its own SHA); the CI-built pack is the
        # authoritative one and MUST match github.sha exactly.
        run: |
          python - <<'EOF'
          import json, os, sys

          sha = os.environ["GITHUB_SHA"]
          problems = []

          m = json.load(open("artifacts/governance-benchmark-pack/manifest.json"))
          if m.get("commit_sha") != sha:
              problems.append(f"manifest commit_sha {m.get('commit_sha')} != github.sha {sha}")
          if m.get("worktree_clean") is not True:
              problems.append(f"manifest worktree_clean is {m.get('worktree_clean')}, expected true")
          if m.get("missing_files"):
              problems.append(f"pack build missing files: {m['missing_files']}")

          a = json.load(open("artifacts/credibility-pack/test-attestation.json"))
          if a.get("current_system_commit") != sha:
              problems.append(f"attestation commit {a.get('current_system_commit')} != github.sha {sha}")
          if a.get("git_dirty_worktree"):
              problems.append("attestation was generated from a dirty worktree")
          if a.get("gate") != "PASS":
              problems.append(f"attestation gate is {a.get('gate')}, expected PASS")

          for p in problems:
              print(f"ERROR: {p}", file=sys.stderr)
          sys.exit(1 if problems else 0)
          EOF

      - name: Record digests of the verified attestation files
        # Only reached when the commit binding and gate: PASS checks above
        # succeeded, so the sign job never signs a FAIL or unbound file.
        id: digests
        run: |
          set -euo pipefail
          echo "attestation_sha256=$(sha256sum artifacts/credibility-pack/test-attestation.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "report_sha256=$(sha256sum artifacts/credibility-pack/test-report.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload SHA-bound review handoff bundle
        # Success-only: this single artifact (code SHA + governance pack +
        # credibility pack + attestation) is the formal REM-021 handoff.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remora-review-handoff-${{ github.sha }}
          path: |
            artifacts/governance-benchmark-pack
            artifacts/governance-benchmark-pack.zip
            artifacts/credibility-pack
          if-no-files-found: error

      - name: Upload review attestation artifact
        # always(): on a red suite this uploads the freshly written gate: FAIL
        # attestation (never a stale PASS — see the rm step above); if the
        # generator died before writing, if-no-files-found: error fails here.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-test-attestation
          path: |
            artifacts/credibility-pack/test-attestation.json
            artifacts/credibility-pack/test-report.txt
          if-no-files-found: error

  sign:
    # AACP observation (reports/remora-06c2f8f in agent-authority-conformance):
    # the test attestation was unsigned, so its only authority was the Actions
    # run, and a file with gate: PASS could be produced anywhere. This job
    # gives it a Sigstore build-provenance attestation, as release.yml does for
    # the wheel, so a consumer can check which workflow, ref and commit
    # produced it:
    #   gh attestation verify test-attestation.json --repo darklordVirtual/REMORA-research
    # Scope: the signature names the producer; it is not an independent
    # review, and it does not show the suite tests the right things. As in
    # release.yml (SR-11), the signing identity lives in a job that installs
    # nothing, and the files are checked against the digests the attest job
    # emitted before signing.
    name: Sigstore provenance for the test attestation
    runs-on: ubuntu-latest
    needs: attest
    permissions:
      contents: read
      id-token: write      # Sigstore OIDC identity
      attestations: write  # store attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-test-attestation
          path: signed/

      - name: Check the files are the ones the attest job verified
        working-directory: signed
        env:
          ATTESTATION_SHA256: ${{ needs.attest.outputs.attestation_sha256 }}
          REPORT_SHA256: ${{ needs.attest.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${ATTESTATION_SHA256}" ] || [ -z "${REPORT_SHA256}" ]; then
            echo "attest job emitted no digests" >&2; exit 1
          fi
          printf '%s  test-attestation.json\n%s  test-report.txt\n' \
            "${ATTESTATION_SHA256}" "${REPORT_SHA256}" | sha256sum -c --strict -

      - name: Attest build provenance (test attestation and report)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            signed/test-attestation.json
            signed/test-report.txt

      - name: Verify the attestation we just produced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in signed/test-attestation.json signed/test-report.txt; do
            gh attestation verify "$f" --repo "${GITHUB_REPOSITORY}"
          done
