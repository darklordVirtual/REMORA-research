name: Review Attestation

# Produces a commit-bound test attestation for external-review handoff, generated
# on a CLEAN CI checkout (not by hand). Triggered on review tags and manual
# dispatch rather than every push, since it re-runs the full deterministic suite
# to bind a green result to an exact commit SHA (P0-6).
on:
  push:
    tags:
      - "review-*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    name: Generate review attestation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.14
        # 3.14 is the published environment pinned in paper/remora_paper.md §16.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api]" -c /tmp/constraints.txt

      - name: Generate attestation (fails if worktree dirty or suite not green)
        # --require-clean refuses to attest from an uncommitted state; the CI
        # checkout is clean, so a green run binds the result to this exact SHA.
        run: python scripts/generate_test_attestation.py --require-clean

      - name: Upload review attestation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-test-attestation
          path: |
            artifacts/credibility-pack/test-attestation.json
            artifacts/credibility-pack/test-report.txt
          if-no-files-found: error
