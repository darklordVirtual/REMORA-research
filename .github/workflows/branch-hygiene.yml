name: Branch Hygiene

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete branches whose same-repository PR has been merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default="$(gh api "repos/$REPO" --jq '.default_branch')"

          declare -A open_heads=()
          while IFS=$'\t' read -r head_repo head; do
            [[ "$head_repo" == "$REPO" && -n "$head" ]] && open_heads["$head"]=1
          done < <(
            gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | [.head.repo.full_name, .head.ref] | @tsv'
          )

          declare -A merged_heads=()
          while IFS=$'\t' read -r head_repo head; do
            [[ "$head_repo" == "$REPO" && -n "$head" ]] && merged_heads["$head"]=1
          done < <(
            gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null) | [.head.repo.full_name, .head.ref] | @tsv'
          )

          deleted=0
          kept_open=0
          kept_unmerged=0

          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "$default" ]] && continue

            if [[ -n "${open_heads[$branch]:-}" ]]; then
              echo "KEEP open PR: $branch"
              kept_open=$((kept_open + 1))
              continue
            fi

            if [[ -z "${merged_heads[$branch]:-}" ]]; then
              echo "KEEP no merged PR evidence: $branch"
              kept_unmerged=$((kept_unmerged + 1))
              continue
            fi

            echo "DELETE merged PR branch: $branch"
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "KEEP protected/unavailable: $branch"
            fi
          done < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
          )

          echo "Deleted merged PR branches: $deleted"
          echo "Kept because an open PR exists: $kept_open"
          echo "Kept because no merged PR evidence exists: $kept_unmerged"
