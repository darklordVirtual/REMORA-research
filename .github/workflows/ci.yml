name: CI — Deterministic Test Suite

# Runs the full deterministic test suite on pull requests and on master.
# No API keys, no network access, no cloud resources required.
# For the full quality-gates pipeline (lint, coverage, frontend, replay), see quality-gates.yml.
#
# CI-economics review 2026-08-05: the former push-to-every-branch trigger
# double-ran the identical SHA (push + pull_request) — the PR event is the
# single verification path for feature branches; master keeps its own run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

# A new push to a PR supersedes the previous SHA's run; master runs are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the environment pinned in paper/remora_paper.md §16 — the
        # published environment must be CI-tested (2026-07-02 review finding).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # causal extra: tests/test_causal.py imports remora.causal.domains,
          # whose loader needs pyyaml — without it, test collection fails.
          # Constraints (-c) pin every resolved dependency to the exact versions
          # in the committed requirements-lock.txt, while the extras still drive
          # WHAT gets installed. The lock file contains editable (-e) and comment
          # lines that pip rejects in a constraints file, so filter them out.
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api,security]" -c /tmp/constraints.txt

      - name: Run deterministic test suite
        # Markers 'live' and 'live_replay_heavy' are excluded by default in
        # pyproject.toml addopts — no API keys or network access required.
        env:
          REMORA_REQUIRE_SECURITY_EXTRA: "1"
        run: python -m pytest tests/ -q

      - name: Verify zero false-accept rate
        # HONESTY NOTE (research audit, 2026-07-27): this step READS the
        # frozen result artifacts and asserts their stored FAR field is 0.0.
        # It does NOT regenerate results with current code — it is a
        # regression tripwire for the promoted baseline snapshots, not a
        # reproduction. Regeneration policy: docs/assurance/
        # rebenchmark_protocol_v1.md.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          candidates = [
              "results/toolcall_blind_v3_results.json",
              "results/false_accept_regression_v1.json",
          ]
          errors = []
          for p in candidates:
              path = pathlib.Path(p)
              if not path.exists():
                  errors.append(f"MISSING artifact: {p}")
                  continue
              data = json.loads(path.read_bytes())
              far = data.get("false_accept_rate", data.get("n_false_accept", None))
              if far is None:
                  errors.append(f"No FAR field in {p}")
                  continue
              if float(far) != 0.0:
                  errors.append(f"FAR > 0 in {p}: {far}")
          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("Zero false-accept gate: PASS")
          PY

  opa-conformance:
    name: OPA/Rego policy conformance (mandatory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Pinned OPA version — the same version the conformance harness was
      # verified against locally. Bump deliberately, never float `latest`.
      OPA_VERSION: "1.18.2"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # Constraints (-c) = version pinning from requirements-lock.txt; the
          # extras drive what gets installed. Filter out -e/comment lines that
          # pip rejects in a constraints file.
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api,security]" -c /tmp/constraints.txt

      - name: Install pinned OPA binary
        run: |
          curl -sSfL -o /usr/local/bin/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          # Verify the binary before trusting it. The expected digest comes from
          # the official opa_linux_amd64_static.sha256 release asset for
          # v1.18.2. sha256sum -c exits non-zero on mismatch, failing the job.
          echo "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version

      - name: Rego syntax check
        run: opa check datasets/remora_knowledge_v1/policies/rego_examples/remora_action_gate.rego

      - name: Golden conformance — safety parity (hard gate)
        # Exit 1 = conformance failure, exit 2 = opa missing; both fail CI.
        # The shipped illustrative policy must always pass safety parity;
        # a full Rego port must additionally pass --strict (run it against
        # your production policy in your deployment pipeline).
        run: python scripts/opa_conformance.py

      - name: Rule-conflict sweep (hard gate)
        # A golden set pins the cases someone thought of. This sweeps the
        # combinations the gate rules branch on and fails if ANY input makes
        # two complete rules disagree — Rego answers that with
        # eval_conflict_error and no decision at all, which the adapter's
        # floor cannot correct because there is no verdict to floor.
        # Added after the 2026-08-04 OT/Rego test set found seven such inputs.
        run: python scripts/opa_conflict_sweep.py

      - name: Pytest conformance gate (must run, not skip)
        # With opa on PATH the opa_gate test must actually execute; a skip
        # here would mean the harness silently lost its binary detection.
        run: |
          python -m pytest tests/test_opa_conformance_gate.py -q -rs | tee out.txt
          if grep -qi "skipped" out.txt; then
            echo "ERROR: conformance gate skipped despite opa being installed" >&2
            exit 1
          fi

  postgres-contract:
    # External re-review 2026-07-25: the Postgres HMAC fix (F-04) was
    # code-reviewed but never executed against a real server, because the
    # contract tests are DSN-gated and skip without REMORA_PG_DSN. This job
    # provides that operational evidence on every push.
    name: Postgres tenant-chain contract (real service)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remora
          POSTGRES_PASSWORD: remora
          POSTGRES_DB: remora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REMORA_PG_DSN: postgresql://remora:remora@localhost:5432/remora_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and Postgres driver
        run: |
          python -m pip install --upgrade pip
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          # DB drivers come from the declared `postgres` extra (REM-045) —
          # the CI environment installs exactly what the packaging promises.
          pip install -e ".[dev,causal,api,postgres]" -c /tmp/constraints.txt

      - name: Postgres contract tests (must run, not skip)
        # With the DSN set, the DSN-gated tests must actually execute —
        # a skip here means the signing fix is unverified again. The outbox
        # file joined 2026-08-05 (FT-02): its multi-worker adapter carries
        # the crash-consistency contract, so "verified against a real
        # service" must not depend on a developer remembering to run it.
        run: |
          python -m pytest tests/test_execution_api.py tests/test_execution_outbox.py \
            -q -rs -k "postgres" | tee out.txt
          if grep -qiE "skipped|no tests ran" out.txt; then
            echo "ERROR: Postgres contract tests skipped despite service DSN" >&2
            exit 1
          fi

  documentation-governance:
    name: Documentation governance (registers, profiles, README budget)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history: the capability-freshness gate runs --strict and
          # must be able to resolve every verified_at_sha, not only recent ones.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (version-locked via lockfile constraints)
        run: |
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install pyyaml -c /tmp/constraints.txt

      - name: License policy gate (BUSL-1.1, no legacy-license drift)
        run: python scripts/check_license_policy.py

      - name: Documentation-governance gate
        # Registers parse and are internally consistent, document register
        # covers docs/ + paper/ + root docs exactly, canonical topics come
        # from the controlled registry, historical docs carry a banner,
        # release-profile declaration matches the profile computed from
        # register state, README stays under its line budget.
        run: python scripts/check_document_governance.py

      - name: Shipped-surfaces matrix
        # Every advertised surface names the CI jobs that guard it (issue
        # #84); this binds each reference to a live workflow job id and
        # ratchets the surface count so a surface cannot quietly stop being
        # checked by being deleted from the register.
        run: python scripts/check_shipped_surfaces.py

      - name: Capability verification binding
        # Every capability status/caveat is a claim about code. A capability
        # carrying verified_at_sha whose implementation moved since that commit
        # is stale and fails here; unbound capabilities are ratcheted by
        # unbound_baseline so the backlog can only shrink (issue #281).
        #
        # --strict additionally fails on an UNRESOLVABLE verified_at_sha.
        # Without it, a binding to a commit that does not exist classifies as
        # UNKNOWN, prints a warning nobody reads, and the gate reports success:
        # a corrupt binding is indistinguishable from a clean one. That was
        # found by writing one (NEGATIVE_RESULTS section 46).
        #
        # It requires full history, because on a shallow clone every SHA older
        # than the tip is equally unresolvable and strict mode would fail on
        # correct bindings. fetch-depth: 0 on the checkout above is what makes
        # the distinction possible; the two settings must move together.
        run: python scripts/check_capability_freshness.py --strict

      - name: Capability semantics (register vs runtime wiring)
        # Issue #84 residual 2: a structurally valid register must not claim
        # a surface is wired when the runtime path is absent or weaker.
        # WIRED_API_PATH requires the cited implementation to be transitively
        # imported from a public API surface; PERSISTED_ATOMIC requires a
        # durable-backend path in the cited code; reference paths require a
        # reference flow; every level requires tests. Fix over-claims by
        # wiring for real or recording the honest weaker status.
        run: python scripts/check_capability_semantics.py

      - name: Product-truth gate
        # docs/product/product_truth_contract.yaml classifies every advertised
        # capability (core/optional/experimental/legacy/demo); public docs and
        # the frontend landing page must not present a non-core capability as
        # mandatory in the canonical execution path.
        run: python scripts/check_product_truth.py

      - name: Paper sync gate (.md / .tex / PDF coherent)
        # remora_paper.md is the version authority; the .tex (which compiles
        # the PDF) must carry the same version+revision and no stale process
        # claims. Prevents the .tex/.pdf silently diverging from the .md/code.
        run: python scripts/check_paper_sync.py

      - name: Claim-hygiene gates (stdlib only)
        # These four ran in `make audit` but in no workflow, so until
        # 2026-07-31 an overclaim in the README, a claim citing an artifact
        # that does not exist, or a broken internal link all passed CI. They
        # need no third-party dependency, so they belong in this light job.
        # check_paper_overflow is deliberately NOT here: it needs PyMuPDF and
        # the compiled PDF, and already runs in compile-paper.yml where both
        # exist.
        run: |
          python scripts/check_artifacts_exist.py
          python scripts/check_claim_sync.py
          python scripts/check_no_overclaims.py
          python scripts/_check_links.py

      - name: Source hygiene (script metadata, SPDX headers)
        run: python scripts/check_script_hygiene.py

      - name: Supply-chain invariant (all Actions SHA-pinned)
        run: python scripts/check_action_pins.py

      - name: Prose-style ratchet (structural AI-writing tells, shrink-only)
        # Em dashes in prose, arrows inside sentences, bold-first bullets,
        # "not X but Y", filler. Counts per file may only fall; the baseline
        # is lowered after each rewrite pass. Historical/archived text is
        # excluded because it is preserved verbatim by policy.
        run: python scripts/check_prose_style.py

      - name: NEGATIVE_RESULTS.md status gate
        # 35 numbered sections are not 35 open problems. Every section carries
        # an open/accepted/superseded marker; this fails if the summary tables
        # or the backlog drift away from them, which is exactly how the
        # document came to present resolved findings as active.
        run: python scripts/check_negative_results_status.py

      - name: Experiment manifests (lifecycle + provenance coverage)
        # Malformed manifests fail; missing manifests/sidecars are advisory.
        # Spec: docs/assurance/experiment_manifest_spec_v1.md
        run: python scripts/check_experiment_manifests.py

      - name: Generated-doc drift (text generators)
        # A generated document that no longer matches its source is a silent
        # drift. These generators are stdlib/PyYAML-only, so they run in this
        # lightweight job. Figure/PDF generators are non-deterministic and are
        # not diffed. The remora-dependent failure_analysis generator is diffed
        # in quality-gates.yml (full deps).
        run: |
          python scripts/generate_research_control_matrix.py --check
          python scripts/generate_readme_status.py --check
          # A result that a later round replaced is archived, never deleted.
          # This fails if a claim's status/superseded_by changed without the
          # archive page being regenerated.
          python scripts/generate_superseded_claims.py --check
          python scripts/generate_results_snapshot.py
          git diff --exit-code -- docs/results_snapshot.md artifacts/benchmark_summary.json

  lockfile-check:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify requirements-lock.txt is committed
        run: |
          if [ ! -f requirements-lock.txt ]; then
            echo "ERROR: requirements-lock.txt is missing. Run 'pip freeze > requirements-lock.txt' and commit it." >&2
            exit 1
          fi
          echo "requirements-lock.txt present ($(wc -l < requirements-lock.txt) lines)"

      - name: Verify pyproject.toml is present and parseable
        run: |
          python -c "
          import tomllib, pathlib, sys
          try:
              tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
              print('pyproject.toml: valid TOML')
          except Exception as e:
              print(f'ERROR parsing pyproject.toml: {e}', file=sys.stderr)
              sys.exit(1)
          "

  wheel-contract:
    # REM-045 / external review F-01: the BUILT distribution must fulfil the
    # documented CLI/API promise — not just the editable checkout. Builds the
    # wheel, installs it with [api] in a clean venv, and exercises the
    # contract from an empty directory with the repo root nowhere on sys.path.
    name: Wheel fulfils the CLI/API contract (installed, not editable)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist/

      - name: Install wheel with [api,sdk] into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install --quiet "$(ls dist/remora-*.whl)[api,sdk]"

      - name: Contract smoke from an empty directory
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/wheelenv/bin/python"

          # The repo checkout must play no part in any of the checks below.
          "$PY" - <<'CHECK'
          import sys, pathlib
          bad = [p for p in sys.path if pathlib.Path(p or ".").resolve().name == "REMORA-research"]
          assert not bad, f"repo root leaked onto sys.path: {bad}"
          import servers.api                      # the serve entrypoint imports
          from remora.governance.envelope import load_decision_envelope_schema
          load_decision_envelope_schema()         # packaged schemas/ resolves
          CHECK

          # FT-01/FT-02 DoD: the execution lifecycle and outbox must work
          # from the installed distribution, including the packaged
          # lifecycle schema the model loads at runtime.
          "$PY" - <<CHECK
          from remora.governance.lifecycle import LifecycleTracker, default_model
          from remora.enforcement.outbox import ExecutionOutbox, OutboxState
          model = default_model()
          assert "DISPATCH_PENDING" in model.states, "packaged schema not loaded"
          tracker = LifecycleTracker()
          tracker.apply("engine_decision")
          tracker.apply("verify_or_escalate")
          assert tracker.state == "REVIEW_PENDING"
          outbox = ExecutionOutbox()
          row = outbox.record_intent(
              proposal_id="p", tenant_id="t", item_id="i", tool_name="n",
              tool_call_hash="h" * 64, grant_jti="j",
          )
          outbox.claim(row.outbox_id, worker_id="w")
          outbox.settle(row.outbox_id, OutboxState.SUCCEEDED)
          assert outbox.get(row.outbox_id).state is OutboxState.SUCCEEDED
          CHECK

          # FT-13: the SDK surface must hold from the installed wheel too —
          # every snapshot-declared public symbol importable, and the client
          # constructible without a server.
          "$PY" - <<CHECK
          import json
          import remora.sdk as sdk
          snapshot = json.load(open("$GITHUB_WORKSPACE/artifacts/sdk/public_api_v1.json"))
          missing = [s for s in snapshot["symbols"] if not hasattr(sdk, s)]
          assert not missing, f"wheel is missing public SDK symbols: {missing}"
          client = sdk.RemoraClient("http://localhost:1", token="t")
          client.close()
          CHECK

          # doctor must report the api entrypoint as genuinely importable.
          "$PY" -m remora doctor --json | tee doctor.json
          "$PY" - <<'CHECK'
          import json
          d = json.load(open("doctor.json"))
          assert d["ok"], "doctor hard checks failed on installed wheel"
          api = [c for c in d["checks"] if c["check"] == "api extra (remora serve)"]
          assert api and api[0]["ok"], f"api entrypoint check failed: {api}"
          CHECK

          # serve must actually come up and answer the liveness probe.
          "$PY" -m remora serve --port 8765 &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:8765/v1/health > /dev/null; then
              echo "health OK after ${i}s"; break
            fi
            if [ "$i" = "30" ]; then echo "ERROR: /v1/health never came up" >&2; kill $SERVE_PID; exit 1; fi
          done
          curl -sf http://127.0.0.1:8765/v1/health
          kill $SERVE_PID

  deterministic-round:
    # Issue #84 / external review F-06: the documented fail-hard reproduction
    # round must be green in CI, not just by convention. The round REGENERATES
    # result files, so this job verifies in a throwaway workspace and never
    # commits. Deterministic on Linux EXCEPT provenance sidecars (git_commit /
    # generated_at / worktree state) and toolcall_blind_v3_results.json
    # (embeds a run timestamp and platform path separators) — those get
    # semantic checks instead of byte-diff (unscoped `git diff --exit-code`
    # false-fails, verified empirically 2026-07-30).
    name: Deterministic reproduction round (verify-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal]" -c /tmp/constraints.txt

      - name: Run the full deterministic round (fail-hard)
        run: python scripts/run_deterministic_round_2026_07.py

      - name: Byte-determinism outside the known-variable files
        run: |
          CHANGED=$(git diff --name-only -- . \
            ':(exclude)*.provenance.json' \
            ':(exclude)results/toolcall_blind_v3_results.json')
          if [ -n "$CHANGED" ]; then
            echo "ERROR: round changed files that must be byte-deterministic:" >&2
            echo "$CHANGED" >&2
            git diff --stat -- $CHANGED >&2
            exit 1
          fi
          echo "byte-determinism holds outside the known-variable files"

      - name: Semantic compare for the timestamped artifact
        run: |
          python - <<'PY'
          import json, subprocess, sys

          PATH = "results/toolcall_blind_v3_results.json"
          VOLATILE_KEYS = {"generated_at", "timestamp", "run_timestamp"}

          def normalize(obj):
              if isinstance(obj, dict):
                  return {k: normalize(v) for k, v in sorted(obj.items())
                          if k not in VOLATILE_KEYS}
              if isinstance(obj, list):
                  return [normalize(v) for v in obj]
              if isinstance(obj, str):
                  return obj.replace("\\", "/")
              return obj

          committed = json.loads(subprocess.run(
              ["git", "show", f"HEAD:{PATH}"],
              capture_output=True, text=True, check=True).stdout)
          regenerated = json.load(open(PATH, encoding="utf-8"))
          a, b = normalize(committed), normalize(regenerated)
          if a != b:
              for key in sorted(set(a) | set(b)):
                  if a.get(key) != b.get(key):
                      print(f"DIVERGES at top-level key: {key}", file=sys.stderr)
              sys.exit(1)
          print("semantic compare (volatile keys stripped): identical")
          PY

      - name: Sidecar self-consistency
        # Every sidecar the round wrote must hash-bind the artifact next to it
        # (LF-normalized SHA-256, the manifest protocol).
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys

          changed = subprocess.run(
              ["git", "diff", "--name-only", "--", "*.provenance.json"],
              capture_output=True, text=True, check=True).stdout.split()
          if not changed:
              print("ERROR: the round wrote no sidecars — orchestrator broken",
                    file=sys.stderr)
              sys.exit(1)
          errors = []
          for rel in changed:
              sidecar = pathlib.Path(rel)
              prov = json.loads(sidecar.read_text(encoding="utf-8"))
              # The sidecar's "artifact" field is the bare filename; the
              # artifact always lives NEXT TO its sidecar (caught in the
              # local rehearsal of this job, 2026-07-30).
              artifact = sidecar.parent / prov["artifact"]
              if not artifact.exists():
                  errors.append(f"{rel}: artifact missing: {artifact}")
                  continue
              data = artifact.read_bytes().replace(b"\r\n", b"\n")
              actual = hashlib.sha256(data).hexdigest()
              if actual != prov["artifact_sha256"]:
                  errors.append(f"{rel}: artifact_sha256 mismatch")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"sidecar self-consistency OK for {len(changed)} sidecars")
          PY

  artifact-integrity:
    name: Key artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify key result artifacts exist and are non-empty
        run: |
          python - <<'PY'
          import pathlib, sys
          required = [
              "results/external_benchmark_agentharm_v1.json",
              "results/false_accept_regression_v1.json",
              "results/toolcall_blind_v3_results.json",
              "results/selective_n500_holdout_results.json",
              "results/toolcall_benchmark_v2_results.json",
              "results/m1_flag_coverage.json",
              "docs/assurance/remediation_register.yaml",
              "docs/assurance/release_gates.md",
              "docs/assurance/statistical_analysis_plan.md",
          ]
          missing = [p for p in required if not pathlib.Path(p).exists() or pathlib.Path(p).stat().st_size == 0]
          if missing:
              for p in missing:
                  print(f"MISSING or empty: {p}", file=sys.stderr)
              sys.exit(1)
          print(f"All {len(required)} required artifacts present and non-empty.")
          PY

      - name: Verify manifest checksums (content integrity)
        # Research audit 2026-07-27: existence + FAR-field reads are not
        # integrity. Every artifact row carrying a sha256 in
        # artifact_manifest_v1.md is now content-verified (LF-normalized,
        # matching the manifest's hash protocol). An edited artifact can no
        # longer pass silently.
        run: |
          python - <<'PY'
          import hashlib, pathlib, re, sys
          text = pathlib.Path("docs/assurance/artifact_manifest_v1.md").read_text(encoding="utf-8")
          rows = re.findall(r"\|\s*`([^`]+)`\s*\|\s*`([0-9a-f]{64})`\s*\|", text)
          if len(rows) < 10:
              print(f"ERROR: only {len(rows)} checksummed rows parsed from manifest — parser drift?", file=sys.stderr)
              sys.exit(1)
          errors = []
          for path, expected in rows:
              p = pathlib.Path(path)
              if not p.exists():
                  errors.append(f"MISSING: {path}")
                  continue
              actual = hashlib.sha256(p.read_bytes().replace(b"\r\n", b"\n")).hexdigest()
              if actual != expected:
                  errors.append(f"CHECKSUM MISMATCH: {path}")
          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print(f"Manifest content integrity: {len(rows)} artifacts verified (sha256, LF-normalized)")
          PY

      - name: Verify FAR fields in primary artifacts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          checks = {
              "results/external_benchmark_agentharm_v1.json": "false_accept_rate",
              "results/false_accept_regression_v1.json": "false_accept_rate",
              "results/toolcall_blind_v3_results.json": "false_accept_rate",
          }
          errors = []
          for path, field in checks.items():
              p = pathlib.Path(path)
              if not p.exists():
                  errors.append(f"MISSING: {path}")
                  continue
              data = json.loads(p.read_bytes())
              if field not in data:
                  errors.append(f"Field '{field}' missing in {path}")
                  continue
              val = float(data[field])
              if val != 0.0:
                  errors.append(f"FAR = {val} (non-zero) in {path} — hard stop")
          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("FAR integrity check: all three primary artifacts have false_accept_rate = 0.0")
          PY

  fresh-install-contract:
    # Issue #422: the EXACT documented onboarding command must work in a
    # clean environment. Every other job installs extra extras and masked
    # a fresh clone failing collection with nine missing fastapi imports.
    name: Documented fresh install collects the whole suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The verbatim README command
        run: python -m pip install -e ".[dev]"

      - name: Full-suite collection succeeds
        run: python -m pytest tests/ -q --collect-only > /dev/null && echo "collection clean"

  container-contract:
    # Issue #89: the locked pilot runtime. Builds the reference image FROM
    # THE WHEEL (deploy/reference/Dockerfile, base pinned by digest,
    # non-root) and runs the contract smoke INSIDE it: the CLI resolves
    # from the installed wheel and the API answers /v1/health. The compose
    # topology (API + digest-pinned Postgres) must parse. The image digest
    # is printed so a release can record it for byte-for-byte pilot
    # reproducibility.
    name: Container fulfils the contract from inside the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build the reference image
        run: docker build -f deploy/reference/Dockerfile -t remora-reference:ci .

      - name: Record the image digest
        run: docker inspect --format 'image id {{.Id}}' remora-reference:ci

      - name: Compose topology parses
        run: docker compose -f deploy/reference/docker-compose.yml config --quiet

      - name: In-image CLI smoke (remora doctor --json)
        run: |
          set -euo pipefail
          docker run --rm remora-reference:ci remora doctor --json \
            | python3 -c "import json,sys; json.load(sys.stdin); print('doctor emits valid JSON from the installed wheel')"

      - name: In-image API smoke (/v1/health answers 200)
        run: |
          set -euo pipefail
          docker run -d --name remora-ci -p 8000:8000 remora-reference:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs remora-ci | tail -n 20
          docker rm -f remora-ci >/dev/null
          [ "$ok" = "1" ] || { echo "/v1/health never answered"; exit 1; }

  deterministic-suite-required:
    # RMR-007: branch protection can only require named contexts, and the legs
    # above have matrix-expanded names that drift as the suite grows. This
    # aggregator is the stable required context for the whole workflow: it
    # runs always() — even when a leg failed, which is exactly when its
    # verdict matters — and fails unless every aggregated leg reported
    # success. A leg that errors before it starts (runner lost, queue
    # timeout) reads as failure here, not as absence.
    if: always()
    needs:
      - test
      - opa-conformance
      - postgres-contract
      - documentation-governance
      - lockfile-check
      - wheel-contract
      - deterministic-round
      - artifact-integrity
      - container-contract
      - fresh-install-contract
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every aggregated leg succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          not_ok = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if not_ok:
              print(f"aggregated legs not green: {not_ok}", file=sys.stderr)
              sys.exit(1)
          print(f"all {len(needs)} aggregated legs succeeded")
          PY
