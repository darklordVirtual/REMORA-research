name: CodeQL (SAST)

# Phase 14 supply-chain hardening: static analysis over the Python runtime,
# the TypeScript workers and the frontend. Additive — the deterministic and
# research assurance gates in ci.yml / quality-gates.yml stay authoritative
# for behavior; this gate covers code-level security patterns.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # weekly sweep so new queries land without a push

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  codeql-required:
    # RMR-007: branch protection can only require named contexts, and the
    # analyze leg has a matrix-expanded name that drifts as languages come
    # and go. This aggregator is the stable required context: it runs
    # always() — even when a leg failed, which is exactly when its verdict
    # matters — and fails unless every aggregated leg reported success. A
    # leg that errors before it starts (runner lost, queue timeout) reads as
    # failure here, not as absence.
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every aggregated leg succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          not_ok = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if not_ok:
              print(f"aggregated legs not green: {not_ok}", file=sys.stderr)
              sys.exit(1)
          print(f"all {len(needs)} aggregated legs succeeded")
          PY
