name: Compile Paper PDF

on:
  push:
    branches: [master]
    paths:
      - 'paper/remora_paper.tex'
      - '.github/workflows/compile-paper.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX → PDF
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: remora_paper.tex
          working_directory: paper
          latexmk_use_xelatex: false
          extra_system_packages: "py3-pygments"

      # Layout guard: fail the build if any word protrudes into the page
      # margin or crosses the inter-column gutter (overwide tables,
      # unbreakable tokens). Prevents shipping a PDF with column overflow.
      - name: Check column/margin overflow
        run: |
          # Pinned to the exact version resolved from
          # https://pypi.org/pypi/pymupdf/json on 2026-07-20.
          python -m pip install --quiet pymupdf==1.28.0
          python scripts/check_paper_overflow.py paper/remora_paper.pdf

      # Only master owns the committed PDF, but master is a protected branch
      # (PRs only + required checks): a direct auto-commit push is rejected
      # with GH006 and reds this job (happened 2026-08-05). The refreshed PDF
      # therefore ships as an auto-maintained PR on the ci/paper-pdf branch;
      # merging it stays a human decision. Branch runs (workflow_dispatch)
      # still validate compile + layout without committing, which prevents the
      # recurring binary merge conflict of PDF-carrying feature branches.
      #
      # Known limitation: PRs opened with GITHUB_TOKEN do not trigger the
      # required checks. Close/reopen the PR to start them, or merge with the
      # admin override — the PR only ever contains the CI-compiled PDF.
      - name: Open PR with refreshed PDF
        if: github.ref == 'refs/heads/master'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: paper/remora_paper.pdf
          branch: ci/paper-pdf
          delete-branch: true
          commit-message: "ci: compile remora_paper.pdf from LaTeX source"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          title: "ci: refresh compiled paper PDF"
          body: |
            Auto-generated by `compile-paper.yml`: `paper/remora_paper.pdf`
            recompiled from `paper/remora_paper.tex` at ${{ github.sha }},
            layout guard (`scripts/check_paper_overflow.py`) passed.

            PRs opened with `GITHUB_TOKEN` do not trigger required checks —
            close/reopen this PR to start them, or merge with the admin
            override.
