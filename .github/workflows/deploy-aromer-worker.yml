name: Deploy AROMER Worker to Cloudflare

on:
  push:
    branches: [master]
    paths:
      - "workers/aromer/**"
  workflow_dispatch:

concurrency:
  group: deploy-aromer-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploy only when Cloudflare credentials are configured for this repo
    # (repo convention: codegraph-index.yml, deploy-frontend.yml). Without
    # them, install still validates the worker and the deploy step reports
    # a loud, visible skip instead of failing the push-triggered run red.
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: workers/aromer
        run: npm ci

      - name: Warn when Cloudflare secrets are absent
        if: env.HAS_CF_SECRETS != 'true'
        run: >-
          echo "::warning title=AROMER deploy skipped::CLOUDFLARE_API_TOKEN /
          CLOUDFLARE_ACCOUNT_ID not configured — the live worker was NOT
          updated and may be stale relative to workers/aromer."

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_SECRETS == 'true'
        working-directory: workers/aromer
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
