name: Mutation Testing (scheduled)

# Issue #280: the scoped mutation sweep over the grant/lease/PEP consumption
# paths, failing on NEW survivors against the committed baseline
# (docs/assurance/mutation_baseline_v1.txt). Scheduled, not per-PR: at the
# current baseline a per-PR gate would be noise, and the ratchet direction
# is enforced by the baseline file living in reviewed diffs.
#
# Two lessons from the first measured pass are load-bearing here
# (docs/assurance/mutation_testing_v1.md):
#   * the runner environment must carry DEPENDENCIES ONLY — an installed
#     remora package shadows the mutated sources and silently makes every
#     mutant invisible (a 0-killed sweep that looks like a catastrophe and
#     is actually a broken experiment);
#   * the sweep must run from a native filesystem (trivially true on the
#     hosted runner; recorded because the local WSL/9p variant is not).

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:
  # The evidence-sufficiency sweep is a minute of work with a stable baseline,
  # so it also runs on every pull request that touches its inputs; the
  # enforcement sweep stays scheduled (see the job condition below).
  pull_request:
    paths:
      - "conformance/evidence-sufficiency-v1/**"
      - "conformance/evidence-sufficiency-v1.1/**"
      - "conformance/evidence-sufficiency-v1.2/**"
      - "conformance/evidence-sufficiency-v1.3/**"
      - "conformance/evidence-sufficiency-v1.4/**"
      - "conformance/evidence-sufficiency-v1.5/**"
      - "conformance/evidence-sufficiency-v1.6/**"
      - "conformance/evidence-sufficiency-v1.7/**"
      - "scripts/mutation_evidence_sufficiency.py"
      - "scripts/mutation_evidence_sufficiency_ast.py"
      - "scripts/spec_mutation_evidence_sufficiency.py"
      - "scripts/rule_coverage_evidence_sufficiency.py"
      - "docs/assurance/mutation_baseline_evidence_sufficiency_v1.txt"
      - "docs/assurance/spec_mutation_baseline_evidence_sufficiency_v1.txt"
      - "docs/assurance/mutation_baseline_evidence_sufficiency_ast_v1.txt"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    name: Scoped mutation sweep vs baseline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A real Postgres, because production runs the PEP ledger and the lease
    # nonce store on it. Without one, every mutant in their Postgres branches
    # survived as "unreachable" (2026-10-13). The sweep's own variable keeps the
    # other DSN-gated modules skipping, so the parallel workers do not race on
    # shared tables; tests/test_enforcement_ledgers_postgres.py isolates each
    # worker in its own schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remora
          POSTGRES_PASSWORD: remora
          POSTGRES_DB: remora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REMORA_ENFORCEMENT_PG_DSN: postgresql://remora:remora@localhost:5432/remora_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies ONLY (never the package)
        # pip install -e pulls the dependency tree; the uninstall then
        # removes the package itself so `import remora` resolves to the
        # mutants sandbox, not the installed original. Skipping the
        # uninstall is the editable-install trap documented in the report.
        # The guard must run from OUTSIDE the checkout: from the repo root
        # `import remora` always succeeds via the cwd source tree (which is
        # exactly what mutmut's sandbox relies on). What must NOT resolve is
        # a site-packages installation — so probe from a neutral directory.
        run: |
          # SR-11 (SEC-19): dependencies come ONLY from the hash-pinned
          # requirements-mutation.lock (the dev, api and postgres extras plus
          # mutmut==3.8.0, version-constrained by requirements-lock.txt). The
          # package itself is never installed, so there is nothing to build;
          # the uninstall stays as the guard against a stray installed copy.
          python -m pip install -q --require-hashes -r requirements-mutation.lock
          python -m pip uninstall -q -y remora-assurance
          cd "$RUNNER_TEMP"
          python -c "import remora" 2>/dev/null && { echo "remora resolves outside the checkout — mutants would be invisible"; exit 1; } || echo "no installed package; sandbox imports will win"

      - name: The Postgres ledger contract runs, not skips
        # A skip here would quietly return the Postgres branches to "unreachable".
        run: |
          python -m pytest tests/test_enforcement_ledgers_postgres.py -q -rs | tee pg.txt
          if grep -qiE "skipped|no tests ran" pg.txt; then
            echo "ERROR: Postgres ledger contract skipped despite the service" >&2
            exit 1
          fi

      - name: Run the scoped sweep
        # The log is kept: a stats-phase failure names the module the sandbox
        # could not collect, and the gate below reads it back.
        run: |
          set -o pipefail
          mutmut run 2>&1 | tee mutation-run.log

      - name: The sweep measured something
        # 2026-11-02: the sandbox could not collect one selected module, the
        # stats phase failed before any mutant ran, and the red job sat for
        # two days. A sweep that produced no stats, no mutants or no results
        # fails here by name, and the issue step below makes it visible.
        if: always()
        run: |
          python scripts/check_mutation_sweep_measured.py mutation-run.log

      - name: Compare survivors against the committed baseline
        run: |
          mutmut results > mutation-results.txt
          test -s mutation-results.txt || { echo "[FAIL] mutmut results is empty" >&2; exit 1; }
          python scripts/check_mutation_baseline.py mutation-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            mutation-run.log
          retention-days: 90

      - name: Open or update the tracking issue when the sweep did not measure
        # A failed scheduled run notifies nobody by itself. One issue, found by
        # its title and reopened or commented rather than duplicated, is the
        # signal a maintainer sees.
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Mutation sweep failed: measured nothing or found new survivors"
          body="The scheduled mutation sweep failed on \`${GITHUB_SHA}\`: ${RUN_URL}. Read the job log: a collection error names the module the sandbox is missing (add its path to \`also_copy\` in \`[tool.mutmut]\`); new survivors are listed by the baseline step (kill or argue each in \`tests/data/mutation_equivalent_*.txt\`). See docs/assurance/mutation_testing_v1.md."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "assurance" || gh issue create --title "$title" --body "$body"
          fi

  evidence-sufficiency:
    # docs/design/evidence-sufficiency-v1.3.md D-10: the checker sweep, scored
    # by the v1.3 corpus, ratcheted against a baseline of named survivors.
    # The sandbox needs only pytest and mutmut; the runner is standard library.
    # mutmut is pinned because mutant ids are stable only within one version
    # (the baseline header records it).
    name: Evidence-sufficiency checker sweep vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the sweep tool and the scoring dependencies
        # The hash-pinned mutation lock carries pytest 9.1.1 and mutmut 3.8.0
        # (a superset of what this sweep needs).
        run: python -m pip install -q --require-hashes -r requirements-mutation.lock

      - name: Run the sweep and compare against the committed baseline
        run: python scripts/mutation_evidence_sufficiency.py --results-out mutation-es-results.txt

      - name: Run the second operator set (first- and second-order) against its baseline
        run: python scripts/mutation_evidence_sufficiency_ast.py --workers 4 --json mutation-es-ast-results.json

      - name: Run the specification mutants of model.json against their baseline
        # v1.3 spec sections 13 and 14: mutants of the rules, not of checker.py, each run as a
        # checker and scored by v1.5; the held-out catalogue is a measurement and is uploaded.
        run: |
          python scripts/spec_mutation_evidence_sufficiency.py --workers 4 --json mutation-es-spec-results.json
          python scripts/spec_mutation_evidence_sufficiency.py --catalogue heldout --workers 4 --json mutation-es-spec-heldout.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-evidence-sufficiency-results
          path: |
            mutation-es-results.txt
            mutation-es-ast-results.json
            mutation-es-spec-results.json
            mutation-es-spec-heldout.json
          retention-days: 90
