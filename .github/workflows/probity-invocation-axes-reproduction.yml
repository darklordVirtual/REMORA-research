name: Probity invocation axes (reproduction)

# REMORA re-runs Probity's separately maintained invocation_axes reader, pinned
# to a commit, and pairs it with REMORA's own effect-evidence-v1 reference
# verifier at the frozen revision. The corpus pins one MCP tools/call and judges
# a decision capture package and an execution bundle on three separate claims:
# package integrity, request and decision correspondence, and observed effect.
#
# The pairing step hands each execution bundle to REMORA's verifier, with one
# field mapping (observation.fields -> observed), and records where the two
# agree on the observed effect. REMORA's contract carries no call binding, no
# capture decision and no observer identity, so the bundles that turn on those
# are listed in EXPECTED_SPLIT. A change in that list fails the job.
#
# A second pairing step hands the same bundles to effect-evidence-v2, which
# carries those three facts (#918). Its split is listed in EXPECTED_V2_SPLIT.
#
# This is a REPRODUCTION kept as a CI artifact. It changes no file under
# artifacts/interop, advances no lifecycle, creates no REMORA authority and
# never feeds a policy decision.
#
# Deterministic: no secrets; network only for the pinned checkout. The reader
# uses the Python standard library only, so nothing is installed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/probity-invocation-axes-reproduction.yml"
      - "artifacts/interop/effect-evidence-v2/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/probity-invocation-axes-reproduction.yml"
      - "artifacts/interop/effect-evidence-v1/**"
      - "artifacts/interop/effect-evidence-v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probity-invocation-axes-reproduction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  READER_REPOSITORY: probityai/agent-evidence-vectors
  READER_COMMIT: d2bdacc7e7a4b6af15c513f622a32367cba962b1
  # REMORA revision effect-evidence-v1 was frozen at (#728).
  FROZEN_REVISION: fe324dd734734d9227aa894330ac52c2bb916b94
  # Bundles REMORA's verifier alone reads as EFFECT_VERIFIED while the reader's
  # observed_effect is not ESTABLISHED, with the reader's reason for each.
  # The corpus shape at READER_COMMIT. The pairing skips a case without a
  # bundle, so the split alone would stay green if bundles went missing.
  EXPECTED_CASES: "23"
  EXPECTED_BUNDLES: "22"
  EXPECTED_WITHOUT_BUNDLE: "no_execution_bundle"
  EXPECTED_SPLIT: >-
    bundle_for_other_call=bundle_bound_to_other_call
    dispatched_after_deny=dispatched_after_deny
    observation_from_the_tool=observation_not_independent
  # effect-evidence-v2 (#918) carries the call binding, captured decision and
  # observer, and refuses the three bundles above. It is stricter than the
  # reader on three others: the reader's observed_effect axis does not require
  # an allow bound to the invocation, and v2 attests to no effect without one.
  # Each entry is case=reader_reason/remora_lineage_status.
  EXPECTED_V2_SPLIT: >-
    decision_absent=independent_observation_matches_declared_delta/assessment_decision_unknown
    decision_bound_to_other_request=independent_observation_matches_declared_delta/dispatch_not_authorized
    member_missing=independent_observation_matches_declared_delta/assessment_decision_unknown

jobs:
  reproduce:
    name: Invocation axes on Python ${{ matrix.python }} (REPRODUCTION; advances nothing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.15", "3.14.7"]

    steps:
      - name: Checkout REMORA (full history, so the frozen revision is reachable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Probity reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ${{ env.READER_REPOSITORY }}
          ref: ${{ env.READER_COMMIT }}
          path: probity-readers
          persist-credentials: false

      - name: Assert every pin
        run: |
          set -euo pipefail
          test "$(git -C probity-readers rev-parse HEAD)" = "$READER_COMMIT"
          git cat-file -e "$FROZEN_REVISION^{commit}"
          git merge-base --is-ancestor "$FROZEN_REVISION" HEAD
          mkdir -p ci-artifacts/probity-invocation-axes-reproduction
          cat > ci-artifacts/probity-invocation-axes-reproduction/PINS.txt <<EOF
          class=REPRODUCTION (adds no state, no authority, no lifecycle change)
          remora_head=$(git rev-parse HEAD)
          remora_frozen_revision=$FROZEN_REVISION
          reader_repository=$READER_REPOSITORY
          reader_commit=$READER_COMMIT
          python=${{ matrix.python }}
          run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat ci-artifacts/probity-invocation-axes-reproduction/PINS.txt

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run Probity's invocation_axes reader
        # The reader checks every corpus member against its manifest, judges
        # all cases without reading their expected answers, and exits 1 if
        # any case differs.
        working-directory: probity-readers/packaging
        run: |
          set -euo pipefail
          python -m agent_evidence_vectors.invocation_axes.run \
            --output "$GITHUB_WORKSPACE/ci-artifacts/probity-invocation-axes-reproduction/reader" \
            --implementation-revision "$READER_COMMIT" \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/probity-invocation-axes-reproduction/reader.log"

      - name: Pair each execution bundle with REMORA's effect-evidence-v1 verifier
        run: |
          python - <<'PY'
          import importlib.util, json, os, subprocess, sys
          from pathlib import Path
          frozen = os.environ["FROZEN_REVISION"]
          out = Path("ci-artifacts/probity-invocation-axes-reproduction")
          package = "artifacts/interop/effect-evidence-v1"
          verifier = out / "remora_reference_verifier.py"
          verifier.write_bytes(subprocess.run(["git", "show", f"{frozen}:{package}/reference_verifier.py"], capture_output=True, check=True).stdout)
          spec = importlib.util.spec_from_file_location("remora_effect_reference", verifier)
          remora = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(remora)
          fixtures = json.loads(subprocess.run(["git", "show", f"{frozen}:{package}/fixtures.json"], capture_output=True, check=True).stdout)
          control = [c["id"] for c in fixtures["cases"]
                     if remora.evaluate(c) != {k: c["expected"][k] for k in ("effect_status", "highest_established_state")}]
          corpus = Path("probity-readers/packaging/agent_evidence_vectors/invocation_axes/corpus/cases.json")
          case_list = json.loads(corpus.read_text(encoding="utf-8"))["cases"]
          cases = {c["id"]: c for c in case_list}
          report = json.loads((out / "reader/report.json").read_text(encoding="utf-8"))
          rows, split = [], {}
          for result in report["results"]:
              bundle = cases[result["case_id"]].get("execution")
              if bundle is None:
                  continue
              post = dict(bundle.get("postcondition") or {})
              post.setdefault("comparison_rules", {})
              obs = bundle.get("observation")
              got = remora.evaluate({"dispatch": bundle["dispatch"], "execution_report": bundle.get("execution_report"),
                                     "postcondition": post, "observed": None if obs is None else obs.get("fields")})
              ours = result["actual"]["observed_effect"]
              # Binary observed-effect agreement only: REMORA's EFFECT_VERIFIED
              # against the reader's ESTABLISHED. Not contract agreement, and not
              # a REMORA verification of the bundle.
              agree = (got["highest_established_state"] == "EFFECT_VERIFIED") == (ours["result"] == "ESTABLISHED")
              rows.append({"case_id": result["case_id"], "remora_highest_established_state": got["highest_established_state"],
                           "remora": got, "reader_observed_effect": ours, "observed_effect_binary_agree": agree})
              if not agree:
                  split[result["case_id"]] = ours["reason"]
          expected = dict(item.split("=", 1) for item in os.environ["EXPECTED_SPLIT"].split())
          problems = []
          if control:
              problems.append(f"REMORA fixtures failed the control: {control}")
          if split != expected:
              problems.append(f"split {split} != expected {expected}")
          if len(case_list) != int(os.environ["EXPECTED_CASES"]) or len(cases) != len(case_list):
              problems.append(f"expected {os.environ['EXPECTED_CASES']} unique cases, got {len(case_list)} ({len(cases)} unique)")
          without = sorted(i for i, c in cases.items() if c.get("execution") is None)
          if without != os.environ["EXPECTED_WITHOUT_BUNDLE"].split():
              problems.append(f"cases without a bundle: {without}")
          if len(rows) != int(os.environ["EXPECTED_BUNDLES"]):
              problems.append(f"expected {os.environ['EXPECTED_BUNDLES']} paired bundles, got {len(rows)}")
          judged = {r["case_id"] for r in report["results"]}
          if judged != set(cases):
              problems.append(f"reader judged {len(judged)} of {len(cases)} cases")
          summary = {"frozen_revision": frozen, "control_fixtures": len(fixtures["cases"]), "control_failures": control,
                     "cases": len(case_list), "bundles": len(rows),
                     "observed_effect_binary_agree": sum(r["observed_effect_binary_agree"] for r in rows),
                     "split": split, "problems": problems}
          (out / "pairing.json").write_text(json.dumps({"summary": summary, "rows": rows}, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          sys.exit(1 if problems else 0)
          PY

      - name: Pair each execution bundle with REMORA's effect-evidence-v2 verifier
        # v2 is DRAFT at this revision. Its manifest pins are checked first, so
        # the pairing runs the bytes index.json names. The mapping from a
        # Probity bundle to a v2 case is the job's assumption, stated in the
        # package README: allow is read as accept, and the observation source
        # label stands in for the observer configuration a deployment holds.
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          package = Path("artifacts/interop/effect-evidence-v2")
          out = Path("ci-artifacts/probity-invocation-axes-reproduction")
          manifest = json.loads((package / "manifest.json").read_text(encoding="utf-8"))
          for entry in manifest["package_files"]:
              actual = hashlib.sha256(Path(entry["path"]).read_bytes()).hexdigest()
              if actual != entry["sha256"]:
                  sys.exit(f"{entry['path']} does not match its manifest pin")
          spec = importlib.util.spec_from_file_location("remora_effect_v2", package / "reference_verifier.py")
          v2 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(v2)
          fixtures = json.loads((package / "fixtures.json").read_text(encoding="utf-8"))
          control = [c["id"] for c in fixtures["cases"]
                     if v2.evaluate(c) != {k: c["expected"][k] for k in v2.OUTCOME_KEYS}]
          corpus = Path("probity-readers/packaging/agent_evidence_vectors/invocation_axes/corpus/cases.json")
          cases = {c["id"]: c for c in json.loads(corpus.read_text(encoding="utf-8"))["cases"]}
          report = json.loads((out / "reader/report.json").read_text(encoding="utf-8"))
          executor = {"proposed_by": "agent", "executed_by": "tool", "control_domain": "executor-domain"}
          rows, split = [], {}
          for result in report["results"]:
              case = cases[result["case_id"]]
              bundle = case.get("execution")
              if bundle is None:
                  continue
              text = case["capture"]["objects"].get("decision.json")
              decision = None
              if text is not None:
                  captured = json.loads(text)
                  verdict = {"allow": "accept"}.get(captured.get("decision"), captured.get("decision"))
                  decision = {"call": captured.get("request_binding"), "verdict": verdict, "approved": False}
              obs = bundle.get("observation")
              observer = None
              if obs is not None:
                  observer = ({"id": "independent-reader", "control_domain": "reader-domain", "read_only": True}
                              if obs.get("source") == "independent_reader"
                              else {"id": "tool", "control_domain": "executor-domain", "read_only": False})
              post = dict(bundle.get("postcondition") or {})
              post.setdefault("comparison_rules", {})
              got = v2.evaluate({"invocation": result["actual"]["invocation_binding"], "decision": decision,
                                 "bundle_call": bundle.get("call_binding"), "executor": executor, "observer": observer,
                                 "dispatch": bundle["dispatch"], "execution_report": bundle.get("execution_report"),
                                 "postcondition": post, "observed": None if obs is None else obs.get("fields")})
              ours = result["actual"]["observed_effect"]
              # Binary observed-effect agreement only, as in the v1 step.
              agree = (got["highest_established_state"] == "EFFECT_VERIFIED") == (ours["result"] == "ESTABLISHED")
              rows.append({"case_id": result["case_id"], "remora_v2": got, "reader_observed_effect": ours,
                           "observed_effect_binary_agree": agree})
              if not agree:
                  split[result["case_id"]] = f"{ours['reason']}/{got['lineage_status']}"
          expected = dict(item.split("=", 1) for item in os.environ["EXPECTED_V2_SPLIT"].split())
          problems = []
          if control:
              problems.append(f"v2 fixtures failed the control: {control}")
          if split != expected:
              problems.append(f"v2 split {split} != expected {expected}")
          if len(rows) != int(os.environ["EXPECTED_BUNDLES"]):
              problems.append(f"expected {os.environ['EXPECTED_BUNDLES']} paired bundles, got {len(rows)}")
          v1_split = set(os.environ["EXPECTED_SPLIT"].split())
          if any(item.split("=", 1)[0] in split for item in v1_split):
              problems.append("a bundle v1 cannot judge still splits under v2")
          summary = {"package_digest": manifest["package_digest"], "control_fixtures": len(fixtures["cases"]),
                     "control_failures": control, "bundles": len(rows),
                     "observed_effect_binary_agree": sum(r["observed_effect_binary_agree"] for r in rows),
                     "split": split, "problems": problems}
          (out / "pairing-v2.json").write_text(json.dumps({"summary": summary, "rows": rows}, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          sys.exit(1 if problems else 0)
          PY

      - name: Retain the reproduction (evidence only; nothing reads it back)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probity-invocation-axes-reproduction-${{ matrix.python }}-${{ github.sha }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
          path: ci-artifacts/probity-invocation-axes-reproduction
