name: Quality Gates

on:
  push:
    # The repository's default branch is `master` — with `[main]` only, this
    # entire pipeline (lint, coverage, safety gate, claim gates) never ran on
    # push (2026-07-02 review finding).
    branches: [main, master]
  pull_request:

# CI-economics review 2026-08-05: supersede outdated PR runs; never cancel master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Real Postgres alongside the coverage run (2026-08-26, external review):
    # the Postgres adapters in enforcement/gate.py and enforcement/outbox.py
    # were contract-tested in ci.yml's dedicated job WITHOUT coverage
    # instrumentation, so the TCB percentage reported here was "covered by
    # the in-process suite", not the union. With the DSN set, the DSN-gated
    # tests execute in a second pytest pass (with --cov-append) and the
    # coverage number is the union of in-process and real-service paths.
    # The DSN is NOT set job-wide: execution_api prefers REMORA_PG_DSN over
    # REMORA_CHAIN_DB, so a job-wide DSN silently pointed every in-memory
    # test at one shared database (20 failures on the first attempt).
    # ci.yml keeps its separate contract job as the must-not-skip
    # operational evidence.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remora
          POSTGRES_PASSWORD: remora
          POSTGRES_DB: remora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 bundles npm 11. The regenerated package-lock.json requires
          # npm >= 11 for `npm ci` — npm 10 (bundled with Node 22) rejects it
          # with missing @emnapi/* lock entries (verified 2026-07-20).
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          # Constraints (-c) = version pinning from requirements-lock.txt; the
          # extras drive what gets installed. Filter out -e/comment lines that
          # pip rejects in a constraints file.
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api,security,postgres]" -c /tmp/constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # servers/ joined the gate 2026-08-20: 4k lines of audit-chain
        # hashing, signing and both API surfaces had never been type-checked.
        # disallow_untyped_defs for the trusted computing base is configured
        # in pyproject.toml — without it mypy skips unannotated function
        # bodies entirely, so an untyped function on the ACCEPT path was
        # invisible no matter how wide the scope.
        run: mypy remora servers --ignore-missing-imports

      - name: Generate canonical results snapshot
        run: python scripts/generate_results_snapshot.py

      - name: Generated-doc drift (full-deps generators)
        # The v2 failure analysis imports remora.*, so it needs the installed
        # package (present in this job). A committed generated doc that no
        # longer matches its source fails here. The text-only generators are
        # additionally checked in ci.yml's documentation-governance job.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python experiments/toolcall_v2_failure_analysis.py
          git diff --exit-code -- docs/failure_analysis.md results/toolcall_benchmark_v2_failures.json

      - name: Verify claim consistency
        run: python scripts/check_claim_consistency.py

      - name: Claim provenance gate (register/artifact/manifest/doc binding)
        run: python scripts/check_claim_provenance.py

      - name: OpenAPI contract drift gate
        # schemas/openapi.json is the committed, reviewable contract a client
        # generator consumes; drift between it and the live app is a red
        # build, not a surprise downstream.
        run: python scripts/export_openapi.py --check

      - name: README-claim and leakage gates (need the installed package)
        # Also `make audit`-only until 2026-07-31. check_readme_claims imports
        # the modules the README names, so a README claiming a component that
        # no longer exists now fails here; the leakage gate re-asserts the M1
        # input contract; _check_imports catches a core module that stopped
        # importing cleanly.
        run: |
          python scripts/check_readme_claims.py
          python scripts/check_no_evaluation_leakage.py
          python scripts/_check_imports.py

      - name: Run tests with coverage
        # 60 -> 75 (2026-07-28) -> per-package floors (2026-08-20). A single
        # global number let a well-covered research module pay for a thinly
        # covered enforcement module; branch coverage is on because a
        # statement-only number counts a half-taken `if` as fully covered,
        # which is exactly where fail-closed guards hide. Source and floors
        # live in pyproject.toml and scripts/check_coverage_thresholds.py.
        env:
          # The Ed25519 custody tests are the evidence for the PDP->PEP
          # boundary. Without the security extra they skipped here and the only
          # symptom was a coverage floor -- a missing-evidence failure wearing a
          # coverage-failure costume. This makes the skip impossible.
          REMORA_REQUIRE_SECURITY_EXTRA: "1"
        run: pytest -q --cov --cov-branch --cov-report=term-missing --cov-report=json:coverage.json

      - name: Postgres-backed tests, appended to the same coverage data
        # Second pass with the DSN set, --cov-append so the adapter branches
        # join the in-process numbers. If the DSN-gated tests skipped, the
        # union claim is false, so a skip fails the job.
        env:
          REMORA_PG_DSN: postgresql://remora:remora@localhost:5432/remora_test
          REMORA_REQUIRE_SECURITY_EXTRA: "1"
        run: |
          pytest -q -rs tests/test_execution_api.py tests/test_execution_outbox.py tests/test_postgres_outbox_fault_injection.py tests/conformance/test_execution_boundary_process_split.py -k postgres             --cov --cov-branch --cov-append --cov-report=json:coverage.json | tee /tmp/pg.txt
          if grep -qiE "skipped|no tests ran" /tmp/pg.txt; then
            echo "ERROR: Postgres tests skipped inside the coverage job" >&2; exit 1
          fi

      - name: Per-package coverage floors (trusted computing base)
        run: python scripts/check_coverage_thresholds.py coverage.json

      - name: Documentation and register gates
        # Reported separately from the behaviour suite on purpose: 312 of the
        # tests assert on repository documents and registers, and a
        # documentation drift failing the same way as a governance regression
        # made both harder to read. They still run in the main suite above;
        # this step names them.
        run: pytest -q -m docgate --no-cov

      - name: Safety gate (false accept rate must be zero)
        run: |
          python -m remora.aromer.evals.replay_runner --json | python scripts/check_safety_gate.py

      - name: Quality report
        run: python scripts/quality_report.py

      - name: Install frontend deps
        working-directory: frontend
        # The lockfile was regenerated with npm 11, which records optional
        # platform-variant deps (@emnapi/*) for all platforms, so strict,
        # lockfile-exact `npm ci` works on the Linux runner again. Requires
        # the npm 11 bundled with Node 24 above — npm 10 rejects this lockfile.
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        # Went clean 2026-08-05 (recharts 3.x / react-day-picker v10 / one
        # discriminated-union fix); gated here so type drift fails the
        # pipeline instead of accumulating until deploy time.
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build pilot console UI
        # The OT pilot's console image builds this same bundle in its node
        # stage (deploy/ot-pilot/console/Dockerfile); gating it here means a
        # frontend change cannot silently break the pilot's Docker build.
        working-directory: frontend
        run: npm run pilot:build

      - name: Generated API types drift gate
        # src/generated/remora-api.ts is generated from schemas/openapi.json
        # (itself drift-gated above). Regenerate and diff: a contract change
        # that skips regeneration is a red build, not silent client drift.
        working-directory: frontend
        run: |
          npm run api:types
          git diff --exit-code -- src/generated/remora-api.ts

  worker-envelope-parity:
    # The agent-control Worker writes the live DecisionEnvelope hash chain in
    # TypeScript; auditors verify it in Python. If the two ever disagree on
    # canonical JSON or the entry hash, an intact chain reads as tampered or a
    # tampered one reads as intact.
    #
    # tests/test_worker_envelope_chain.py pins that agreement by executing the
    # real Worker module, but it SKIPS without node + esbuild — and the main
    # pytest job has no JS toolchain, so in that job the contract is not
    # actually gated. This job gives it both runtimes and fails if the parity
    # test skips instead of running.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: workers/agent-control/package-lock.json

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev]" -c /tmp/constraints.txt

      - name: Install worker deps (provides esbuild for the bundle step)
        working-directory: workers/agent-control
        run: npm ci

      - name: Cross-language envelope parity (must run, not skip)
        # -rs prints skip reasons; the grep turns a silent skip into a red leg,
        # because a skipped parity test looks identical to a passing one.
        run: |
          python -m pytest tests/test_worker_envelope_chain.py -q -rs | tee /tmp/parity.txt
          if grep -qi "skipped" /tmp/parity.txt; then
            echo "FAIL: envelope parity test skipped — the JS toolchain is missing in a job that must have it"
            exit 1
          fi

  worker-typecheck:
    # Issue #86 (F-09): the Cloudflare workers were not typechecked by any CI
    # gate, so @cloudflare/workers-types drift (caret ranges float to new
    # builds) surfaced only at deploy time. This gate runs `tsc --noEmit` per
    # worker directory that has a tsconfig.json. A red leg after an upstream
    # workers-types release is real drift to fix, not a flake.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [agent-control, aromer, law-search, mcp-gateway, rag-oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm 11 required (Node 24 bundles it): the worker lockfiles are
          # regenerated with npm 11, which records optional platform-variant
          # deps (@esbuild/*) for all platforms — npm 10 rejects them in
          # strict `npm ci` (same class as the frontend @emnapi note above).
          node-version: "24"
          cache: "npm"
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install deps
        working-directory: workers/${{ matrix.worker }}
        run: npm ci

      - name: Typecheck
        # `npx tsc --noEmit` directly rather than an npm script: script names
        # are inconsistent across workers today (only agent-control defines
        # one), and the gate must not depend on per-package script naming.
        working-directory: workers/${{ matrix.worker }}
        run: npx tsc --noEmit

      - name: Test
        # Only the workers that have a test directory. mcp-gateway carries the
        # governance tests for the MCP surface: that a refusal executes
        # nothing, that a pending proposal executes nothing, and that a
        # redeemed proposal cannot be replayed. Those are safety properties,
        # so they belong in a gate rather than in a developer's habits.
        if: hashFiles(format('workers/{0}/test/**', matrix.worker)) != ''
        working-directory: workers/${{ matrix.worker }}
        run: npm test

  replay-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          # Constraints (-c) = version pinning from requirements-lock.txt; the
          # extras drive what gets installed. Filter out -e/comment lines that
          # pip rejects in a constraints file.
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api,security]" -c /tmp/constraints.txt

      - name: Run heavy live replay tests
        run: |
          pytest -q -m live_replay_heavy \
            tests/test_toolcall_live_exec_results.py \
            tests/test_toolcall_live_cache_replay.py

  quality-gates-required:
    # RMR-007: branch protection can only require named contexts, and the legs
    # above have matrix-expanded names that drift as workers come and go. This
    # aggregator is the stable required context for the whole workflow: it
    # runs always() — even when a leg failed, which is exactly when its
    # verdict matters — and fails unless every aggregated leg reported
    # success. A leg that errors before it starts (runner lost, queue
    # timeout) reads as failure here, not as absence.
    if: always()
    needs: [verify, worker-envelope-parity, worker-typecheck, replay-heavy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every aggregated leg succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          not_ok = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if not_ok:
              print(f"aggregated legs not green: {not_ok}", file=sys.stderr)
              sys.exit(1)
          print(f"all {len(needs)} aggregated legs succeeded")
          PY
