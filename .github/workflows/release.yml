name: Release Provenance

# Tag-triggered (v*.*.*). Builds wheel + sdist from the exact tagged commit,
# generates a CycloneDX SBOM against the lockfile, writes SHA256SUMS, and
# binds every artifact to this repository/workflow/commit with Sigstore via
# GitHub Artifact Attestations (public transparency log). This replaces the
# GPG-signed-tag acceptance criterion in #390: the attestation proves the
# artifacts were built by this workflow at this SHA, which a detached GPG
# signature on the tag object cannot. Verify with:
#   gh attestation verify remora_assurance-<ver>-py3-none-any.whl --repo darklordVirtual/REMORA-research
# Release assets are uploaded to the GitHub release for the tag; the release
# note is authored by hand and must state the run id of this workflow.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # SR-11 / SEC-17: the build job holds NO signing identity, and everything
    # it installs comes from the hash-pinned release lock. A compromised build
    # tool can still alter what it builds; it cannot reach the OIDC token.
    name: Build, SBOM, checksums
    runs-on: ubuntu-latest
    outputs:
      # Consumed by attest and publish-pypi to name the artifact they handle.
      version: ${{ steps.ver.outputs.version }}
      # SHA-256 of SHA256SUMS.txt, passed to attest through the job-output
      # channel rather than inside the artifact it describes.
      sums_sha256: ${{ steps.sums.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse to release unless the tag matches pyproject version
        run: |
          set -euo pipefail
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${PKG}" ]; then
            echo "tag ${GITHUB_REF_NAME} != pyproject version v${PKG}"; exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
        id: ver

      - name: Install hash-pinned build tooling (SR-11 / SEC-17)
        # The build job installs ONLY from the hash-pinned release lock: no
        # unpinned pip upgrades, no bare package installs. requirements-release.lock is generated with
        # `pip-compile --generate-hashes --allow-unsafe requirements-release.in`.
        run: >-
          python -m pip install --require-hashes "--only-binary=:all:" -r requirements-release.lock

      - name: Build wheel and sdist from the tagged commit
        # --no-isolation: the build uses the hash-pinned environment above,
        # never a freshly resolved isolated one.
        run: |
          python -m build --no-isolation --outdir dist/
          ls -l dist/

      - name: CycloneDX SBOM against the lockfile
        run: |
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/sbom-reqs.txt
          cyclonedx-py requirements /tmp/sbom-reqs.txt --of JSON -o dist/sbom-python.cdx.json

      - name: Provenance manifest for this tag (concept records, registers, expressing files)
        run: |
          python scripts/build_provenance_manifest.py --release "${GITHUB_REF_NAME}" --out dist/provenance-manifest-v1.json
          cp docs/assurance/claim_register_v1.yaml docs/assurance/provenance_register_v1.json provenance/PRIOR_ART.yaml provenance/EXTERNAL_ADOPTION.yaml dist/

      - name: SHA256SUMS
        id: sums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum remora_assurance-* sbom-python.cdx.json provenance-manifest-v1.json claim_register_v1.yaml provenance_register_v1.json PRIOR_ART.yaml EXTERNAL_ADOPTION.yaml > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "sha256=$(sha256sum SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

  attest:
    # SR-11 / SEC-17: the signing identity exists only here, in a job that
    # installs nothing. Before signing it checks the downloaded
    # SHA256SUMS.txt against the digest the build job emitted as a job output,
    # then every file against that manifest. A change to the artifact between
    # upload and download (files or manifest) therefore fails the job instead
    # of being attested. Scope: this protects the hand-off between the two
    # jobs; it does not detect a build job that was itself compromised, since
    # that job computes both the manifest and its digest.
    name: Sigstore attestations and release assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write      # upload release assets
      id-token: write      # Sigstore OIDC identity
      attestations: write  # store attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist/

      - name: Verify the manifest digest, then the artifact against the manifest
        working-directory: dist
        env:
          EXPECTED_SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_SUMS_SHA256}" ]; then
            echo "build job emitted no SHA256SUMS digest" >&2; exit 1
          fi
          echo "${EXPECTED_SUMS_SHA256}  SHA256SUMS.txt" | sha256sum -c --strict -
          sha256sum -c --strict SHA256SUMS.txt

      - name: Attest build provenance (wheel, sdist, checksums)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/provenance-manifest-v1.json

      - name: Attest SBOM against the wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: dist/sbom-python.cdx.json

      - name: Verify the attestation we just produced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt dist/provenance-manifest-v1.json; do
            gh attestation verify "$f" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Upload assets to the GitHub release for this tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI (opt-in, Trusted Publishing)
    # Builds on the attested artifact chain: build (outputs) then attest.
    needs: [build, attest]
    # Two independent locks, both of which must be open.
    #
    # 1. Only a tag push. A workflow_dispatch run builds and attests but
    #    never publishes, so the workflow stays safe to exercise by hand.
    # 2. The repository variable PUBLISH_TO_PYPI must equal "true". Until
    #    someone sets it, this job is skipped and a tag produces exactly what
    #    it produced before: artifacts, SBOM, checksums and attestations on
    #    the GitHub release.
    #
    # The distribution name is remora-assurance. `remora` is taken on PyPI by
    # an unrelated project, so it cannot be used and must not be assumed.
    #
    # SETUP, done once and outside this repository:
    #   a. create the PyPI project remora-assurance;
    #   b. add a Trusted Publisher for it: owner darklordVirtual, repository
    #      REMORA-research, workflow release.yml, environment pypi;
    #   c. create a GitHub environment named pypi (add required reviewers if
    #      a second pair of eyes on each publish is wanted);
    #   d. set the repository variable PUBLISH_TO_PYPI to true.
    # No API token is stored anywhere: publication is authenticated by the
    # OIDC identity of this job, which is why id-token: write is the only
    # credential below.
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the artifacts this run attested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish only the distributions, never the SBOM or checksums
        # twine would reject them, but removing them here makes the intent
        # explicit rather than relying on an upload error.
        run: rm -f dist/SHA256SUMS.txt dist/sbom-python.cdx.json

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
