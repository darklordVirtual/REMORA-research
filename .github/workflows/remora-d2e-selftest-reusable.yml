name: REMORA decision-to-effect self-test (reusable)

# Third-party code runs in a read-only, secretless caller job.
# Passing means SELF-TEST MATCH, never independent verification.
on:
  workflow_call:
    inputs:
      suite_sha:
        description: Full REMORA commit SHA; pin the caller's uses reference to this same SHA.
        required: true
        type: string
      adapter_file:
        description: Single Python adapter path relative to caller repository root.
        required: true
        type: string

permissions:
  contents: read

jobs:
  self-test:
    name: Decision-to-effect vectors (SELF-TEST only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout caller subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: subject
          persist-credentials: false
      - name: Checkout pinned REMORA suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: darklordVirtual/REMORA-research
          ref: ${{ inputs.suite_sha }}
          path: kit
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Validate suite pin and load partner adapter
        env:
          SUITE_SHA: ${{ inputs.suite_sha }}
          ADAPTER_FILE: ${{ inputs.adapter_file }}
        run: |
          python - <<'PY'
          import os, re, shutil, subprocess, sys
          from pathlib import Path

          sha = os.environ["SUITE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("suite_sha must be a full immutable lowercase Git SHA")
          actual = subprocess.check_output(
              ["git", "-C", "kit", "rev-parse", "HEAD"], text=True
          ).strip()
          if actual != sha:
              sys.exit("suite_sha did not match checked out suite")
          root = Path("subject").resolve()
          relative = Path(os.environ["ADAPTER_FILE"])
          if relative.is_absolute() or ".." in relative.parts:
              sys.exit("adapter_file must be a safe relative path")
          source = (root / relative).resolve()
          if (
              not source.is_relative_to(root)
              or not source.is_file()
              or source.suffix != ".py"
          ):
              sys.exit("adapter_file must be a Python file in the caller checkout")
          destination = Path("kit/conformance/decision-to-effect-v1/adapter_partner.py")
          shutil.copyfile(source, destination)
          print(f"Pinned suite SHA {sha}")
          PY
      - name: Run decision-to-effect vectors
        run: |
          cd kit
          python conformance/decision-to-effect-v1/run_conformance.py \
            --adapter partner --out "$GITHUB_WORKSPACE/conformance-run.json"
      - name: Gate all vector results for SELF-TEST badge
        env:
          SUITE_SHA: ${{ inputs.suite_sha }}
        run: |
          python kit/scripts/check_external_conformance.py \
            --record conformance-run.json \
            --suite kit/conformance/decision-to-effect-v1/vectors.json \
            --runner kit/conformance/decision-to-effect-v1/run_conformance.py \
            --adapter kit/conformance/decision-to-effect-v1/adapter_partner.py \
            --suite-sha "$SUITE_SHA"
      - name: Upload per-vector evidence including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remora-d2e-self-test-${{ github.sha }}
          path: conformance-run.json
          if-no-files-found: warn
          retention-days: 90
