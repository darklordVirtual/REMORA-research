name: Shadow Replay Smoke

"on":
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shadow-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # Constraints (-c) = version pinning from requirements-lock.txt; the
          # extras drive what gets installed. Filter out -e/comment lines that
          # pip rejects in a constraints file.
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev]" -c /tmp/constraints.txt

      - name: Run shadow replay on demo log
        # --store-db also persists every envelope to a durable control-plane
        # store, so the smoke test exercises the path a real shadow pilot uses
        # rather than only the flat-file one.
        run: |
          python scripts/shadow_replay.py \
            --input artifacts/demo/shadow_mode_sample_agent_action_log.jsonl \
            --envelopes-out artifacts/shadow_mode/decision_envelopes.jsonl \
            --report-out artifacts/shadow_mode/governance_delta_report.json \
            --audit-out artifacts/shadow_mode/replay_audit.jsonl \
            --store-db artifacts/shadow_mode/shadow_control_plane.db \
            --verify

      - name: Verify the persisted envelope chain
        # `test -s` only proves a file is non-empty — a file of garbage passes
        # it. These two commands reload the trail from disk and recompute the
        # hashes, which is the property shadow mode is supposed to provide.
        run: |
          python scripts/verify_envelope_chain.py \
            --envelopes artifacts/shadow_mode/decision_envelopes.jsonl
          python scripts/verify_envelope_chain.py \
            --store-db artifacts/shadow_mode/shadow_control_plane.db --tenant shadow

      - name: Tamper detection must actually fire
        # A verifier that never fails proves nothing. Edit a stored record and
        # require a non-zero exit; if this step succeeds, the gate above is
        # not checking what it claims to check.
        #
        # The edit appends to proposed_action rather than overwriting a verdict:
        # assigning a verdict that the record already holds is a no-op, and the
        # verifier would then correctly report an intact chain — turning this
        # gate into a coin flip on the sample data.
        run: |
          cp artifacts/shadow_mode/decision_envelopes.jsonl /tmp/tampered.jsonl
          python - <<'PY'
          import json
          path = "/tmp/tampered.jsonl"
          lines = open(path).read().splitlines()
          record = json.loads(lines[0])
          before = record["request"]["proposed_action"]
          record["request"]["proposed_action"] = before + " [tampered]"
          assert record["request"]["proposed_action"] != before
          lines[0] = json.dumps(record, sort_keys=True)
          open(path, "w").write("\n".join(lines) + "\n")
          PY
          if python scripts/verify_envelope_chain.py --envelopes /tmp/tampered.jsonl; then
            echo "FAIL: tampered envelope chain verified as intact"
            exit 1
          fi
          echo "Tamper detection confirmed"

      - name: Validate outputs
        run: |
          test -s artifacts/shadow_mode/decision_envelopes.jsonl
          test -s artifacts/shadow_mode/governance_delta_report.json
          test -s artifacts/shadow_mode/replay_audit.jsonl
          python - <<'PY'
          import json
          p = "artifacts/shadow_mode/governance_delta_report.json"
          d = json.load(open(p))
          required = [
              "total_actions_reviewed",
              "accepted",
              "verify_required",
              "abstained",
              "escalated",
              "utility_retained_pct",
              "human_review_burden_pct",
              "baseline_comparison",
          ]
          missing = [k for k in required if k not in d]
          if missing:
              raise SystemExit(f"Missing keys in governance report: {missing}")
          print("Shadow replay report schema OK")
          PY
