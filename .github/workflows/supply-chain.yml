name: Supply Chain

# Phase 14 supply-chain hardening: dependency vulnerability scanning and SBOM
# generation. Additive to the deterministic/research gates, never a
# replacement. Vulnerability scans are blocking on PRs so a newly-introduced
# vulnerable pin is caught at review time; the scheduled run catches CVEs
# published after merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: "23 5 * * *" # daily: CVEs land without commits

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package exactly like the test jobs
        run: |
          python -m pip install --upgrade pip pip-audit
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/constraints.txt
          pip install -e ".[dev,causal,api]" -c /tmp/constraints.txt

      - name: Audit the installed environment against the committed baseline
        # New vulnerability IDs fail the job; the committed baseline
        # (.github/pip_audit_baseline.json) records the currently-known set
        # explicitly so the backlog is visible and burn-down-able instead of
        # silently accepted.
        run: python scripts/check_pip_audit_baseline.py

  npm-audit:
    name: npm dependency audit (frontend + workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # mcp-gateway was missing from this list (RMR-007). It is the
        # only worker that holds execution authority and downstream
        # credentials, so it was the one worker whose dependencies went
        # unaudited -- the inverse of the order you would choose.
        dir: [frontend, workers/agent-control, workers/aromer, workers/law-search, workers/mcp-gateway, workers/rag-oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Audit lockfile (critical blocks)
        working-directory: ${{ matrix.dir }}
        # `--omit=dev` is deliberately NOT used: the devDependencies
        # (wrangler, esbuild, vite toolchain) run with repo credentials in
        # CI/deploy, which is exactly the supply-chain surface to watch.
        # Level CRITICAL for now — the current HIGH findings are all
        # toolchain-transitive (wrangler 3 / miniflare / vitest-pool-workers
        # pin exact undici and sharp/libvips versions) and `npm audit fix`
        # cannot repair them without semver-major toolchain jumps that break
        # `npm ci` sync (attempted 2026-08-19; miniflare 4 -> 5-alpha).
        # Burn-down: the deliberate wrangler-4 / vite-toolchain migration.
        # This acceptance is recorded here explicitly, never silently.
        run: npm audit --audit-level=critical

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history so a committed-then-removed secret is caught)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      # SHA-pinned like every other action in this workflow: the mutable v2 tag
      # changed scan behaviour under us on 2026-08-20 and turned master red
      # without a repository change. A supply-chain workflow must not itself
      # depend on a moving reference.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  sbom:
    name: SBOM generation (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate Python SBOM from the lockfile
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          grep -vE '^-e|^#|file://' requirements-lock.txt > /tmp/sbom-reqs.txt
          cyclonedx-py requirements /tmp/sbom-reqs.txt --of JSON -o sbom-python.cdx.json
          python -c "import json; d=json.load(open('sbom-python.cdx.json')); print('components:', len(d.get('components', [])))"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate frontend SBOM from the lockfile
        working-directory: frontend
        # cyclonedx-npm shells out to `npm ls`, which flags two pre-existing
        # lockfile quirks (platform-variant lightningcss stub, nested
        # lru-cache) as ELSPROBLEMS even though `npm ci` — the same install
        # the verify job trusts — succeeds. --ignore-npm-errors keeps the
        # SBOM complete for the tree that actually installs.
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format JSON --output-file ../sbom-frontend.cdx.json

      - name: Generate the mcp-gateway SBOM from the lockfile
        working-directory: workers/mcp-gateway
        # The SBOM covered the Python package and the frontend, and no worker
        # at all (RMR-007). The gateway is the component that holds execution
        # authority and the downstream credentials, so of everything shipped it
        # is the piece whose bill of materials matters most, and it was the
        # piece with none.
        #
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format JSON --output-file ../../sbom-mcp-gateway.cdx.json

      - name: Generate SBOMs for the remaining four Workers (issue #426)
        # RMR-CR-011: every deployable Worker gets a CycloneDX file. The
        # gateway came first (it holds execution authority); these four
        # complete the inventory so the supply-chain artifact covers the
        # whole deployable surface.
        run: |
          set -euo pipefail
          for w in agent-control aromer law-search rag-oracle; do
            ( cd "workers/$w" \
              && npm ci \
              && npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors \
                   --output-format JSON \
                   --output-file "../../sbom-worker-$w.cdx.json" )
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-python.cdx.json
            sbom-frontend.cdx.json
            sbom-mcp-gateway.cdx.json
            sbom-worker-agent-control.cdx.json
            sbom-worker-aromer.cdx.json
            sbom-worker-law-search.cdx.json
            sbom-worker-rag-oracle.cdx.json
          retention-days: 90

  supply-chain-required:
    # RMR-007: branch protection can only require named contexts, and the
    # npm-audit leg has a matrix-expanded name that drifts as packages come
    # and go. This aggregator is the stable required context for the whole
    # workflow: it runs always() — even when a leg failed, which is exactly
    # when its verdict matters — and fails unless every aggregated leg
    # reported success. A leg that errors before it starts (runner lost,
    # queue timeout) reads as failure here, not as absence.
    if: always()
    needs: [pip-audit, npm-audit, secret-scan, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every aggregated leg succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          not_ok = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if not_ok:
              print(f"aggregated legs not green: {not_ok}", file=sys.stderr)
              sys.exit(1)
          print(f"all {len(needs)} aggregated legs succeeded")
          PY
