name: Sync papers to R2

# Keeps the public PDF downloads in the R2 bucket `remora-artifacts` (prefix
# papers/) in lockstep with the repository. The agent-control worker serves them
# at /papers/<name>.pdf. Runs whenever either PDF changes on main, and on demand.

"on":
  push:
    branches: [master]
    paths:
      - "paper/remora_paper.pdf"
      - "docs/whitepaper/REMORA_Enterprise_Whitepaper.pdf"
  workflow_dispatch:

concurrency:
  group: sync-papers-to-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Upload only when Cloudflare credentials are configured for this repo
    # (repo convention: codegraph-index.yml, deploy-frontend.yml). Without
    # them the job reports a loud, visible skip instead of failing red —
    # first-ever run 2026-08-05 failed hard because no repo secrets exist.
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Warn when Cloudflare secrets are absent
        if: env.HAS_CF_SECRETS != 'true'
        run: >-
          echo "::warning title=R2 sync skipped::CLOUDFLARE_API_TOKEN /
          CLOUDFLARE_ACCOUNT_ID not configured — the public R2 PDFs are NOT
          being updated and may be stale relative to the repository."

      - name: Upload research paper to R2
        if: env.HAS_CF_SECRETS == 'true'
        run: >-
          npx --yes wrangler@4.112.0 r2 object put
          remora-artifacts/papers/remora_paper.pdf
          --file paper/remora_paper.pdf
          --content-type application/pdf
          --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload enterprise whitepaper to R2
        if: env.HAS_CF_SECRETS == 'true'
        run: >-
          npx --yes wrangler@4.112.0 r2 object put
          remora-artifacts/papers/REMORA_Enterprise_Whitepaper.pdf
          --file docs/whitepaper/REMORA_Enterprise_Whitepaper.pdf
          --content-type application/pdf
          --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
