#
# gitleaks configuration for REMORA-research.
#
# The default ruleset stays ON (`useDefault = true`). Everything below is a
# NARROW allowlist for findings that were inspected individually and confirmed
# not to be credentials. Entries name the exact literal or the exact path;
# never add a broad pattern here — a secret scanner that has been widened
# until it is quiet is not a control.
#
# Each entry records what was verified. When an allowlisted literal changes,
# the finding returns and must be re-inspected.

[extend]
useDefault = true

[allowlist]
description = "Verified non-secrets: identifier names, test fixtures and third-party benchmark corpora"

# Committed evaluation corpora. These are verbatim third-party datasets whose
# content is pinned by SHA-256 in their manifests; they hold tool catalogues
# and adversarial prompts, never repository credentials. Their bytes cannot be
# edited without invalidating a sealed holdout, so a real secret could not be
# removed from them anyway — it must never be committed here in the first
# place, which the pre-commit path and review cover.
paths = [
  # BFCL tool catalogues (Apache-2.0, ShishirPatil/gorilla). Trip cause: tool
  # NAMES such as "CustomDashboardsApi.get_shareable_api_tokens".
  '''data/routing_bench_bfcl.*/bfcl_holdout\.jsonl''',
  # AgentHarm scored results (AI Safety Institute, arXiv:2410.09024). Trip
  # cause: fictional harmful prompts that quote invented ransomware keys and
  # wallet addresses. Verified at results/external_benchmark_agentharm_v1.json
  # lines 626 and 638 — both are benchmark instruction text.
  '''results/external_benchmark_agentharm_v1\.json''',
]

# Matched against the whole LINE, not the extracted secret. The default
# target is the secret alone, which forces allowlist entries to be bare values
# — and a bare value suppresses every future finding anywhere in the
# repository that happens to contain that string, which is how a secret
# scanner gets quietly disarmed. Matching the line is what lets each entry
# below be anchored to the context it actually appears in.
regexTarget = "line"

# Identifier NAMES that the generic-api-key rule reads as values.
regexes = [
  # remora/governance/a2a_envelope.py:72 — the name of the env var to read,
  # not its value: _ENV_KEY = "REMORA_A2A_SIGNING_KEY".
  '''REMORA_A2A_SIGNING_KEY''',
  # workers/aromer/src/index.ts:292 — a Workers KV key name.
  '''friction_thresholds_v1''',
  # tests/test_rem013_pdp_pep_boundary.py:28 — a fixture literal for the
  # PDP/PEP boundary test; self-describing and never a live key.
  '''test-pdp-signing-key-rem013''',
  # docs/07-api-reference.md — the curl example shows how to authenticate by
  # READING the token from the environment, which is the practice we want
  # documented. The default curl-auth-header rule matches the header string
  # itself, so documenting authentication at all trips it; this allowlists the
  # env-var reference, never a value.
  '''Authorization: Bearer \$\{REMORA_API_BEARER_TOKEN\}''',
  # docs/07-api-reference.md, commit 286ee24 — the curl example first shipped
  # with an inline placeholder before being rewritten to read the token from
  # the environment. gitleaks scans HISTORY, so a later fix does not remove an
  # earlier commit's finding. Both entries are anchored to the REMORA-specific
  # context they appear in: a bare '''dev-token''' would suppress any future
  # finding anywhere in the repository that happened to contain that string,
  # which is how a secret scanner gets quietly disarmed.
  '''REMORA_API_BEARER_TOKEN=dev-token''',
  '''localhost:8000/v1/(policy/version|assess).*Authorization: Bearer dev-token''',
  # docs/integrations/mcp-gateway.md — approving a governed proposal is a
  # curl command until the approval console exists, so the gateway
  # documentation has to show authentication too. Same treatment as the API
  # reference above: the env-var reference is allowlisted, never a value.
  '''Authorization: Bearer \$\{REMORA_APPROVER_TOKEN\}''',
  # The same block's unauthenticated health check, matched by the rule's
  # multi-line region rather than by any secret in it.
  '''curl -s localhost:8000/v1/health''',
]
