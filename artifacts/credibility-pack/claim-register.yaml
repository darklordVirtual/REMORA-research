      (bar 1%); legitimate read autonomy 25/94 = 26.6% (bar 75%); obtainable
      VERIFY 93/199 = 46.7%; unobtainable ABSTAIN 126/199 = 63.3%. Single-pass
      ablation on the same episodes: structural-only 24/500 wrong-call
