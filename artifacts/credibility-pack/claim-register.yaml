      call ACCEPT 0/500 = 0.0% (Wilson 95% upper bound 0.76%; C-ext2
      degraded-authority baseline 28/258 = 10.9%); irrelevance ABSTAIN 300/300
      = 100.0%; required-unknown autonomous ACCEPT 0/398 = 0.0%. Missed and
