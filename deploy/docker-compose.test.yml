services:
  remora-api:
    build:
      context: .
      dockerfile: artifacts/docker/Dockerfile
    image: remora-test:latest
    ports:
      # Loopback only: this is an unauthenticated development container.
      - "127.0.0.1:8000:8000"
    environment:
      REMORA_ENV: development
      # SR-03: the no-credential fallback is opt-in and read-only (viewer).
      REMORA_ALLOW_UNAUTHENTICATED_DEV: "1"
      PYTHONUNBUFFERED: "1"
    command: ["sh", "-c", "pip install -e '.[api,dev]' && uvicorn servers.api:app --host 0.0.0.0 --port 8000"]
