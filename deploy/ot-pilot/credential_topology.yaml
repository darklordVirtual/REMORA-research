# Author: Stian Skogbrott
# SPDX-License-Identifier: BUSL-1.1
#
# Credential and network topology of the OT pilot deployment: the static half
# of AACP property E for this deployment (v0.1 section 12.1, v0.2 section 4).
#
# Checked by scripts/check_ot_pilot_topology.py against docker-compose.yml and
# the pilot's Python, and the check fails on the three drifts section 12.1
# names: a credential the deployment hands out or the code reads that is not
# declared here; an entry nothing carries or reads any more; and a holder or
# reader set that no longer matches. It also fails when a credential declared
# unreachable from the agent zone is carried by the agent service, or when the
# agent zone shares a network with a service that holds the effect or the
# authority store.
#
# The repository-wide register (docs/assurance/credential_topology.yaml)
# covers the environment reads of REMORA's own code; this one covers which
# container of this deployment receives which secret, and who can reach whom.

version: 1
deployment: deploy/ot-pilot/docker-compose.yml

protected_effect: >-
  The plant's state (service plant, plant_service.py). It changes only in
  plant_model.Plant.apply, reached by POST /tools/<tool> with the writer
  credential OT_PLANT_WRITE_TOKEN, and every request, applied or refused, is
  journaled with the credential it presented.

# The agent zone is the agent service: the container the pilot's agent runs
# in, with the API image's code, the operator token and the agent-net network.
# It is drawn at the container because that is the unit docker gives the
# agent: its own process table, filesystem and network namespace.
#
# What changes if it is drawn wider:
# - the host. The host holds deploy/ot-pilot/.env with every secret below, and
#   on Linux it can route to every bridge network. An agent on the host
#   reaches the plant directly. The pilot does not support that placement.
# - the API container. Code running there shares a process with the executor
#   and its OT_PLANT_WRITE_TOKEN; v0.1 section 12.3 applies (an in-process
#   runtime offers no custody). The detector-sensitivity control of the
#   boundary run demonstrates that path and keeps it in the record.
# - the verifier container. It holds the plant read token and the receipt
#   key, so an agent there could sign effect receipts, though not write.
agent_zone:
  service: agent
  networks: [agent-net]
  image: ot-pilot-api:local
  # It mounts nothing from the host: the boundary suite reports on stdout.

# Services whose reachability from the agent zone would matter, and why.
protected_services:
  plant: holds the effect
  postgres: holds the approval queue, grants and audit chain
  verifier: holds the effect-receipt signing key

networks:
  edge: {internal: false, members: [api, verifier, console]}
  backend: {internal: true, members: [api, postgres]}
  plant-net: {internal: true, members: [api, plant, verifier]}
  agent-net: {internal: true, members: [api, agent]}

# read_by lists every pilot module that reads the variable. pilot_host.py and
# the run_*.py runners other than run_boundary_suite.py are the assessor's
# tools: they run on the host, which holds .env, and are never in the agent
# zone. run_boundary_suite.py runs in the agent zone and reads only the
# agent's own token. run_effect_verification.py reads the verifier's key on
# the host only to sign the receipts REMORA must refuse (a replay and wrong
# arguments) in its receipt controls.
credentials:

  - name: OT_PLANT_WRITE_TOKEN
    class: effect_credential
    holders: [api, plant]
    read_by: [deploy/ot-pilot/ot_registry.py, deploy/ot-pilot/plant_service.py]
    authorized_path: >-
      the governed dispatcher in the API calls ot_registry, which writes to the
      plant with it; the plant checks it
    agent_reachable: false

  - name: OT_PLANT_READ_TOKEN
    class: observation_credential
    holders: [plant, verifier]
    read_by: [deploy/ot-pilot/effect_verifier.py, deploy/ot-pilot/plant_dump.py,
              deploy/ot-pilot/plant_service.py]
    authorized_path: the effect verifier reads objects and the journal; it can change nothing
    agent_reachable: false

  - name: OT_VERIFIER_SIGNING_SEED
    class: verifier_key
    holders: [verifier]
    read_by: [deploy/ot-pilot/effect_verifier.py, deploy/ot-pilot/run_effect_verification.py]
    authorized_path: signs effect receipts under REMORA/EFFECT-RECEIPT/v1
    agent_reachable: false

  - name: OT_VERIFIER_PUBLIC_KEY
    class: public_key
    holders: [api]
    read_by: []
    authorized_path: REMORA_EFFECT_VERIFIER_KEYS registers it for control domain ot-pilot-plant-observer
    agent_reachable: true
    note: public by construction

  - name: OT_TOKEN_VERIFIER
    class: api_token
    holders: [api, verifier]
    read_by: [deploy/ot-pilot/effect_verifier.py, deploy/ot-pilot/run_effect_verification.py]
    authorized_path: REMORA role effect_verifier (read, verify_effect)
    agent_reachable: false

  - name: OT_TOKEN_AGENT
    class: api_token
    holders: [api, agent]
    read_by: [deploy/ot-pilot/run_boundary_suite.py, deploy/ot-pilot/pilot_host.py, deploy/ot-pilot/run_fault_injection.py,
              deploy/ot-pilot/run_independent_scenarios.py, deploy/ot-pilot/run_ot_battery.py]
    authorized_path: REMORA role operator (assess, execute an approved item)
    agent_reachable: true
    note: the agent's own credential; holding it is what the agent zone is

  - name: OT_TOKEN_APPROVER
    class: api_token
    holders: [api]
    read_by: [deploy/ot-pilot/pilot_host.py, deploy/ot-pilot/run_fault_injection.py,
              deploy/ot-pilot/run_independent_scenarios.py, deploy/ot-pilot/run_ot_battery.py]
    authorized_path: REMORA role senior_authority (review, read)
    agent_reachable: false

  - name: OT_TOKEN_SUPERVISOR
    class: api_token
    holders: [api]
    read_by: [deploy/ot-pilot/pilot_host.py, deploy/ot-pilot/run_fault_injection.py]
    authorized_path: REMORA role admin (stop, resume, revoke; the assessor's dispatch listing)
    agent_reachable: false

  - name: OT_TOKEN_VIEWER
    class: api_token
    holders: [api, console]
    read_by: [deploy/ot-pilot/pilot_host.py, deploy/ot-pilot/run_fault_injection.py,
              deploy/ot-pilot/run_independent_scenarios.py, deploy/ot-pilot/run_ot_battery.py]
    authorized_path: REMORA role viewer (read); the console's dashboard
    agent_reachable: false

  - name: OT_PDP_SIGNING_KEY
    class: authority_key
    holders: [api]
    read_by: []
    authorized_path: REMORA mints and verifies execution grants
    agent_reachable: false

  - name: OT_LEASE_SIGNING_KEY
    class: authority_key
    holders: [api]
    read_by: []
    authorized_path: REMORA mints and verifies execution leases
    agent_reachable: false

  - name: OT_AUDIT_SIGNING_KEY
    class: authority_key
    holders: [api]
    read_by: []
    authorized_path: REMORA signs the tenant audit chain
    agent_reachable: false

  - name: OT_ENVELOPE_SIGNING_KEY
    class: authority_key
    holders: [api]
    read_by: []
    authorized_path: REMORA signs decision envelopes
    agent_reachable: false

  - name: OT_TOOLSPEC_VERIFY_KEY
    class: public_key
    holders: [api]
    read_by: []
    authorized_path: verifies the signed ToolSpec bundle; the seed stays on the host
    agent_reachable: true
    note: public by construction

  - name: OT_TOOLSPEC_PINNED_DIGEST
    class: public_value
    holders: [api]
    read_by: []
    authorized_path: pins the ToolSpec bundle digest
    agent_reachable: true

  - name: OT_PLANT_FAULTS
    class: configuration
    holders: [plant]
    read_by: [deploy/ot-pilot/plant_service.py]
    authorized_path: declared plant faults for the effect-verification run; empty otherwise
    agent_reachable: false

  - name: POSTGRES_PASSWORD
    class: store_credential
    holders: [postgres, api]
    literal_in: [POSTGRES_PASSWORD, REMORA_PG_DSN, REMORA_CONTROL_PLANE_DSN]
    read_by: []
    authorized_path: the API's durable execution state and envelope store
    agent_reachable: false
    note: >-
      A committed development literal, so its secrecy is not claimed. That the
      agent cannot use it rests on the network: PostgreSQL is on backend only.

  - name: REMORA_LIMITS_TRUSTED_KEYS
    class: public_key
    holders: [api]
    literal_in: [REMORA_LIMITS_TRUSTED_KEYS]
    read_by: []
    authorized_path: verifies the signed limits policy
    agent_reachable: true
    note: public by construction

limits:
  - id: OTL1
    text: >-
      The register is about the containers and networks docker-compose.yml
      declares. Docker, the kernel and the host are trusted; a container
      escape is outside it.
  - id: OTL2
    text: >-
      read_by lists the pilot's own modules. REMORA's readers of the same
      values (servers/, remora/) are the repository register's subject.
  - id: OTL3
    text: >-
      The API image, which the agent service also runs, contains REMORA's code
      and the pilot's modules but no secret. A secret baked into an image layer
      would not show in this check; the boundary suite's filesystem search
      looks for one at run time.
