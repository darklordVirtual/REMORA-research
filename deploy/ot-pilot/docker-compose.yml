# REMORA OT pilot — the whole thing, locally, in production mode.
#
# Generate the pilot credentials once, then one command:
#
#   python deploy/ot-pilot/init_tokens.py      # writes deploy/ot-pilot/.env
#   docker compose -f deploy/ot-pilot/docker-compose.yml up --build -d
#
# Then open http://localhost:8081 — operator console with live metrics, the
# scenario buttons and a one-click run of the 16-case OT battery.
# Swagger is at http://localhost:8080/docs (press Authorize, paste the
# OT_TOKEN_AGENT value from deploy/ot-pilot/.env, made by init_tokens.py).
#
#   docker compose -f deploy/ot-pilot/docker-compose.yml down -v   # tear down
#
# Every database, registry and work order below is preset. The bearer tokens
# are not: compose refuses to start until init_tokens.py has generated them.
#
# Production mode is not decoration here. REMORA_ENV=production makes the
# fail-closed prerequisites binding for the surfaces this deployment serves:
# durable execution state, a durable envelope store, and a token table with
# real role separation. Remove any one of them and the API refuses to start —
# that refusal is the property, so this file supplies all three rather than
# weakening the check.
#
# REMORA_ENABLED_SURFACES=execution says this pilot serves the policy-only
# execution surface and not the oracle-backed /v1/assess research surface.
# Those routes are UNMOUNTED, not merely unused, so their prerequisites (a
# non-mock oracle backend, a non-empty retrieval evidence store) do not
# apply. This file used to name a `groq` backend it never called and carry a
# knowledge pack it never read, purely to get past startup — which is what a
# prerequisite for a surface nobody serves teaches you to do.
#
# The signing keys below are DEVELOPMENT VALUES for a local pilot. A real
# deployment injects them from a secret manager; they are the difference
# between a tamper-evident chain and a decorative one.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remora
      POSTGRES_PASSWORD: remora-local-pilot
      POSTGRES_DB: remora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remora -d remora"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API needs it.
    expose:
      - "5432"

  api:
    build:
      context: ../..
      dockerfile: deploy/ot-pilot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Host 8080 to stay clear of anything already on 8000.
    # SR-06 / SEC-05: loopback only — a pilot on 0.0.0.0 hands the network
    # both the propose and the approve path.
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      REMORA_ENV: production

      # --- Fail-closed prerequisites (all three are required) -------------
      # Durable execution state: tenant audit chain, review queue, and the
      # one-time-grant ledger. Without it a consumed grant is replayable.
      REMORA_PG_DSN: postgresql://remora:remora-local-pilot@postgres:5432/remora
      # Durable DecisionEnvelope store.
      REMORA_CONTROL_PLANE_DSN: postgresql://remora:remora-local-pilot@postgres:5432/remora
      # Token table — the only mode with real role separation. The operator
      # token cannot approve; the approver token (role senior_authority:
      # review and read only) cannot execute. Every OT tool resolves to the
      # critical tier, whose approvals require senior_authority, so plain
      # "reviewer" could approve nothing here. It was admin until 2026-11-02, which holds execute, so the
      # comment here promised a separation the roles did not give
      # (RMR-SEC-0002). Production also refuses an approver who proposed the
      # call. The supervisor (admin) can withdraw the approver's authority: a
      # principal cannot revoke themself, so revocation needs two. Each token
      # names its actor, so the audit chain records who acted, not a hash.
      # SR-06: tokens are generated at first start by
      # `python deploy/ot-pilot/init_tokens.py` (writes .env, mode 600);
      # compose refuses to start without them. No fixed literal tokens.
      REMORA_API_TOKENS: >-
        {"${OT_TOKEN_AGENT:?run python deploy/ot-pilot/init_tokens.py first}":{"tenant":"ot-pilot","role":"operator","actor_id":"ot-agent"},
         "${OT_TOKEN_APPROVER:?run python deploy/ot-pilot/init_tokens.py first}":{"tenant":"ot-pilot","role":"senior_authority","actor_id":"ot-approver"},
         "${OT_TOKEN_SUPERVISOR:?run python deploy/ot-pilot/init_tokens.py first}":{"tenant":"ot-pilot","role":"admin","actor_id":"ot-supervisor"},
         "${OT_TOKEN_VIEWER:?run python deploy/ot-pilot/init_tokens.py first}":{"tenant":"ot-pilot","role":"viewer","actor_id":"ot-viewer"}}
      REMORA_API_BEARER_TOKEN: ${OT_TOKEN_AGENT:?run python deploy/ot-pilot/init_tokens.py first}

      # --- Surfaces -------------------------------------------------------
      # Execution only: no oracle, no retrieval store, no network egress.
      REMORA_ENABLED_SURFACES: execution

      # --- Signing (generated per pilot; inject from a vault in reality) ----
      # These were literals in this file. Anyone holding the lease key can
      # sign a lease for any call, and the 2026-11-02 review did exactly that
      # (RMR-SEC-0001). init_tokens.py now generates them into .env, and
      # production startup refuses placeholder or short keys.
      REMORA_PDP_SIGNING_KEY: ${OT_PDP_SIGNING_KEY:?run python deploy/ot-pilot/init_tokens.py --force}
      REMORA_LEASE_SIGNING_KEY: ${OT_LEASE_SIGNING_KEY:?run python deploy/ot-pilot/init_tokens.py --force}
      REMORA_AUDIT_SIGNING_KEY: ${OT_AUDIT_SIGNING_KEY:?run python deploy/ot-pilot/init_tokens.py --force}
      REMORA_ENVELOPE_SIGNING_KEY: ${OT_ENVELOPE_SIGNING_KEY:?run python deploy/ot-pilot/init_tokens.py --force}

      # --- Deployment-owned semantics --------------------------------------
      REMORA_TOOL_REGISTRY_MODULE: ot_registry
      REMORA_SEMANTIC_BUNDLE_MODULE: ot_bundle
      REMORA_INTENT_SOURCE_FILE: /app/work_orders.json
      # The pilot's own risk declaration for its six tools (domain ot_plant, so
      # the state index in ot_bundle.py applies; read_sensor low, every write
      # critical). Hashed into the policy bundle. Without it every tool was
      # critical/unknown and no monitoring read could be grounded.
      REMORA_TOOL_METADATA_FILE: /app/tool_metadata.json
      # Grounded reads (opt-in, 2026-08-06): a read-only, low-tier call under a
      # resolved work order with all four grounding signals true may ACCEPT.
      REMORA_GROUNDED_READ_ACCEPT: "1"
      # Owner decision 2026-11-03 (docs/architecture/ADR-grounded-reads-in-production.md):
      # the same path may fire for this pilot's production target. The five
      # daily-round sensor reads then complete without a person; every write
      # still goes to a senior_authority approver. Remove this line to restore
      # the production exclusion.
      REMORA_GROUNDED_READ_IN_PRODUCTION: "1"
      REMORA_EXECUTION_ARTIFACT_DIR: /var/lib/remora/artifacts

      # --- Cumulative limits -------------------------------------------------
      # A check on one call cannot see that small setpoint moves or valve
      # strokes add up. These cap movement per loop and valve, alarm acks and
      # work orders per window, shared by every principal, and refuse any
      # write tool without a meter (coverage all_writes). Setpoint and valve
      # movement is measured from what the plant reports (the observer), not
      # from what REMORA last allowed. The ledger is SQLite on this one
      # container; see NEGATIVE_RESULTS.md section 97.
      REMORA_LIMITS_FILE: /app/limits.json
      REMORA_LIMITS_LEDGER: /var/lib/remora/limits-ledger.db
      # The ledger is this host's file while the rest of the authority state
      # is on PostgreSQL, so a second API host would keep its own budget. The
      # API refuses that pairing unless the deployment says one host runs
      # executors. A multi-host pilot needs a PostgreSQL REMORA_LIMITS_LEDGER
      # instead, and drops this line.
      REMORA_LIMITS_LEDGER_SCOPE: single_host
      REMORA_LIMITS_OBSERVER_MODULE: ot_registry
      # A call whose outcome is unknown holds its budget until a reviewer
      # resolves it, and the resolution is checked against the plant's log
      # (ot_registry.check_limit_evidence), not taken on trust. Without a
      # checker no unknown outcome could ever be resolved.
      REMORA_LIMITS_EVIDENCE_MODULE: ot_registry
      # Limits are mandatory here: the API refuses to start without them,
      # unsigned, or with coverage other than all_writes. limits.json is
      # signed by the pilot's limit authority; this host holds only its
      # public key. To change the limits, sign a new policy with your own key
      # (scripts/sign_limit_policy.py) and replace the key below.
      REMORA_REQUIRE_LIMITS: "1"
      REMORA_LIMITS_TRUSTED_KEYS: e6195cd0d965e0ae3554152a45d578d56843a4f27fa60e413630c0a42e531a0d

      # Prometheus scrape without a bearer token (local pilot only).
      REMORA_PROMETHEUS_PUBLIC: "1"
      PYTHONPATH: /app
    # The limit ledger and the execution artifacts live under /var/lib/remora.
    # Without a volume a recreate would empty the ledger, and every limit
    # would start from zero. The Postgres service already persists the rest.
    volumes:
      - remora-state:/var/lib/remora

  # Operator console: live metrics, scenario buttons, one-click OT battery.
  # Holds the viewer token only (SR-06) — a real deployment puts an identity
  # provider here instead, and the page says so.
  console:
    build:
      context: ../..
      dockerfile: deploy/ot-pilot/console/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    # SR-06 / SEC-05: loopback only.
    ports:
      - "127.0.0.1:8081:8090"
    environment:
      REMORA_API_URL: http://api:8000
      # The console holds the viewer token only. Operator and approver
      # credentials are entered per request in the UI and forwarded to the
      # API; they are never stored here (SR-06).
      PILOT_TOKEN_VIEWER: ${OT_TOKEN_VIEWER:?run python deploy/ot-pilot/init_tokens.py first}
      REMORA_EVIDENCE_ROOT: /var/lib/remora/evidence
      # Retention: keep the newest N battery runs on the evidence volume.
      # Pruned directories are named in the battery output — never silent.
      REMORA_EVIDENCE_KEEP: "20"
    volumes:
      - remora-evidence:/var/lib/remora/evidence

volumes:
  remora-evidence:
  remora-state:
