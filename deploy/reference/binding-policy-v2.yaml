# Reference BindingPolicy for the strict profiles' v2 contract (CR-006).
# docs/design/binding-policy-v1.md explains each binding and state.
schema: remora-binding-policy/v1
bindings:
  exact_call: REQUIRED
  toolspec: REQUIRED
  tenant: REQUIRED
  actor: REQUIRED
  audience: REQUIRED
  runtime_surface: REQUIRED
  resolved_effect: REQUIRED
  task_identity: REQUIRED
  # A MEDIATED tool derives its effect authority from the capability set, so
  # with effect_mediation REQUIRED this must be REQUIRED too.
  capability_set: REQUIRED
  # CR-005: every tool's signed spec states effect_mode; MEDIATED tools are
  # registered mediated, and the executor holds no effect credential
  # (REMORA_EFFECT_ENDPOINT names the effect domain).
  effect_mediation: REQUIRED
tools: {}
