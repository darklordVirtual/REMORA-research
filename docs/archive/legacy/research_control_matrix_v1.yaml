# ── Landscape coverage ──────────────────────────────────────────────────────
# Whole areas of the local AI-assurance compendium that REMORA deliberately does
# NOT implement as controls. Recording them here makes the scope boundary
# explicit and auditable: "not mapped" is a documented decision, not an oversight.
# These are honest boundaries, not roadmap promises.
landscape:
  source: "docs/researchpapers/kompendium_ai_assurance_3utgave.md"
  source_status: "local-only working document (gitignored, not published; ~201 works, 2. edition figure). compendium_refs are validated against this file when present locally and skipped in CI where it is absent."
  not_implemented:
    - theme: "Formal methods, neural-network verification, guaranteed-safe AI"
      compendium_chapter: "Ch. 8 (formal methods, verification, guaranteed safety)"
      representative_refs: [reluplex-2017, shielding-2018, guaranteed-safe-2024]
      reason: "REMORA verifies its policy layer by tests and deterministic invariants, not by formal proof. Neural-network verification and proof-carrying guarantees are out of scope; the safety floor is a policy property, not a proved model property."
    - theme: "Provenance, workload identity, software supply chain"
      compendium_chapter: "Ch. 7 (provenance, identity, supply chain)"
      representative_refs: [slsa-v1, in-toto-2019, spiffe-spec, c2pa-spec]
      reason: "REMORA provides a tamper-evident DecisionEnvelope hash chain, not SBOM/ML-BOM, artifact signing, or SPIFFE-style workload identity. Supply-chain and identity attestation are assumed to be provided by the host environment."
    - theme: "Fairness, differential privacy, training-data protection"
      compendium_chapter: "Ch. 9 (fairness, privacy, data protection)"
      representative_refs: [dp-sgd-2016, membership-inference-2017, gdpr-2016]
      reason: "REMORA governs execution permission at inference time, not model training. Differential privacy, membership-inference defence, and fairness-metric selection are out of scope; the governed agent's model is treated as given."
    - theme: "MLOps, distributed-systems foundations, production drift"
      compendium_chapter: "Ch. 6 (MLOps, system design, production operations)"
      representative_refs: [sculley-debt-2015, mlops-2022, sre-2016]
      reason: "REMORA is a pre-execution governance overlay, not an MLOps platform. Data pipelines, SRE error budgets, and deployment infrastructure are the host's responsibility; REMORA consumes them rather than providing them."
    - theme: "Mechanistic interpretability (model-internal feature analysis)"
      compendium_chapter: "Ch. 2 (interpretability subset)"
      representative_refs: [monosemanticity-2023, scaling-monosem-2024, biology-of-llm-2025]
      reason: "REMORA's causal explanation (RES-001) is post-hoc over the policy model, not model-internal feature/circuit analysis. Mechanistic interpretability of the governed model is out of scope."
