  - id: CAP-016
    name: "Structured governance events (operational logging in the safety core)"
    status: IMPLEMENTED_LIBRARY
    verified_at_sha: 37b37b8474b1ad4bdf44984cdbbf6d8f9ee7d69c
    verified_by: >-
      re-audited 2026-08-28 for the RMR-003 value redaction: governance_event now redacts field VALUES as well as screening field names, because detail=str(exc) carried whatever a downstream library put in an exception message under a field name nothing objected to. Evidence tests (tests/test_governance_events.py, tests/test_governance_log_redaction.py) executed green at this revision. Status unchanged; the caveat is corrected below, since it described name screening as the whole of the protection. Prior: rebound 2026-08-27 to the squash-merge commit of #474 (361abb27e178); the branch commit 19aabd44 left the repository at squash. Verified content-identical on every cited implementation source with `git diff 19aabd44 361abb27` (empty). No status, scope or caveat change. Prior: re-audit 2026-08-27 (#474): no event emission changed in decision_engine.py; the new floor returns a reason like every other. Status unchanged. Prior: rebound 2026-08-26 to the squash-merge commit of #457 (02eb31333ee8); the branch commit da1612cc it was first bound to left the repository at squash. Content-identical. Prior: re-audit 2026-08-26 for the D1 endpoint argument (review F1): EnforcementGate passes its state_endpoint into d1_connection.connect(), which now takes an explicit URL that wins over REMORA_STATE_ENDPOINT; the environment-only path is byte-identical. Token issuance, _GATE, the binding set, jti consumption and dispatch are unchanged and nothing is granted; status and caveat unchanged. Prior: audit 2026-08-26 (issue #425 backlog burn-down): every cited evidence test executed green at this revision (tests/test_governance_events.py; part of a 259-test pass over all sixteen previously-unbound capabilities), the capability-semantics gate (scripts/check_capability_semantics.py) confirms the claimed status 'IMPLEMENTED_LIBRARY' is demonstrable in the runtime wiring, and the caveat was re-read against the current code. Method: test execution + machine-checked wiring semantics + caveat review; not an independent external audit.
    evidence:
      - remora/observability/events.py
      - remora/enforcement/gate.py
      - remora/policy/decision_engine.py
      - tests/test_governance_events.py
    caveat: "remora/policy, remora/enforcement and remora/execution held ZERO loggers between them before 2026-08-20, so a refused grant or a failed dispatch produced no log line in production — only whatever the tenant audit chain happened to record. The chain and this log answer different questions: the chain is the governance record (what was authorised, under which policy, by whom), this is the operational record (what the process did, when). Events: decision.made, decision.invariant_violated, lease.issued, grant.checked, dispatch.settled. Two layers, because one was not enough. Field NAMES are screened and governance_event raises SecretFieldError rather than logging a field whose name looks like a credential, while allowing the derived forms that make correlation possible (token_jti identifies a grant; token_verified says whether one checked out; neither can be replayed). Field VALUES are then redacted for credential-shaped and location-shaped runs, because a free-text field such as detail=str(exc) carries whatever a downstream library put in its exception message, under a field name nothing objects to (external review RMR-003). Digests and identifiers are exempt by name, so an audit trail keeps what it exists to carry. Redaction is a net under text that should not have been free text, not a licence to log a secret deliberately. Nothing is emitted unless a handler is configured for the remora.governance logger. NOT a substitute for the audit chain and not itself tamper-evident."

