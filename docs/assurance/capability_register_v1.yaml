    caveat: "DISPATCH OUTCOME (NEGATIVE_RESULTS section 48): settlement is structural, not string-derived. REFUSED means REMORA observed that dispatch never began; UNKNOWN means dispatch began and absence of effect is not proven, is durable, is never retried, and may be superseded by a later authoritative observation; FAILED requires trusted adapter evidence of failure before the effect boundary and is UNREACHABLE from the synchronous path today because no adapter here produces that evidence -- a test asserts it stays unreachable. A dispatcher exception, timeout, lost response or tool_failed_nonce_burned alone earns only UNKNOWN. A caller-supplied pre_effect flag is not proof. The one reachable FAILED is reconciliation of an intent never claimed, where the claim strictly precedes invocation. SUCCEEDED remains distinct from EFFECT_VERIFIED. EFFECT RECEIPT LINEAGE (NEGATIVE_RESULTS section 47): REMORA ACCEPTS OR REFUSES a lineage-bound attestation; it does NOT derive the verdict, because it holds the digests and not the maps or the comparison rules and therefore cannot evaluate the postcondition. A settled verdict (VERIFIED or MISMATCH, equal burden) requires a dispatch in the audit chain, a non-empty tool_call_hash and grant_jti matching that dispatch, an observation time supplied by the verifier rather than defaulted to the server clock and neither before the dispatch nor more than five minutes ahead of the server, both digests present and well-formed SHA-256, and a verifier identity bound to the authenticated principal via REMORA_EFFECT_VERIFIER_BINDINGS (defaulting to identity == principal). Terminal uniqueness and the effect audit entry commit atomically through TenantAuditChain.append_once: one lock in memory and one database transaction plus a primary key on (tenant_id, idempotency_key) for SQLite/Postgres. The former separate ledger was removed because taking its slot before audit append left a crash window that could permanently refuse retry without recording evidence. Production D1-only deployments are refused at the effect endpoint: REMORA_STATE_ENDPOINT makes the nonce ledgers durable but does not store the tenant audit chain, so it cannot honestly satisfy observation_recorded_for_re_checking. Provenance -- dispatch_id, tool_call_hash, observed_state_hash, verifier_version, submitted_by -- is stored in the chain. A receipt is refused when the proposal has no execution_result, when the dispatch was refused and its outcome is not unknown, when the proposal/tool_call_hash/grant identity does not match the recorded dispatch, when the observation predates the dispatch, when the verifier identity is not bound to the authenticated principal, when a settled verdict already exists for that dispatch, or when a settled verdict is claimed without both sides of its comparison recorded. NOT CLAIMED: that REMORA re-runs the comparison. It holds the digests, not the maps or the comparison rules, so it establishes that a verdict is bound, fresh, attributable, unreplayed and re-checkable -- not that the effect occurred. An UNKNOWN dispatch may still be resolved to VERIFIED by a later authoritative check, and a non-terminal verdict may be superseded. Wired 2026-07-27 (issue #13): /v1/execution/execute dispatches through GovernedToolDispatcher under an ExecutionLease after PEP consume; tool callables come only from REMORA_TOOL_REGISTRY_MODULE (research profile ships side-effect-bounded store_artifact/read_telemetry). Response/audit report the real outcome (tool_execution / tool_executed). Evidence tier is stated PER PROPERTY, because they differ. (1) DURABLE NONCE CONSUMPTION OVER D1 -- DEMONSTRATED ON THIS DEPLOYMENT. Wired at servers/execution_api.py::_lease_nonce_store from the same three variables as _GATE. docs/deployment/authority-custody-evidence.md records a governed execution consuming a nonce into D1 remora-execution-state (EEUR); the container replaced (Worker version 222999e2 -> 9a7fc619); a second execution consuming a different nonce; the pre-replacement nonce refused on re-presentation with a UNIQUE constraint violation; and six concurrent consumers of one nonce yielding exactly one winner. A TENANT-SCOPED NONCE NAMESPACE was demonstrated -- the same nonce string succeeded under a different tenant_id, which is a property of this store and is NOT evidence of tenant isolation anywhere else in REMORA. (2) POSTGRES AND SQLITE DURABLE NONCE -- LIBRARY-LEVEL EVIDENCE ONLY (tests/test_lease_nonce_durability.py). Neither adapter has been exercised on a deployment. (3) STORE UNAVAILABLE, AND REFUSING WITHOUT BURNING THE GRANT -- LIBRARY-LEVEL EVIDENCE ONLY. No outage was injected on the deployment. (4) ASYMMETRIC LEASE CUSTODY SPLIT -- DEPLOYED. The deployment runs two trust domains: an AUTHORITY container (a03ae0d6, rix01) holding the Ed25519 private key and no downstream credential, and an EXECUTION container (a036dc4c, otp02) holding the public verification key and the downstream credentials. The lease crosses between them over execution.internal, routed by the Worker (remora/execution/remote_dispatch.py, /v1/execution/dispatch-leased). Evidence at Worker version 6f4b1168: the configuration is pinned by workers/mcp-gateway/test/custody.test.ts (public key present; neither ED25519_PRIVATE nor REMORA_LEASE_SIGNING_KEY in the execution container's envVars); REMORA_LEASE_SIGNING_KEY was DELETED from the Worker secret store, so no symmetric lease key exists in the deployment; and governed execution still returns accept/executed, which is only possible if the authority signed with Ed25519 and the executor verified holding the public key alone. CLAIM, scoped: for this deployment the execution component possessed only public ExecutionLease verification material and, under the recorded attack, could not mint new execution authority. NOT CLAIMED: that REMORA cannot be bypassed -- the executor holds the downstream credentials by design and can still reach the downstream system directly (E2, untouched by splitting keys); that the deployment is secure; or that the executor cannot mint under all compromise models. No code was run inside the deployed execution container to attempt a mint from within it. test_the_deployed_symmetric_topology_permits_forgery is retained as the BEFORE half of the evidence and must not be deleted now that it is historical. The REVIEW path (VERIFY/ESCALATE -> human approval -> redeem) is covered at code level across the split (tests/test_review_path_custody_split.py: the approved call crosses carrying an Ed25519 lease bound to the approved arguments; an unapproved or mutated call never crosses) but was NOT exercised on the deployment, because approving needs a role credential the evidence session did not hold. Remaining: deployed review path, transport-anchored actor identity, D1 tenant-audit-chain storage for effect receipts, Postgres/SQLite durable nonce proven on a deployment, outage behaviour proven on a deployment, PolicyDecisionToken and A2A envelope still symmetric (their verifiers can mint), external attestation of the runtime identity -- the ADR-D binding (remora/enforcement/runtime_identity.py) refuses a lease minted for a different runtime, but the executing process declares its own identity, so a runtime that misdeclares itself is NOT covered and the binding is not exercised on any deployment; signed ToolSpec on the cloud path (no controlled_pilot claim), external validation (REM-021/REM-030)."

