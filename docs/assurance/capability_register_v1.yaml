  - id: CAP-013
    name: "Governed tool dispatch (lease-bound, app-side credentials, deployment-config registry)"
    status: WIRED_API_PATH
    evidence:
      - remora/enforcement/lease.py
      - remora/enforcement/nonce_store.py
      - remora/enforcement/lease_signing.py
      - remora/execution/projections.py
      - remora/governance/effect_receipt.py
      - remora/governance/tenant_chain.py
      - servers/execution_api.py
      - servers/tool_registry_research.py
      - tests/test_execution_api.py
      - tests/test_tool_registry_research.py
      - tests/test_lease_nonce_durability.py
      - tests/test_lease_authority_custody.py
      - tests/test_effect_receipt_atomicity.py
      - tests/test_effect_record_endpoint.py
      - docs/deployment/authority-custody-evidence.md
    verified_at_sha: a800194efc4623a3f41191db6ee65cbd02295306
    verified_by: >-
      post-merge re-audit 2026-08-24: #358 squash commit a800194e contains the
      content-identical audited PR tree. Terminal effect-receipt uniqueness and audit
      evidence now commit in one append_once operation; concurrent and
      rollback fault-injection tests pin the property. D1-only production is
      explicitly refused because its tenant audit chain is not durable; status
      is deliberately unchanged and the caveat names the backend limit. Bound
      to a800194efc4623a3f41191db6ee65cbd02295306. Prior: rebound 2026-08-24
      to the squash-merge commit of #352, which is where
      these sources now live in master's history; content-identical, no status
      or scope change. Prior: re-audit 2026-08-24 (deployment evidence,
      docs/deployment/authority-custody-evidence.md; ADR-A and ADR-B,
      docs/architecture/ADR-authority-custody-and-lease-durability.md):
      lease.py binding set and refusal matrix re-read after the signature,
      nonce-consumption and custody-split changes. Both the durable nonce
      ledger and the asymmetric custody split are now demonstrated on this
      deployment; the caveat states the scope of each, and what each does not
      cover. Status deliberately NOT raised: the properties that gained
      deployment evidence are two of several, and outage behaviour, the
      Postgres/SQLite adapters, the token and A2A signature schemes, F2 and the
      signed-ToolSpec cloud path are all unchanged.
    caveat: "EFFECT RECEIPT LINEAGE (NEGATIVE_RESULTS section 47): REMORA ACCEPTS OR REFUSES a lineage-bound attestation; it does NOT derive the verdict, because it holds the digests and not the maps or the comparison rules and therefore cannot evaluate the postcondition. A settled verdict (VERIFIED or MISMATCH, equal burden) requires a dispatch in the audit chain, a non-empty tool_call_hash and grant_jti matching that dispatch, an observation time supplied by the verifier rather than defaulted to the server clock and neither before the dispatch nor more than five minutes ahead of the server, both digests present and well-formed SHA-256, and a verifier identity bound to the authenticated principal via REMORA_EFFECT_VERIFIER_BINDINGS (defaulting to identity == principal). Terminal uniqueness and the effect audit entry commit atomically through TenantAuditChain.append_once: one lock in memory and one database transaction plus a primary key on (tenant_id, idempotency_key) for SQLite/Postgres. The former separate ledger was removed because taking its slot before audit append left a crash window that could permanently refuse retry without recording evidence. Production D1-only deployments are refused at the effect endpoint: REMORA_STATE_ENDPOINT makes the nonce ledgers durable but does not store the tenant audit chain, so it cannot honestly satisfy observation_recorded_for_re_checking. Provenance -- dispatch_id, tool_call_hash, observed_state_hash, verifier_version, submitted_by -- is stored in the chain. A receipt is refused when the proposal has no execution_result, when the dispatch was refused and its outcome is not unknown, when the proposal/tool_call_hash/grant identity does not match the recorded dispatch, when the observation predates the dispatch, when the verifier identity is not bound to the authenticated principal, when a settled verdict already exists for that dispatch, or when a settled verdict is claimed without both sides of its comparison recorded. NOT CLAIMED: that REMORA re-runs the comparison. It holds the digests, not the maps or the comparison rules, so it establishes that a verdict is bound, fresh, attributable, unreplayed and re-checkable -- not that the effect occurred. An UNKNOWN dispatch may still be resolved to VERIFIED by a later authoritative check, and a non-terminal verdict may be superseded. Wired 2026-07-27 (issue #13): /v1/execution/execute dispatches through GovernedToolDispatcher under an ExecutionLease after PEP consume; tool callables come only from REMORA_TOOL_REGISTRY_MODULE (research profile ships side-effect-bounded store_artifact/read_telemetry). Response/audit report the real outcome (tool_execution / tool_executed). Evidence tier is stated PER PROPERTY, because they differ. (1) DURABLE NONCE CONSUMPTION OVER D1 -- DEMONSTRATED ON THIS DEPLOYMENT. Wired at servers/execution_api.py::_lease_nonce_store from the same three variables as _GATE. docs/deployment/authority-custody-evidence.md records a governed execution consuming a nonce into D1 remora-execution-state (EEUR); the container replaced (Worker version 222999e2 -> 9a7fc619); a second execution consuming a different nonce; the pre-replacement nonce refused on re-presentation with a UNIQUE constraint violation; and six concurrent consumers of one nonce yielding exactly one winner. A TENANT-SCOPED NONCE NAMESPACE was demonstrated -- the same nonce string succeeded under a different tenant_id, which is a property of this store and is NOT evidence of tenant isolation anywhere else in REMORA. (2) POSTGRES AND SQLITE DURABLE NONCE -- LIBRARY-LEVEL EVIDENCE ONLY (tests/test_lease_nonce_durability.py). Neither adapter has been exercised on a deployment. (3) STORE UNAVAILABLE, AND REFUSING WITHOUT BURNING THE GRANT -- LIBRARY-LEVEL EVIDENCE ONLY. No outage was injected on the deployment. (4) ASYMMETRIC LEASE CUSTODY SPLIT -- DEPLOYED. The deployment runs two trust domains: an AUTHORITY container (a03ae0d6, rix01) holding the Ed25519 private key and no downstream credential, and an EXECUTION container (a036dc4c, otp02) holding the public verification key and the downstream credentials. The lease crosses between them over execution.internal, routed by the Worker (remora/execution/remote_dispatch.py, /v1/execution/dispatch-leased). Evidence at Worker version 6f4b1168: the configuration is pinned by workers/mcp-gateway/test/custody.test.ts (public key present; neither ED25519_PRIVATE nor REMORA_LEASE_SIGNING_KEY in the execution container's envVars); REMORA_LEASE_SIGNING_KEY was DELETED from the Worker secret store, so no symmetric lease key exists in the deployment; and governed execution still returns accept/executed, which is only possible if the authority signed with Ed25519 and the executor verified holding the public key alone. CLAIM, scoped: for this deployment the execution component possessed only public ExecutionLease verification material and, under the recorded attack, could not mint new execution authority. NOT CLAIMED: that REMORA cannot be bypassed -- the executor holds the downstream credentials by design and can still reach the downstream system directly (E2, untouched by splitting keys); that the deployment is secure; or that the executor cannot mint under all compromise models. No code was run inside the deployed execution container to attempt a mint from within it. test_the_deployed_symmetric_topology_permits_forgery is retained as the BEFORE half of the evidence and must not be deleted now that it is historical. The REVIEW path (VERIFY/ESCALATE -> human approval -> redeem) is covered at code level across the split (tests/test_review_path_custody_split.py: the approved call crosses carrying an Ed25519 lease bound to the approved arguments; an unapproved or mutated call never crosses) but was NOT exercised on the deployment, because approving needs a role credential the evidence session did not hold. Remaining: deployed review path, transport-anchored actor identity, D1 tenant-audit-chain storage for effect receipts, Postgres/SQLite durable nonce proven on a deployment, outage behaviour proven on a deployment, PolicyDecisionToken and A2A envelope still symmetric (their verifiers can mint), external runtime/tool drift binding (F2, ADR-D), signed ToolSpec on the cloud path (no controlled_pilot claim), external validation (REM-021/REM-030)."

  - id: CAP-014
    name: "Declared-effect consistency (expected_effect_matches tri-state authority)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - remora/toolcall/routing/effect_prediction.py
      - remora/toolcall/routing/tool_contract.py
      - tests/test_effect_prediction.py
      - remora/policy/decision_engine.py
    caveat: "Fills the expected_effect_matches slot that CallCompatibility had left None. Refutes read-request-served-by-mutating-tool, change-request-served-by-read-only-tool, and a declared post-state writing an unnamed resource; tightens a mutating contract with no declared state_delta from SUPPORTED to UNKNOWN. Wired into the routing evaluation path (remora/toolcall/routing/evaluate.py) and the engine's conditional gates, NOT into the /v1/assess REST path, which has no tool contract to read. DISCRIMINATION IS UNMEASURED: no blind or development artifact quantifies what this catches on real data, so no accuracy or error-reduction number may be quoted for it anywhere. Design and source appraisal: docs/13-research-frontier-roadmap.md RF-10. Requires deployment-supplied contracts; absent a contract every verdict is UNKNOWN and nothing changes."

  - id: CAP-015
    name: "Runtime invariant enforcement (CORE_INVARIANTS evaluated on every decision)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - remora/policy/invariants.py
      - remora/policy/decision_engine.py
      - tests/test_runtime_invariant_enforcement.py
      - NEGATIVE_RESULTS.md
    caveat: "Until 2026-08-20 check_all_invariants had NO caller outside the test suite: the module documented itself as machine-verifiable governance invariants while being, in fact, a test fixture. The same safety properties were therefore implemented twice — once as invariants, once inside decide() — with nothing able to notice the two drifting apart. They had drifted; see NEGATIVE_RESULTS section 40. Enforcement now runs at the engine's single build choke point and fails CLOSED to ESCALATE with the violated invariant named in the audit explanation (DecisionReason.INVARIANT_VIOLATION_ESCALATE). It can only make a decision stricter, never more permissive. Off only via verify_invariants=False, which is for measuring the check's own cost; a deployment that disables it is running unverified decisions. The shadow-replay no_hard_guards ablation arm disables it deliberately so the delta still isolates the hard guards."

  - id: CAP-016
    name: "Structured governance events (operational logging in the safety core)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - remora/observability/events.py
      - remora/enforcement/gate.py
      - remora/policy/decision_engine.py
      - tests/test_governance_events.py
    caveat: "remora/policy, remora/enforcement and remora/execution held ZERO loggers between them before 2026-08-20, so a refused grant or a failed dispatch produced no log line in production — only whatever the tenant audit chain happened to record. The chain and this log answer different questions: the chain is the governance record (what was authorised, under which policy, by whom), this is the operational record (what the process did, when). Events: decision.made, decision.invariant_violated, lease.issued, grant.checked, dispatch.settled. Field NAMES are screened and governance_event raises SecretFieldError rather than logging a field whose name looks like a credential, while allowing the derived forms that make correlation possible (token_jti identifies a grant; token_verified says whether one checked out; neither can be replayed). Nothing is emitted unless a handler is configured for the remora.governance logger. NOT a substitute for the audit chain and not itself tamper-evident."

  - id: CAP-017
    name: "Production fail-closed on signing keys"
    status: WIRED_API_PATH
    evidence:
      - servers/api.py
      - tests/test_audit_chain_integrity.py
      - docs/deployment/execution-quickstart.md
    caveat: "Before 2026-08-20 a deployment with REMORA_ENV=production started without REMORA_ENVELOPE_SIGNING_KEY or REMORA_PDP_SIGNING_KEY and wrote every audit record with signature: null — tamper-evident in name only, while the code warned about it in a string it never acted on. Both keys are now in the production prerequisite list and the server refuses to start without either. Symmetric HMAC only: production still needs JWS/COSE and trust anchors (see CAP-006), and there is no KMS/HSM custody, so this closes the presence gap and not the key-management one."

  - id: CAP-META
    name: "Metatesting of the evidence regime (audit gates are mutation-tested)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - tests/meta/test_divergence.py
      - tests/meta/test_register_evidences.py
    caveat: "Metatest detection logic covers basic claim parsing and basic structural evidence, but does not capture all complex prose statements automatically."
