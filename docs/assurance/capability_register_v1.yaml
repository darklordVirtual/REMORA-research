    caveat: "remora/policy, remora/enforcement and remora/execution held ZERO loggers between them before 2026-08-20, so a refused grant or a failed dispatch produced no log line in production — only whatever the tenant audit chain happened to record. The chain and this log answer different questions: the chain is the governance record (what was authorised, under which policy, by whom), this is the operational record (what the process did, when). Events: decision.made, decision.invariant_violated, lease.issued, grant.checked, dispatch.settled. Two layers, because one was not enough. Field NAMES are screened and governance_event raises SecretFieldError rather than logging a field whose name looks like a credential, while allowing the derived forms that make correlation possible (token_jti identifies a grant; token_verified says whether one checked out; neither can be replayed). Field VALUES are then redacted for credential-shaped and location-shaped runs, because a free-text field such as detail=str(exc) carries whatever a downstream library put in its exception message, under a field name nothing objects to (external review RMR-003). Digests and identifiers are exempt by name, so an audit trail keeps what it exists to carry. Redaction is a net under text that should not have been free text, not a licence to log a secret deliberately. Nothing is emitted unless a handler is configured for the remora.governance logger. NOT a substitute for the audit chain and not itself tamper-evident."

