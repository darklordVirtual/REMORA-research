      - tests/test_opa_parity.py
      - scripts/opa_conformance.py
    caveat: "CI-gated conformance; not exposed through the REST API."

  - id: CAP-003
    name: "Signed PDP->PEP token (mandatory expiry, jti one-time consumption, audience, max age)"
    status: WIRED_API_PATH
    evidence:
      - remora/enforcement/token.py
      - remora/enforcement/gate.py
      - tests/test_token_hardening.py
      - servers/execution_api.py
    verified_at_sha: 3bb57973eca0a1c98568b1d98a50d1940883e4e0
    verified_by: >-
      re-audit 2026-08-23 (ADR-B, docs/architecture/ADR-authority-custody-and-lease-durability.md):
      rebound because the lease nonce half of the caveat changed. The token half
      was re-read against gate.py and tests/test_token_hardening.py and is
      unchanged; the token signature remains HMAC-SHA256 and is NOT covered by
      ADR-A, which converts the lease only.
    caveat: "Issued and consumed via /v1/execution/*; jti one-time consumption persists to a pep_consumed table when REMORA_PG_DSN (Postgres) or REMORA_CHAIN_DB (SQLite) is configured (remora/enforcement/gate.py), in-process set by default. A second gate over the same durable ledger refuses the replay (tests/test_token_hardening.py::test_durable_ledger_refuses_the_replay_from_a_second_gate); no test spawns a new interpreter, so behaviour across an actual process restart is inferred from the shared ledger, not directly observed. The lease nonce ledger now has a durable adapter of its own (remora/enforcement/nonce_store.py, CAP-013); it is opt-in per dispatcher and is not proven configured on any deployment. The token signature is HMAC-SHA256: the verifier holds the material to mint, and ADR-A converts the lease only, so this capability does not yet carry an asymmetric custody claim."

  - id: CAP-004
    name: "Tool-call payload binding (canonical hash, recomputed before execution)"
    status: WIRED_API_PATH
    evidence:
      - remora/policy/observation.py
      - servers/execution_api.py
      - tests/test_execution_api.py
    caveat: "/v1/execution/assess hashes tool name + full arguments at the boundary; the legacy /v1/assess keeps summary binding until migrated."

  - id: CAP-005
    name: "Audit chain (hash-chained decision history)"
    status: PERSISTED_ATOMIC
    evidence:
      - remora/governance/tenant_chain.py
      - servers/execution_api.py
      - tests/test_execution_api.py
    caveat: "PERSISTED_ATOMIC when REMORA_CHAIN_DB (SQLite, restart-proven) or REMORA_PG_DSN (Postgres FOR UPDATE) is configured; default in-process. Queue and jti gained durable stores under the same env switches (see CAP-007/CAP-003); the nonce ledger and the assess idempotency cache remain in-process; legacy /v1/assess unmigrated."

  - id: CAP-006
