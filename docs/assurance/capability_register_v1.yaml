      Prior: audit 2026-09-28 at registration (Q7.2): a call's context_id and task_id enter the ACCEPT token's authorization context and the lease; a token redeemed under another task or with the task stripped is refused as context_mismatch before its grant is spent, and the executor refuses a lease from another task. /assess reads the context's loop-safety state before deciding and records after; a context at a limit cannot ACCEPT, and an unreadable store is a 503 with nothing chained. Reviewer routes read and reset the state; a reset needs a policy reference and is chained. Evidence green at this revision. Bound to the branch commit 6a8ef138, rebound to the #608 squash commit f901ffd.
