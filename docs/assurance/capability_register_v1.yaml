# REMORA Capability Register v1
# Single machine-readable source of truth for HOW FAR each claimed mechanism
# is actually wired (external documentation review, 2026-07-18). Narrative
# documents must not claim a stronger status than this register records.
# Validated by tests/test_capability_register.py (structure + evidence paths).
#
# Status ladder (cumulative — each level implies the ones above it):
#   IMPLEMENTED_LIBRARY  - module and unit tests exist
#   WIRED_REFERENCE_PATH - wired in a demo or reference flow
#   WIRED_API_PATH       - used by the public REST API
#   PERSISTED_ATOMIC     - state transitions are atomically persisted
#   ENFORCED_PRODUCTION  - a real PEP enforces it on live actions
#   EXTERNALLY_VERIFIED  - independently verified (REM-021 or later)
#
# NOTE: nothing in this repository is ENFORCED_PRODUCTION or
# EXTERNALLY_VERIFIED — deployment_status is SHADOW_ONLY until REM-021.

schema_version: "1"
updated: "2026-10-06"

# Research gaps are property verdicts, not capability maturity rungs. They do
# not imply that a library test establishes a deployed runtime property.
unestablished_properties:
  - id: execution_context_authoritative_binding
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: tests/test_execution_context_binding.py
    caveat: >-
      The opt-in execution-context path binds deployment-supplied subject,
      proposal-initiating model, scoped data classification and build/runtime
      provenance through assessment, review, grant, lease, dispatch and effect
      recording. Internal tests do not establish the authority of deployment
      sources or a deployed end-to-end property. TRACE export and hardware
      attestation are not implemented by this path.
  - id: runtime_capability_surface_completeness
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: artifacts/runtime_surface/negative_cases_v1.json
    caveat: >-
      REMORA's opt-in reference runtime observes its own offered list and
      dispatcher with tests and reproducible evidence under RES-013. This does
      not establish completeness for external agent processes, host credentials,
      or unobserved alternative paths. The global property remains unestablished.
      Q3.2 to Q3.5 (2026-09-28) add surface-digest binding in the lease, closure
      identity, issuer-observed credential scope and durable surface evidence to
      the reference runtime; the property stays NOT_ESTABLISHED until Q3.1 runs
      the observer inside a named external host.

  - id: implementation_effect_non_transitivity
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: docs/design/authority-preserving-capability-mediation-v1.md
    caveat: >-
      NTA-2: authorization of a tool does not authorize the privileged effects
      its implementation can reach. Phases 1 to 3 (CAP-024) implement it,
      including a three-domain split whose effect domain alone holds the
      declared effect credentials. The pre-registered experiment measured the
      mechanism on an author-written corpus (arm C stopped all eight unsafe
      classes; NEGATIVE_RESULTS.md §63 records one missed prediction). It stays
      NOT_ESTABLISHED because no deployment runs that split. In the research
      profile a tool must opt in, and code
      that uses a client or credential directly is not stopped, so credential
      topology L3 and L5 stand unchanged. The property stays NOT_ESTABLISHED
      until the strict profile separates effect credentials from tool workers
      and a deployment provides evidence for it (design phase 3).

  - id: exact_call_binding_over_federation_port_v0
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: artifacts/interop/federation-port-v0/projection-map.yaml
    caveat: >-
      federation-port/v0 carries arguments as JavaScript values, a tenant
      label and no principal, so REMORA's exact_call_binding-v1.1 projects
      NARROWED to remora.port_v0.bound_action (CAP-027). Full exact-call
      binding over V0 would need typed scalars, an authenticated tenant and
      principal, and an independent target.
  - id: fresh_authority_over_federation_port_v0
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: artifacts/interop/federation-port-v0/projection-map.yaml
    caveat: >-
      V0 exposes expiry at admission (remora.authorization_unexpired) on the
      runtime's local clock. Revocation, trusted time, ToolSpec freshness and
      signing-key status are not evaluated over V0.
  - id: effect_verification_over_federation_port_v0
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: remora/federation/lifecycle.py
    caveat: >-
      V0 has no system-of-record observation; provider_confirmed is an
      execution report. Only REMORA's effect verifier establishes an effect,
      as a separate edge.
  - id: custody_isolation_over_federation_port_v0
    phase: RESEARCH
    status: NOT_ESTABLISHED
    evidence: artifacts/interop/federation-port-v0/capabilities.yaml
    caveat: >-
      federation-port/v0 runs adapters in the runtime's own process (its
      contract section 10), so no authority/executor custody isolation
      survives the transport.

# Verification binding (issue #281). A capability's status and caveat are
# claims about code, so they are bound to the revision that was audited.
# `verified_at_sha` is checked by scripts/check_capability_freshness.py: if an
# implementation source cited in `evidence` moved after that commit, the
# capability is stale and CI fails.
#
# The backlog is deliberately not cleared by writing HEAD everywhere - that
# would assert audits nobody performed. Unbound capabilities are counted
# against `unbound_baseline`, which may fall as capabilities are audited and
# may never rise, so a newly added capability must be bound from the start.
verification_binding:
  unbound_baseline: 0

