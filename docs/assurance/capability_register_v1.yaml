      - remora/aromer/evals/cross_domain_transfer.py
      - scripts/run_cross_domain_transfer.py
      - results/aromer_cross_domain_transfer_v1.json
      - tests/test_cross_domain_transfer.py
    caveat: "OFFLINE measurement (leave-one-domain-out over the curated corpus): 83.8% transfer accuracy. NOT the live worker gate — crossDomainCases still reads 0 and interpretation stays TRANSFER_UNMEASURED until organic cross-domain traffic exists (NEGATIVE_RESULTS §16)."

  - id: CAP-013
    name: "Governed tool dispatch (lease-bound, app-side credentials, deployment-config registry)"
    status: WIRED_API_PATH
    evidence:
      - remora/enforcement/lease.py
      - remora/enforcement/nonce_store.py
      - remora/enforcement/lease_signing.py
      - servers/execution_api.py
      - servers/tool_registry_research.py
      - tests/test_execution_api.py
      - tests/test_tool_registry_research.py
      - tests/test_lease_nonce_durability.py
      - tests/test_lease_authority_custody.py
    verified_at_sha: ceb979f538704251cbe252b086e23b2e9f7bd51b
    verified_by: >-
      re-audit 2026-08-23 (ADR-A and ADR-B,
      docs/architecture/ADR-authority-custody-and-lease-durability.md):
      lease.py binding set and refusal matrix re-read after the signature and
      nonce-consumption changes. Status deliberately NOT raised: both changes
      add a mechanism with library-level adversarial evidence, and neither is
      demonstrated on a deployment.
    caveat: "Wired 2026-07-27 (issue #13): /v1/execution/execute dispatches through GovernedToolDispatcher under an ExecutionLease after PEP consume; tool callables come only from REMORA_TOOL_REGISTRY_MODULE (research profile ships side-effect-bounded store_artifact/read_telemetry). Response/audit report the real outcome (tool_execution / tool_executed). Lease nonce consumption has a durable, tenant-scoped, fail-closed adapter (remora/enforcement/nonce_store.py: Postgres, SQLite, D1 state endpoint) which is refused-without-burning on an unknown outcome; a replacement dispatcher over the same store refuses the replay (tests/test_lease_nonce_durability.py). It is wired on the deployed Cloudflare path (servers/execution_api.py::_lease_nonce_store, built from the same three variables as _GATE) and DEMONSTRATED there: docs/deployment/authority-custody-evidence.md records a governed execution consuming a nonce into D1 remora-execution-state (EEUR), the container being replaced (Worker version 222999e2 -> 9a7fc619), a second execution consuming a different nonce, and the pre-replacement nonce being refused on re-presentation with a UNIQUE constraint violation. Six concurrent consumers of one nonce yielded exactly one winner. Tenant isolation was shown by the same nonce succeeding under a different tenant_id. Scope: this is evidence for the D1 backend on this deployment; the Postgres and SQLite adapters are evidenced at library level only. The store-unavailable and does-not-burn-the-grant properties are library-level only -- no outage was injected on the deployment. The lease signature supports Ed25519 with a private-issuer/public-verifier split, attacked in tests/test_lease_authority_custody.py. The custody split is NOT DEPLOYED: no Ed25519 keypair has been generated, and the execution container is still supplied REMORA_LEASE_SIGNING_KEY (workers/mcp-gateway/src/index.ts:170). The consequence is recorded as a demonstrated negative result rather than a residual risk in prose: test_the_deployed_symmetric_topology_permits_forgery asserts that a component holding what the deployed container holds MINTS a valid lease for a different tool, different arguments, a different tenant and a different target. Under the target topology the same attack is refused both at issuance and at verification. No separation claim may be made for this deployment. Remaining: transport-anchored actor identity, durable nonce storage proven on a deployment, key custody actually split in the Cloudflare configuration, external runtime/tool drift binding (F2, ADR-D), deployment fronting real downstream credentials, external validation (REM-021/REM-030)."

  - id: CAP-014
    name: "Declared-effect consistency (expected_effect_matches tri-state authority)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - remora/toolcall/routing/effect_prediction.py
      - remora/toolcall/routing/tool_contract.py
      - tests/test_effect_prediction.py
      - remora/policy/decision_engine.py
    caveat: "Fills the expected_effect_matches slot that CallCompatibility had left None. Refutes read-request-served-by-mutating-tool, change-request-served-by-read-only-tool, and a declared post-state writing an unnamed resource; tightens a mutating contract with no declared state_delta from SUPPORTED to UNKNOWN. Wired into the routing evaluation path (remora/toolcall/routing/evaluate.py) and the engine's conditional gates, NOT into the /v1/assess REST path, which has no tool contract to read. DISCRIMINATION IS UNMEASURED: no blind or development artifact quantifies what this catches on real data, so no accuracy or error-reduction number may be quoted for it anywhere. Design and source appraisal: docs/13-research-frontier-roadmap.md RF-10. Requires deployment-supplied contracts; absent a contract every verdict is UNKNOWN and nothing changes."

  - id: CAP-015
    name: "Runtime invariant enforcement (CORE_INVARIANTS evaluated on every decision)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - remora/policy/invariants.py
      - remora/policy/decision_engine.py
      - tests/test_runtime_invariant_enforcement.py
      - NEGATIVE_RESULTS.md
    caveat: "Until 2026-08-20 check_all_invariants had NO caller outside the test suite: the module documented itself as machine-verifiable governance invariants while being, in fact, a test fixture. The same safety properties were therefore implemented twice — once as invariants, once inside decide() — with nothing able to notice the two drifting apart. They had drifted; see NEGATIVE_RESULTS section 40. Enforcement now runs at the engine's single build choke point and fails CLOSED to ESCALATE with the violated invariant named in the audit explanation (DecisionReason.INVARIANT_VIOLATION_ESCALATE). It can only make a decision stricter, never more permissive. Off only via verify_invariants=False, which is for measuring the check's own cost; a deployment that disables it is running unverified decisions. The shadow-replay no_hard_guards ablation arm disables it deliberately so the delta still isolates the hard guards."

  - id: CAP-016
    name: "Structured governance events (operational logging in the safety core)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - remora/observability/events.py
      - remora/enforcement/gate.py
      - remora/policy/decision_engine.py
      - tests/test_governance_events.py
    caveat: "remora/policy, remora/enforcement and remora/execution held ZERO loggers between them before 2026-08-20, so a refused grant or a failed dispatch produced no log line in production — only whatever the tenant audit chain happened to record. The chain and this log answer different questions: the chain is the governance record (what was authorised, under which policy, by whom), this is the operational record (what the process did, when). Events: decision.made, decision.invariant_violated, lease.issued, grant.checked, dispatch.settled. Field NAMES are screened and governance_event raises SecretFieldError rather than logging a field whose name looks like a credential, while allowing the derived forms that make correlation possible (token_jti identifies a grant; token_verified says whether one checked out; neither can be replayed). Nothing is emitted unless a handler is configured for the remora.governance logger. NOT a substitute for the audit chain and not itself tamper-evident."

  - id: CAP-017
    name: "Production fail-closed on signing keys"
    status: WIRED_API_PATH
    evidence:
      - servers/api.py
      - tests/test_audit_chain_integrity.py
      - docs/deployment/execution-quickstart.md
    caveat: "Before 2026-08-20 a deployment with REMORA_ENV=production started without REMORA_ENVELOPE_SIGNING_KEY or REMORA_PDP_SIGNING_KEY and wrote every audit record with signature: null — tamper-evident in name only, while the code warned about it in a string it never acted on. Both keys are now in the production prerequisite list and the server refuses to start without either. Symmetric HMAC only: production still needs JWS/COSE and trust anchors (see CAP-006), and there is no KMS/HSM custody, so this closes the presence gap and not the key-management one."

  - id: CAP-META
    name: "Metatesting of the evidence regime (audit gates are mutation-tested)"
    status: IMPLEMENTED_LIBRARY
    evidence:
      - tests/meta/test_divergence.py
      - tests/meta/test_register_evidences.py
    caveat: "Metatest detection logic covers basic claim parsing and basic structural evidence, but does not capture all complex prose statements automatically."
