      Library only: nothing in the runtime reads an EvidenceAdmission, and no
      adapter feeds it into the frozen conformance checkers (their
      synthetic-fixture premise boundary stands). process_evidence_payload
      bounds raw JSON and separates malformed input, unsupported schemas,
      parser errors, and verifier exceptions from property facts. A caller
      supplies a schema-specific parser for the five typed evidence records;
      the parser is trusted code and this does not authenticate its source.
      Prior commitments must match deployment-pinned digests, and observer
      domains must appear in the deployment trust configuration.
      Acquisition code can report a processing failure through
      processing_failure. TrustConfig's accepted-producer map and
      accepted-coverage digests are the deployment's authority. A misconfigured deployment accepts what it
      configured, and a dishonest clock defeats the prior-commitment predating
      check. Claim ceiling in docs/design/evidence-admission-v1.md: no global
      completeness, no non-bypassability, no independence from a declaration,
      no accepted event content or property refutation, no absence outside the
      established denominator, no causation, no authorization from evidence.
