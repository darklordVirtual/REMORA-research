# Author: Stian Skogbrott
# SPDX-License-Identifier: BUSL-1.1
#
# Credential topology register — the static half of Agent Authority
# property E (execution-boundary integrity).
#
# Enforced by scripts/check_credential_topology.py. Every secret-bearing
# environment variable read under the scanned roots must appear here, its
# reader set must match what the AST scan finds, and any credential
# declared unreachable from the agent zone must not be read by a module the
# agent zone transitively imports.
#
# This register describes environment-held credentials in THIS repository.
# It is not a claim about a deployment. See `limits` at the end: the parts
# of E it cannot reach are the bypass suite's subject
# (tests/conformance/test_execution_boundary.py), and both are reported
# together in the conformance assessment.

version: 1

scope:
  scanned_roots:
    - remora
    - servers
  excluded:
    - path: remora/research_attic
      reason: >-
        Retired research code, not imported by any shipped surface. Kept for
        provenance under the negative-results policy. Its credentials are
        outside the runtime topology by construction, and the exclusion is
        itself a claim the reader can falsify by grepping for imports.
    - path: scripts
      reason: >-
        Operator tooling, invoked by a human or by CI, not reachable from a
        governed tool call. This is a real assumption, not a technicality:
        an agent that can execute arbitrary repository scripts reaches these
        credentials directly. That path is recorded as limit L4 and is the
        subject of a bypass-suite case rather than being silently excluded.

# The agent zone is the transitive import closure of these roots. The
# choice is grounded in the repository's own stated contract, not in
# convenience: remora/sdk documents itself as the surface third-party
# integrators depend on, and states that they must never reach into
# internal modules; remora/agent_hook runs inside the agent's own process.
#
# remora/toolcall is deliberately NOT a zone root. It is dispatcher-side
# and benchmark-side machinery (remora_gate, live_execution, the benchmark
# harness), so treating it as agent-controlled would conflate the agent
# with the policy enforcement point. That decision changes the result: with
# remora/toolcall included, nine credentials fall inside the zone. The
# honest reading is that this register's reachability claim holds for
# deployments where agent-controlled code sees the SDK and the hook, and
# does not hold where agent-controlled code can import REMORA internals.
# That deployment condition is limit L1.
agent_zone_roots:
  - remora/sdk
  - remora/agent_hook

credentials:

  # ---- Authority-domain signing keys -------------------------------------
  # These do not reach an external effect on their own. They mint or verify
  # the artifacts that authorize one, so holding one is equivalent to
  # holding the authority itself.

  - name: REMORA_PDP_SIGNING_KEY
    class: authority_key
    holder: authority domain
    authorized_path: remora/enforcement/token.py mints and verifies PolicyDecisionTokens
    read_by:
      - remora/enforcement/token.py
      - servers/api.py
    agent_reachable: false
    note: >-
      Whoever holds this can mint a decision token for any call, which
      collapses properties A, B and C at once.

  - name: REMORA_PDP_PREVIOUS_KEYS
    class: authority_key
    holder: authority domain
    authorized_path: remora/enforcement/token.py, rotation verification only
    read_by:
      - remora/enforcement/token.py
    agent_reachable: false
    note: >-
      Retired signing keys retained to verify tokens issued before a
      rotation. Verification-only in intent, but the material is a signing
      key, so it is classed with the key it replaced.

  - name: REMORA_LEASE_SIGNING_KEY
    class: authority_key
    holder: authority domain
    authorized_path: HMAC lease signing, selected in remora/enforcement/lease_signing.py
    read_by:
      - servers/api.py
    agent_reachable: false
    note: >-
      Also read through a loop over module constants in
      remora/enforcement/lease.py and lease_signing.py, which the scanner
      records as dynamic sites D3 and D4 rather than as readers. read_by
      lists statically resolvable reads only.

  - name: REMORA_LEASE_SIGNING_KEY_ED25519_PRIVATE
    class: authority_key
    holder: authority domain
    authorized_path: remora/enforcement/lease_signing.py signs ExecutionLeases
    read_by:
      - remora/enforcement/lease_signing.py
      - servers/api.py
    agent_reachable: false
    note: >-
      The custody split in ADR-A depends on this key being absent from the
      execution domain: a process that cannot sign cannot mint a lease for
      itself, which is what makes the split more than cosmetic.

  - name: REMORA_LEASE_ACCEPT_HMAC
    class: authority_key
    holder: authority domain
    authorized_path: remora/enforcement/lease_signing.py, ACCEPT-path lease acceptance
    read_by:
      - remora/enforcement/lease_signing.py
    agent_reachable: false
    note: Symmetric key, so acceptance and forgery are the same capability.

  - name: REMORA_A2A_SIGNING_KEY
    class: authority_key
    holder: authority domain
    authorized_path: remora/governance/a2a_envelope.py signs agent-to-agent envelopes
    read_by:
      - remora/governance/a2a_envelope.py
    agent_reachable: false
    note: >-
      Signs the envelope that carries delegated authority between agents,
      so it is property B material rather than transport material.

  - name: REMORA_AUDIT_SIGNING_KEY
    class: authority_key
    holder: authority domain
    authorized_path: remora/governance/tenant_chain.py seals per-tenant audit chains
    read_by:
      - remora/governance/tenant_chain.py
    agent_reachable: false
    note: >-
      Reaching this does not authorize an action; it lets the record of one
      be rewritten, which is why it sits with the authority keys.

  - name: REMORA_ENVELOPE_SIGNING_KEY
    class: authority_key
    holder: authority domain
    authorized_path: servers/api.py signs decision envelopes
    read_by:
      - servers/api.py
    agent_reachable: false
    note: Same argument as the audit signing key, applied to decision envelopes.

  # ---- Public verification material --------------------------------------

  - name: REMORA_LEASE_VERIFY_KEY_ED25519_PUBLIC
    class: non_effect
    agent_reachable: false
    read_by:
      - remora/enforcement/lease_signing.py
      - servers/api.py
    note: >-
      Public verification key. Matches the secret name pattern and is
      therefore declared, but disclosure grants nothing. It is precisely
      what the execution domain is supposed to hold instead of the private
      key, so its presence there is the custody split working.

  # ---- State backends ----------------------------------------------------

  - name: REMORA_PG_DSN
    class: state_backend
    holder: execution and authority domains, separately provisioned
    authorized_path: durable execution state, outbox and nonce store
    read_by:
      - servers/api.py
      - servers/execution_api.py
    agent_reachable: false
    note: >-
      Carries a database password. Direct access would let single-use grant
      state be rewritten, which is a property F bypass rather than a
      property E one, but the credential topology is the same question.

  - name: REMORA_CONTROL_PLANE_DSN
    class: state_backend
    holder: authority domain
    authorized_path: control-plane persistence in servers/api.py
    read_by:
      - servers/api.py
    agent_reachable: false
    note: Separate control-plane store; same reasoning as REMORA_PG_DSN.

  # ---- Transport credentials ---------------------------------------------
  # These authenticate a hop. Holding one lets a caller ask a service to do
  # something; it does not let the caller forge the authority to do it.

  - name: REMORA_EXECUTION_TOKEN
    class: transport_credential
    agent_reachable: false
    read_by:
      - remora/execution/remote_dispatch.py
    note: >-
      Bearer for the authority-to-executor hop. remote_dispatch.py states
      the property this depends on: the executor verifies the lease against
      the concrete call, so a caller holding this token can ask for
      execution but cannot supply authority for it.

  - name: REMORA_API_BEARER_TOKEN
    class: transport_credential
    agent_reachable: false
    read_by:
      - remora/adapters/gateway.py
      - servers/api.py
    note: Client-side bearer for the governance API.

  - name: REMORA_API_TOKENS
    class: transport_credential
    agent_reachable: false
    read_by:
      - servers/api.py
    note: Server-side accepted bearer set for the governance API.

  # ---- Oracle credentials ------------------------------------------------
  # Model-provider keys. They buy inference, not an effect on a governed
  # system. Declaring them is what makes that distinction checkable instead
  # of assumed, which was the point of building the register.

  - name: GROQ_API_KEY
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/cli.py
      - remora/oracles/factory.py
      - remora/oracles/groq.py
    note: >-
      remora/cli.py writes this into os.environ from operator input, so in a
      CLI process the key is ambient. That is acceptable for an oracle key
      and would not be for an authority key; the bypass suite asserts no
      authority key is ambient in the same way.

  - name: GEMINI_API_KEY
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/cli.py
      - remora/oracles/factory.py
      - remora/oracles/gemini.py
    note: Same as GROQ_API_KEY, including the CLI ambient write.

  - name: OPENROUTER_API_KEY
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/factory.py
      - remora/oracles/openrouter.py
    note: Model-provider key.

  - name: HF_TOKEN
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/huggingface.py
    note: Model-provider key.

  - name: HUGGING_FACE_HUB_TOKEN
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/huggingface.py
    note: Alternate spelling accepted by the same adapter.

  - name: CF_AIG_TOKEN
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/cloudflare.py
      - remora/toolcall/baselines_llm.py
    note: >-
      Cloudflare AI Gateway token. Read by the benchmark baseline as well
      as the oracle adapter, which is why remora/toolcall is stated
      explicitly as outside the agent zone rather than left implicit.

  - name: CF_AI_GATEWAY_KEY
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/cloudflare.py
    note: Alternate spelling for the AI Gateway token.

  - name: CLOUDFLARE_API_TOKEN
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/cloudflare.py
      - remora/toolcall/baselines_llm.py
    note: >-
      Account-scoped Cloudflare token. Broader than an inference key in what
      it can reach on the account, and classed here only because no shipped
      governed tool dispatches through it. If one ever does, this entry must
      move to effect_credential.

  - name: CLOUDFLARE_ORACLE_SECRET
    class: oracle_credential
    agent_reachable: false
    read_by:
      - remora/oracles/factory.py
    note: Shared secret for the oracle Worker hop.

# Environment reads whose key this scanner cannot resolve statically. Each
# is an opaque point in the topology, so each is declared with what it
# actually reads. Undeclared opacity fails the gate.
dynamic_read_sites:
  - site: remora/audit/anchor.py:70
    reason: >-
      Reads a caller-supplied env var name held on the instance. The name is
      deployment configuration for the anchor signing key, so the material
      is covered by the authority-key class even though the site is opaque.
  - site: remora/cli.py:995
    reason: >-
      Doctor command probing which oracle keys are present, over a literal
      tuple of already-declared names. Presence check only; no value is used.
  - site: remora/enforcement/lease.py:99
    reason: >-
      Loop over the module constants for the lease signing key and its PDP
      fallback. Both names are declared credentials; the loop is what makes
      the site opaque to the scanner.
  - site: remora/enforcement/lease_signing.py:150
    reason: Same loop shape as lease.py:99, for the HMAC key and its fallback.
  - site: remora/toolcall/runtime_profile.py:69
    reason: >-
      Generic presence helper taking names from its caller. Used for profile
      prerequisite checks, and reads no value.
  - site: servers/api.py:133
    reason: Rate-limit budget lookup by per-surface env var name. Numeric config.
  - site: servers/api.py:488
    reason: Generic boolean flag helper. Config only.
  - site: servers/api.py:932
    reason: >-
      Presence check for the deployment tool-metadata file path. Path, not
      credential.
  - site: servers/api.py:937
    reason: Logs the same tool-metadata path after loading.
  - site: servers/api.py:1104
    reason: >-
      Folds the tool-registry and semantic-bundle module names into the
      policy bundle hash. Module names, not credentials.
  - site: servers/execution_api.py:181
    reason: Local boolean flag helper in the execution surface. Config only.

# What a PASS from the static gate does NOT establish. These are carried
# into the conformance assessment verbatim; property E is reported as the
# static result plus the bypass-suite result, never as the static result
# alone.
limits:
  - id: L1
    limit: >-
      The reachability claim holds for the declared agent zone. A deployment
      that lets agent-controlled code import REMORA internals directly has a
      wider zone, and nine credentials fall inside it.
  - id: L2
    limit: >-
      Import reachability is not process co-residency. A credential in the
      environment of a process that also runs agent code is readable whether
      or not any module imports it. Covered by the bypass suite, not here.
  - id: L3
    limit: >-
      Delegated reachability through an already authenticated client object,
      connection pool or subprocess is invisible to a static import scan.
  - id: L4
    limit: >-
      scripts/ is excluded as operator tooling. An agent able to execute
      repository scripts reaches the credentials read there.
  - id: L5
    limit: >-
      The downstream credentials that reach a real external effect are not
      in this register, because GovernedToolDispatcher holds tool callables
      registered by deployment configuration and those callables close over
      the credential. Partially addressed since this register was written:
      tests/conformance/test_execution_boundary_process_split.py runs a real
      credential behind a real refusal across three processes, and shows the
      agent process cannot reach the effect while an authorised call can,
      with the outcome confirmed by authoritative read-back. What remains is
      that the fixture provisions its own credential over loopback HTTP. A
      production deployment's SMTP or vendor credential, its network
      reachability and its process boundaries are still unassessed, so the
      gap is narrowed rather than closed.
  - id: L6
    limit: >-
      The import-edge scan is a regex over import statements. A missed edge
      shrinks the zone, so the failure mode is a missed finding rather than
      a false accusation, and a PASS means no demonstrable reachability
      rather than proven unreachability.
