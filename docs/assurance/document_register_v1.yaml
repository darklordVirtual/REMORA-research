# REMORA Document Register v1  (schema v2)
# Single machine-readable source of truth for the GOVERNANCE STATUS and
# VERIFICATION STATE of every tracked knowledge document under docs/, paper/,
# and an explicit root-document allowlist (README.md, ARCHITECTURE.md,
# NEGATIVE_RESULTS.md, SECURITY.md, CONTRIBUTING.md, CONTRIBUTORS.md, CLAUDE.md,
# EVIDENCE_OF_CAPABILITY.md, NOTICE). The exact coverage set is computed by
# scripts/check_document_governance.py (`git ls-files` over docs/ + paper/ plus
# the ROOT_DOCS allowlist); CI fails if register entries and tracked files do
# not match exactly.
# Validated by scripts/check_document_governance.py (CI gate) and
# tests/test_document_governance.py.
#
# Per-entry fields:
#   id            - DOC-NNN, stable and unique; assigned path-sorted, then
#                   FROZEN (a new document takes the next free number; ids are
#                   never renumbered, so external references stay valid).
#   path          - repository-relative path to the tracked document.
#   version       - document version (vN); inferred from an _vN filename marker
#                   where present, else v1. Bump when the document's substance
#                   changes materially.
#   status        - governance status (enum below).
#   topic         - controlled topic (canonical entries only; unique per topic).
#   generated_by  - producing script (generated entries only).
#   superseded_by - successor path (superseded entries only).
#   last_reviewed - ISO date the CONTENT was last verified against the code /
#                   tests / artifacts it describes. null == never audited; it is
#                   NOT a claim of correctness. Only stamped when a real review
#                   happened (see docs/05-claim-hygiene.md).
#   code_synced   - unreviewed | verified | mismatch. `verified` means the
#                   claims/paths/APIs in the document were checked against source
#                   on last_reviewed; `mismatch` means a known drift is recorded
#                   in verdict/notes and awaits a fix.
#   verdict       - pending | current | fixed | consolidate | stale.
#
# Statuses:
#   canonical  - the single authoritative document for its topic (topic unique)
#   generated  - produced by a script; edit the generator, not the file
#   supporting - explanatory/narrative; must not contradict canonical sources
#   proposal   - proposed/roadmap content; not implemented claims
#   historical - dated snapshot preserved unedited; must not be cited as current
#   superseded - kept so old links resolve; superseded_by names the successor
#
# Scope note: this register governs GOVERNANCE STATUS and VERIFICATION STATE of
# docs/ + paper/ + the root-document allowlist above. Content-level gates still
# apply on top of it (README/root claims, numeric-claim consistency) and are not
# duplicated here.

