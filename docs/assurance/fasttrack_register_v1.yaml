# Fasttrack register v1 — machine-readable status for the world-class
# fasttrack program (2026-08-05). Source of truth for what the program has
# actually delivered; prose claims about fasttrack progress must match this
# file. Status values: NOT_STARTED | DESIGN_IN_REVIEW | IN_PROGRESS |
# BLOCKED_ON_MAINTAINER | DONE. A task is DONE only when every layer of the
# delivery contract is satisfied (ADR, code, tests, artifacts, docs,
# registers, literature, negative results, UI, external review where
# required) — merged code alone never flips a status to DONE.

version: 1
updated: '2026-08-05'
delivery_contract:
  - architecture_adr
  - authoritative_code
  - tests_unit_integration_property_fault
  - versioned_artifacts
  - documentation
  - register_updates
  - literature_anchoring
  - negative_results_when_falsified
  - ui_explanation
  - external_review_for_verified_status

# Reusability-side definition of done (maintainer review 2026-08-05): a
# fasttrack slice is not finished as *reusable engineering* until all ten
# hold. Enforced by tests/test_fasttrack_register.py — an item flipped to
# DONE on or after dod_enforced_from must carry a `dod:` mapping with an
# evidence string per criterion; gate0 items closed before enforcement are
# marked dod_grandfathered instead.
definition_of_done:
  - single_module_single_responsibility
  - no_duplicate_abstraction_or_vocabulary
  - documented_public_api
  - unit_and_integration_tests
  - negative_and_failure_paths
  - architecture_or_adr_on_contract_change
  - openapi_schema_updates_when_relevant
  - runnable_external_example
  - stability_classification
  - clean_install_wheel_test
dod_enforced_from: '2026-08-05'

