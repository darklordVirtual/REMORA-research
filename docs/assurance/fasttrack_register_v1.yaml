- id: FT-01
  title: Unified proposal-to-effect lifecycle
  priority: p0
  consolidates: ['#36', '#37', '#45(core)']
  status: IN_PROGRESS
  notes: >-
    Design approved by the maintainer (PR 135). SHIPPED: proposal_id minted
    once at assess and carried through assess/approve/execute records,
    responses and tokens (slices 1-2); schemas/execution_lifecycle_v1.yaml
    as the declared machine; remora/governance/lifecycle.py loading it as a
    RUNTIME authority (LifecycleModel + LifecycleTracker, Hypothesis
    searched-validation over the declared event domain, PR 183); and
    /v1/execution validating its own transitions against that model, where
    an undeclared move is a loud 500 rather than silent drift (PR 184).
    All ten DoD criteria are met as of 2026-08-05: documented public API
    (docs/execution-lifecycle.md, DOC-302), runnable external example
    (examples/execution_lifecycle_demo.py, smoke-tested), stability
    classification (ARCHITECTURE.md §9 — CORE maturity, and explicitly no
    external backward-compatibility guarantee, since only remora.sdk
    carries one), and clean-install wheel coverage (the CI wheel job
    exercises the lifecycle model and outbox from the installed
    distribution). Status stays IN_PROGRESS: the SCOPE below is not
    finished, and DoD completion is not the same as scope completion. Also still open in scope: the governed
    REST dispatch path for direct-ACCEPT proposals (#36) and
    DecisionEnvelope EffectBlock population (#37), which is why the SDK
    documents an ACCEPT-lifecycle boundary rather than claiming coverage.
- id: FT-02
  title: Crash-consistent execution with transactional outbox
  priority: p0
  consolidates: ['#82', 'REM-024', 'REM-025']
  status: IN_PROGRESS
  notes: >-
    Same design document as FT-01; fault-injection matrix specified.
    SHIPPED: remora/enforcement/outbox.py with the DISPATCH_PENDING ->
    DISPATCHING -> {SUCCEEDED,FAILED,REFUSED,UNKNOWN} machine, all terminals
    absorbing and none auto-retrying (PR 185); transactional enlistment so
    the intent row commits and rolls back WITH the authorization (PR 186);
    SQLite and Postgres adapters under one contract, the latter verified
    against a real service (PR 187) and covered by the no-skip CI job
    (PR 188); the live /v1/execution/execute path recording, claiming and
    settling intents (PR 189); and reconciliation of stale DISPATCHING rows
    to UNKNOWN, audit-chain recorded (PR 190).
    All ten DoD criteria are met as of 2026-08-05: documented public API
    (docs/execution-lifecycle.md, DOC-302), runnable external example,
    stability classification (ARCHITECTURE.md §9, same no-guarantee caveat
    as FT-01), and clean-install wheel coverage. Status stays IN_PROGRESS
    because the SCOPE below is not finished. The design
    doc's crash matrix is now EXECUTED as tests
    (tests/test_execution_fault_injection.py), which found and fixed three
    defects: no rollback in the in-process transaction branch, unclaimed
    intents never reconciled, and that reconciliation missing from both
    durable adapters. Honest scope limits: reconciliation is a lazy sweep on the
    execution path plus a callable operation, NOT a running daemon (an idle
    tenant needs a scheduled call); the crash matrix is executed as tests but
    not as an artifact-producing round with committed fault-injection
    evidence; and
    REM-025's in-process NonceLedger is untouched by this work.
- id: FT-03
  title: One immutable signed ToolSpec
  priority: p0
  consolidates: ['#83', 'RF-01']
  status: IN_PROGRESS
  notes: >-
    Hash-binding slices landed earlier (policy source set + registry
    identity in policy_bundle_hash). ADR ACCEPTED 2026-08-05 (handoff-gate
    PR 1): all eight open questions decided, recorded as a frozen
    machine-readable contract in schemas/tool_spec_v1.yaml and pinned by
    tests/test_toolspec_schema_v1.py (16 tests) so ADR and runtime cannot
    drift. Decisions: HMAC-SHA256 with a deployment-held key (agent never
    signs), identity-allowlist rotation/revocation, pinned-bundle-digest
    staleness, fail-closed with NO legacy fallback in strict mode, source-
    span callable digest with its blindness recorded, singular effect,
    flat tool ids, hard schema refusal in strict mode, strict-not-TOFU
    default, nullable-but-present postcondition_reader, and
    remora/toolcall/toolspec.py as the home so no new import direction is
    created. Fourteen stable reason codes published as a public contract.
    Handoff PR 2 (2026-08-05): remora/toolcall/toolspec.py implements the
    contract — signed bundle load with revocation checked before trust,
    computed description digest, pinned-digest staleness, callable-digest,
    credential-scope, target-allowlist, argument-schema and
    assess-vs-dispatch checks, every refusal carrying a published reason
    code (19 tests covering description rug-pull, schema drift, callable
    replacement, scope drift, stale-but-signed, revoked identity, strict
    mode without a bundle, and duplicate ids). Enforcement receives specs
    as DATA, so no new import direction from remora.enforcement.
    Binding chain landed 2026-08-05: ExecutionLease carries and SIGNS
    toolspec_hash + toolspec_version, and verify() refuses a mismatch of
    either. An ABSENT binding is not a wildcard — a lease issued before
    spec binding must not verify against a spec-bearing check, so
    upgrading the check cannot silently amnesty old leases (8 tests).
    Execution wiring landed 2026-08-05: with REMORA_TOOLSPEC_BUNDLE
    configured, /v1/execution/assess resolves the signed spec, enforces
    target and argument schema (409 with the published reason code as the
    detail prefix), records toolspec_hash in the audit chain and returns a
    toolspec identity block; /execute re-resolves, compares against the
    hash the ASSESSMENT recorded (read from the chain, never from the
    request) and refuses toolspec_changed_between_assess_and_dispatch
    before authorizing; the resolved hash and version bind into the
    ExecutionLease. Without a bundle the legacy path runs unchanged and
    the response reports enforced=false — recorded degradation, never
    silent equivalence (8 wiring tests).
    NOT DONE: the SDK surface for ToolSpec identity and typed errors
    (handoff PR 5).
- id: FT-04
  title: Closed-loop postcondition verification (one deep integration)
  priority: p0
  consolidates: ['SHELF-021', 'CAP-014', 'EffectBlock']
  status: IN_PROGRESS
  notes: >-
    Integration target CHOSEN by the maintainer 2026-08-05 (handoff gate
    §2.1): GitHub issue creation — observable, readable back through the
    API, demonstrable without irreversible consequences.
    Handoff PR 3 landed: schemas/postcondition_contract_v1.yaml frozen (15
    pinning tests) and remora/governance/effect_verification.py implements
    it (12 tests). The load-bearing rule from the architect review is
    encoded and tested: compare the DECLARED DELTA against your own
    version, NEVER global unchangedness — otherwise concurrent legitimate
    writes dominate EFFECT_MISMATCH and operators learn to ignore it.
    Five statuses kept distinct (verified / mismatch / unobservable /
    verifier-failed / unsupported); unobservable and verifier-failed are
    NOT terminal, because failing to read a result is not a verdict.
    Both expected and observed are hashed so a reader can re-derive the
    comparison instead of trusting the verdict. execution_lifecycle_v1.yaml
    gains EFFECT_PENDING/VERIFIED/MISMATCH/UNKNOWN with transitions.
    Handoff PR 4 landed: remora/integrations/github_issue.py closes the
    first loop (16 tests) against a deployment-supplied reader PROTOCOL —
    governance never holds the credentials and no test contacts GitHub, so
    the suite is not hostage to a third party's availability. Every §2.7
    failure is exercised: absent issue, read timeout, lost authorization,
    malformed response, unforeseen reader exception, and a missing issue
    number all resolve to UNOBSERVABLE or VERIFIER_FAILED — never to
    MISMATCH. Verification appends to the tenant audit chain
    (record_effect_verification), drives the proposal's lifecycle state,
    and ships in the evidence bundle's hashed manifest (10 wiring tests).
    Two overclaims removed on the way: the lifecycle transition
    SUCCEEDED -> EFFECT_VERIFIED on postcondition_not_declared (recorded
    "we never looked" as "we checked"), and a test asserting the expected
    and observed hashes are equal, which cannot hold under a hash rule.
    Handoff PR 5 landed the product surface: remora/sdk/effects.py owns
    the vocabulary a consumer sees (PostconditionSpec, EffectStatus,
    EffectVerificationView, build_postcondition, verify_effect,
    content_digest) plus ToolSpecIdentity on assessment and execution
    results and the verdict on ProposalView. The SDK defines its own
    status enum rather than re-exporting the internal one, and a test
    compares it against the frozen schema on disk so the two cannot
    drift. Verification runs in the CONSUMER's process because the reader
    holds the credentials; POST /v1/execution/proposals/{id}/effect takes
    the record back and the chain stores it as an attestation by a named
    verifier, never as an independent proof by REMORA. Only hashes cross
    the boundary. 23 tests (14 surface + 9 endpoint), a runnable offline
    example, docs/sdk.md, and regenerated OpenAPI, TS client and public
    API snapshot (35 symbols).
    Handoff PR 6 + gate section 3 (2026-08-05): the release manifest now
    pins both frozen contracts alongside the wheel, OpenAPI export, SDK
    snapshot and lifecycle schema, asserted by EQUALITY so a future
    contract cannot be added to the repository and left out of the
    release. Prerelease core-candidate-2026.08.05.3 published from a
    clean checkout of 9866436 and consumed by
    darklordVirtual/assured-agent-execution (pin verified, 43
    compatibility tests green against the wheel installed from the
    verified assets). The end-to-end vertical test drives the real ASGI
    app across every layer and FOUND ONE DEFECT: the spec-changed refusal
    ran after the authorizing transaction, leaving a dispatch intent
    behind for a call never allowed to happen; the check now precedes the
    transaction. Two runnable offline examples ship and are smoke-tested;
    the signing example exits non-zero if any of its four tamper shapes
    loads.
    NOT DONE: EffectBlock population in DecisionEnvelope; compensation
    governance; ABSTAIN lineage (superseded_proposal_id); ESCALATED
    resolution semantics. No external review has run against this build.
