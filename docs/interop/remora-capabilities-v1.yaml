capability_audit:
  investigated:
    - id: deterministic_policy_gate
      disposition: DECLARED
      evidence: [CAP-001, remora/policy/decision_engine.py, tests/test_rem017_policy_mutations.py]
      reason: Wired to the execution API; declared without a general safety or intent-legitimacy claim.
    - id: exact_call_binding
      disposition: DECLARED
      evidence: [CAP-004, CAP-013, artifacts/interop/exact-call-binding-v1]
      reason: API-path binding and a frozen fixture contract support a bounded claim.
    - id: fresh_authority_at_dispatch
      disposition: DECLARED
      evidence: [CAP-003, CAP-004, CAP-007, artifacts/interop/fresh-authority-v1]
      reason: Re-gating and dispatch-time lease checks are wired; external runs remain absent.
    - id: single_use_execution_authorization
      disposition: DECLARED
      evidence: [CAP-003, CAP-013, tests/test_token_hardening.py, tests/test_lease_nonce_durability.py]
      reason: One-time consumption is implemented and tested; durable state is conditional.
    - id: human_review_freshness
      disposition: DECLARED
      evidence: [CAP-007, remora/governance/review_queue.py, tests/test_review_queue.py]
      reason: The execution API review path re-gates; persistence limits are stated.
    - id: governed_tool_dispatch
      disposition: DECLARED
      evidence: [CAP-013, servers/execution_api.py, tests/test_toolspec_execution_wiring.py]
      reason: Registered calls use the lease-bound dispatcher; alternate paths remain outside the claim.
    - id: effect_state_distinction
      disposition: DECLARED
      evidence: [CAP-013, remora/governance/effect_verification.py, artifacts/interop/effect-evidence-v1]
      reason: The bounded state contract distinguishes observed delta from execution report.
    - id: unknown_execution_and_reconciliation
      disposition: DECLARED
      evidence: [CAP-013, remora/enforcement/outbox.py, scripts/run_outbox_reconciler.py]
      reason: UNKNOWN is explicit and reconciliation tooling exists; authoritative observations remain deployment-owned.
    - id: tenant_audit_chain
      disposition: DECLARED
      evidence: [CAP-005, remora/governance/tenant_chain.py, tests/test_audit_chain_integrity.py]
      reason: Persistence is conditional and hash chaining is not external append-only anchoring.
    - id: delegation_attenuation
      disposition: NOT_DECLARED
      evidence: [CAP-006, remora/governance/a2a_envelope.py, tests/test_a2a_envelope.py]
      reason: The register classifies this as a reference-path HMAC implementation; production key and trust-anchor requirements are unmet.
    - id: authority_executor_custody_separation
      disposition: DECLARED
      evidence: [CAP-013, docs/deployment/execution-quickstart.md, tests/test_lease_authority_custody.py]
      reason: Strict profiles and tests support a conditional configuration claim; no deployment is claimed to run it.
    - id: semantic_authority_check
      disposition: NOT_DECLARED
      evidence: [CAP-001, CLAIM-019, NEGATIVE_RESULTS.md]
      reason: A benchmark result is not evidence of general semantic correctness or live runtime authority.
    - id: idempotency_evidence_atomicity
      disposition: NOT_DECLARED
      evidence: [CAP-005, remora/governance/effect_receipt.py]
      reason: The assess idempotency cache remains in-process and does not establish a general atomic effect and evidence transaction.
    - id: enforcement_completeness
