  - id: RES-001
    title: "Causal post-hoc explainability and concept interventions"
    source:
      citation: "Bjøru, A. R. (2026). Causal Post-hoc Explainable AI (PhD thesis), NTNU."
      sections:
        - "Paper IV §3 (concept-based externally-causal XAI)"
        - "Paper IV §4.2.1 (global explanation by dataset averaging)"
        - "Paper IV §4.2.2-§4.2.3 (Probability of Sufficiency / Necessity)"
        - "Paper IV §4.2.4 (minimal contrastive explanation search)"
      builds_on:
        - "Pearl, J. (2009). Causality (2nd ed.), ch. 9 (PS/PN definitions)."
        - "Galhotra, Pradhan & Salimi (2021), SIGMOD (contrastive explanations)."
    concepts:
      - concept_based_external_causal_xai
      - probability_of_sufficiency
      - probability_of_necessity
      - minimal_contrastive_intervention
      - global_concept_attribution
    controls:
      - causal_policy_explanation
    code:
      - remora/causal/schema.py
      - remora/causal/search.py
      - remora/causal/attribution.py
      - remora/causal/explanation.py
    tests:
      - tests/test_causal.py
      - tests/test_causal_search_attribution.py
    evidence: "PS/PN in {0,1}, minimality, verdict-change, and global mean-PS ordering are unit-tested; result carried on DecisionEnvelope.causal_explanation."
    maturity: implemented_and_tested
    scope_boundary: "Deterministic policy-level PS/PN operationalisation: binary per-instance indicators evaluated against the policy model, not population-level probabilities and not the world. No real-world causal-effect or safety claim."
    related_work_section: "docs/09-related-work.md §9"
    in_code_citation: true
    citation_anchor: "Bjøru"
    compendium_refs: []
    compendium_note: "No anchor in the local compendium: its interpretability chapter covers mechanistic interpretability (superposition, monosemanticity, circuit tracing), not causal post-hoc concept XAI. This line's sources (Bjøru 2026; Pearl; Galhotra et al.) sit outside the compendium's scope."

  - id: RES-002
    title: "Selective prediction and abstention"
    source:
      citation: "Idea family (no single named source in-repo): selective classification / reject option, risk-coverage curves, calibrated abstention."
      sections: []
    concepts:
      - selective_classification
      - reject_option
      - risk_coverage_curve
      - calibrated_abstention
    controls:
      - phase_aware_guardrail
      - selective_routing
    code:
      - remora/selective/guardrail.py
      - remora/selective/conformal.py
      - remora/selective/risk_coverage.py
    tests:
      - tests/test_guardrail.py
      - tests/test_selective_trust_curve.py
      - tests/test_selective_n500.py
    evidence: >-
      Guardrail and risk-coverage behaviour is unit-tested directly
      (tests/test_guardrail.py). The empirical arm is the N=500 selective
      acceptance run, whose committed artifact now backs a NEGATIVE result:
      on the critical-phase subset trust anti-correlates with correctness
      (CLAIM-005), which is what PhaseAwareGuardrail routes around.
      tests/test_selective_trust_curve.py is retained as an artifact lock on
      a SUPERSEDED result, not as evidence for this line: it pins the N=302
      neg_temperature 94.7%-at-25% figure (CLAIM-008, superseded by
      CLAIM-013), and the temperature signal it rests on failed its
      pre-registered fresh-data confirmation (CLAIM-012, "do not cite").
      The lock exists so that number cannot drift silently; it must not be
      quoted as a selective-acceptance result.
    maturity: implemented_and_tested
    scope_boundary: "Benchmark-scoped selective trust; no universal out-of-distribution safety guarantee."
    related_work_section: "docs/09-related-work.md §1"
    in_code_citation: false
    compendium_refs:
      - selective-2017
      - gentle-conformal-2021
      - ltt-2021

  - id: RES-003
    title: "CRC-inspired weighted empirical selective routing"
    source:
      citation: "Angelopoulos, A. N., Bates, S., Fisch, A., Lei, L., & Schuster, T. (2022). Conformal risk control. arXiv:2208.02814."
      sections:
        - "Framework the router is inspired by, not implementing: the crc.py module docstring documents the two structural gaps (no finite-sample term in the selector; non-monotone selective loss), so Theorem 1 does not attach."
    concepts:
      - weighted_empirical_threshold_selection
      - repeated_split_robustness
    controls:
      - conformal_thresholding
    code:
      - remora/selective/crc.py
      - remora/selective/binomial_bounds.py
    tests:
      - tests/test_crc.py
      - tests/test_conformal_repeated_splits.py
      - tests/test_binomial_bounds.py
    evidence: "Repeated-split holdout results in committed artifacts; all quality evidence for this component is empirical, and negative results are preserved in the claim ledger."
    maturity: empirically_evaluated_adaptation
    scope_boundary: "CRC-inspired, NOT a CRC procedure (external review R3-01): deterministic importance-weighted empirical threshold selector with hand-tuned phase weights, no finite-sample correction and a non-monotone selective loss - no distribution-free guarantee is claimed."
    related_work_section: "docs/09-related-work.md §2"
    in_code_citation: true
    citation_anchor: "Angelopoulos"
    compendium_refs:
