      sections:
        - "cited at remora/cascade/stages.py (self-consistency; single-stage aggregation inspired by MoA, not the multi-layer architecture)"
    concepts:
      - self_consistency_sampling
      - cross_model_dissensus
      - multi_agent_debate
    controls:
      - multi_oracle_consensus
    code:
      - remora/cascade/stages.py
