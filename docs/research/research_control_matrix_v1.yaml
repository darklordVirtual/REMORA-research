      - tests/test_oracle_diversity.py
      - tests/test_toolcall_experiment_outputs.py
      - tests/test_toolcall_benchmark_v2_results.py
      - tests/test_rem010_llm_baselines.py
    evidence: >-
      Synthesizer thresholds and oracle-diversity behaviour are unit-tested.
      The aggregation baselines the line is compared against (single model,
      majority vote, self-consistency, verifier, REMORA gate) are pinned by
      the tool-call benchmark tests, which re-run the experiment and assert
      the full baseline set is present: tests/test_toolcall_experiment_outputs.py
      (v1), tests/test_toolcall_benchmark_v2_results.py (adversarial v2) and
      tests/test_rem010_llm_baselines.py (LLM-backed baselines, REM-010).
      Consensus is combined with evidence, policy, risk and audit, never used
      alone.
    maturity: implemented_and_tested
    scope_boundary: "Consensus is not treated as truth; it is one input among evidence, policy, risk, and audit. Single-stage aggregation only: the multi-layer MoA architecture is not implemented."
    related_work_section: "docs/09-related-work.md §3"
    in_code_citation: true
    citation_anchor: "Wang et al."
    compendium_refs:
