  - id: RES-007
    title: "Statistical-physics control signals (entropy, phase, Lyapunov)"
    source:
      citation: "Generic statistical-physics constructs (q-state Potts model, Gibbs/Boltzmann distribution, Lyapunov objective) used as operational analogy."
      sections: []
    concepts:
      - entropy_order_parameter
      - phase_regime_classification
      - lyapunov_stability
    controls:
      - phase_classification
      - thermodynamic_braking
    code:
      - remora/research_attic/statphys/potts.py
      - remora/thermodynamics.py
      - remora/policy/thermodynamic_braking.py
    tests:
      - tests/test_statphys.py
      - tests/test_thermodynamics.py
      - tests/test_thermodynamic_braking.py
    evidence: >-
      Regime classification (ordered/critical/disordered) and selective-trust
      routing exist as tested library code. NOT evidence of runtime effect:
      verified 2026-08-07 that no governed path populates these signals -
      servers/api.py never references the consensus state,
      servers/execution_api.py passes trust_score=None and phase=None, and
      build_full_observation leaves the fields at their None defaults, so the
      critical_phase_critical_risk rule cannot fire in production.
    maturity: library_only
    scope_boundary: >-
      Library-grade only, and the framing is withdrawn from the paper
      (2026-08-07). The physics vocabulary (structural temperature, free
      energy, Lyapunov observable) invited a physical reading the system does
      not support, and the temperature signal it rested on FAILED its
      pre-registered fresh-data confirmation (CLAIM-012, NEGATIVE_RESULTS
      §18): temperature ranked worse than calibrated confidence. The paper now
      presents only the information-theoretic observables (H, D, trust score);
      the withdrawn material lives in the negative results. These signals are
      not populated on any governed path and influence no runtime decision.
    related_work_section: "docs/09-related-work.md §6"
    in_code_citation: false
    compendium_refs: []
    compendium_note: "No anchor in the local compendium: the statistical-physics control signals (q-state Potts, Gibbs/Boltzmann, Lyapunov) are used as an operational analogy specific to REMORA and are not a catalogued research area in the assurance landscape."

