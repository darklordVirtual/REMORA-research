      unsafe-execution reduction. The benchmark result itself is CLAIM-001:
      700 tasks are 70 template clusters x 10 cosmetic variants, and because
      a deterministic gate decides identically within a template, all CIs and
      p-values are computed by cluster-level resampling over those 70
      clusters (results/toolcall_benchmark_v2_significance.json). The 70 is
      n_template_clusters in that artifact; the per-baseline effective_n
      field in results/toolcall_benchmark_v2_results.json is a different,
      smaller quantity and is not this number. v1 is documented as showing a
      ceiling effect.
    maturity: implemented_and_tested
