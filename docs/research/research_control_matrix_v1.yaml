  - id: RES-018
    title: "Procedure obligations and derived completion"
    source:
      citation: "Singh, P., Kumar, S., Agarwal, A. et al. (2026). ContractEval: Query-Conditioned Execution Matching for Procedural Instruction Conformance. arXiv:2609.09458."
      sections:
        - "procedural obligations matched against execution traces"
      builds_on:
        - "Xiao, Y. & Nuzzo, P. (2026). Symbolic Temporal Supervision of LLM Agents Using Contracts. arXiv:2609.18128 (temporal contracts over tool-call traces)."
        - "Smyth, N., Mantilla-Ramos, Y.-J., Tikeng Notsawo, P. Jr et al. (2026). Quantifying Overclaiming Propensity in Frontier LLM Agents. arXiv:2609.20812 (completion claims agents did not reach)."
    concepts:
      - trace_level_obligation
      - online_and_replay_equivalence
      - completion_is_derived
    controls:
      - finite_state_obligation_monitor
      - pre_dispatch_procedure_refusal
      - overclaim_flag
    code:
      - remora/governance/procedure.py
      - remora/enforcement/lease.py
    tests:
      - tests/test_procedure_contracts.py
    evidence: >-
      Four obligation shapes (precedence, absence, response, existence) are
      finite automata. An exhaustive test over all 1296 traces of length four
      from six tools pins that stepping live and replaying agree on every
      prefix, and that the online admits() check predicts exactly the safety
      violations step() records. derive_completion returns NOT_ESTABLISHED for
      a pending response or an empty trace, VIOLATED for any violation, and
      flags a completion claim the trace does not establish as an overclaim.
      The dispatcher refuses a violating step before it runs and refuses when
      the history cannot be read.
    maturity: implemented_and_tested
    scope_boundary: >-
      Steps are matched on tool name and exact argument fields; ContractEval's
      query-conditioned matching of natural-language procedures, general
      temporal logic and assume-guarantee composition are not implemented.
      The trace comes from the deployment's own record. No model's
      overclaiming propensity is measured.
    related_work_section: "docs/09-related-work.md §12"
    in_code_citation: true
    citation_anchor: "2609.09458"
    compendium_refs: []
    compendium_note: "September 2026 sources, postdate the compendium; all three identifiers checked against the arXiv record on 2026-09-28."

