  - id: RES-014
    title: "Evidence completeness against claim contracts"
    source:
      citation: "REMORA internal research question (2026-09-28): quality program WS7 item Q7.3, built on RES-013's recheckable effect evidence; not an adopted external publication."
      sections:
        - "docs/design/remora-quality-program-v1.md WS7 Q7.3"
    concepts:
      - authentic_is_not_complete
      - claim_scoped_evidence_contract
    controls:
      - evidence_coverage_verdict
      - chain_derived_authenticity
    code:
      - remora/governance/evidence_coverage.py
      - servers/execution_api.py
    tests:
      - tests/test_evidence_coverage.py
    evidence: >-
      An evidence contract names the kinds a claim needs; assess_coverage
      returns TAMPERED, INCONCLUSIVE, AUTHENTIC_BUT_INCOMPLETE or COMPLETE, in
      that precedence, and lists missing kinds on every verdict. Authenticity
      of a proposal's chain entries is derived from the tenant chain's own
      verification. The evidence export reports two contracts: an executed
      proposal with no effect observation is AUTHENTIC_BUT_INCOMPLETE for
      executed_effect_v1, a verified observation completes it, an
      EFFECT_UNSUPPORTED record does not, and a rewritten chain entry reads
      TAMPERED (tests/test_evidence_coverage.py).
    maturity: implemented_and_tested
    scope_boundary: >-
      Two contracts are defined, over the tenant chain's event kinds only.
      Coverage says whether the named kinds are present and intact; it does
      not judge whether an effect observation was itself correct, which is
      RES-013's recheck. A contract is only as complete as the kinds its
      author listed.
    related_work_section: "docs/09-related-work.md §12"
    in_code_citation: false
