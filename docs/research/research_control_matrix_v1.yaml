      sections:
        - "Framework the router is inspired by, not implementing: the crc.py module docstring documents the two structural gaps (no finite-sample term in the selector; non-monotone selective loss), so Theorem 1 does not attach."
    concepts:
      - weighted_empirical_threshold_selection
      - repeated_split_robustness
    controls:
      - conformal_thresholding
    code:
      - remora/selective/crc.py
      - remora/selective/binomial_bounds.py
    tests:
      - tests/test_crc.py
      - tests/test_conformal_repeated_splits.py
      - tests/test_binomial_bounds.py
    evidence: "Repeated-split holdout results in committed artifacts; all quality evidence for this component is empirical, and negative results are preserved in the claim ledger."
    maturity: empirically_evaluated_adaptation
    scope_boundary: "CRC-inspired, NOT a CRC procedure (external review R3-01): deterministic importance-weighted empirical threshold selector with hand-tuned phase weights, no finite-sample correction and a non-monotone selective loss - no distribution-free guarantee is claimed."
    related_work_section: "docs/09-related-work.md §2"
