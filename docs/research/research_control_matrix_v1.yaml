      Reproduce with python experiments/capability_minimization_study.py
      --check. A capability set is the intersection of trusted operands with
      default deny (property-tested), projected into the agent's tool list and
      enforced at /assess, before consumption and in the dispatcher through a
      digest signed into the lease. Argument and trusted-state constraints,
      subset delegation and revocation epochs refuse with their own codes, and
      success_established_v1 requires capability, authorization, execution and
      a verified effect. The pre-registered layer study (44 proposals, eight
      classes, arms A to F on REMORA's code) met seven of eight predictions:
      unsafe execution fell from 1.0 to 0.0 as layers were added, each class
