  - id: RES-010
    title: "Anytime-valid confidence sequences (optional-stopping-safe monitoring)"
    source:
      citation: "Howard, S. R., Ramdas, A., McAuliffe, J. & Sekhon, J. (2021). Time-uniform, nonparametric, nonasymptotic confidence sequences."
      sections:
        - "Conjugate-mixture (Beta-binomial) supermartingale; Ville's inequality (cited in remora/selective/confidence_sequence.py)"
      builds_on:
        - "Ramdas, Grünwald, Vovk & Shafer (2023). Game-theoretic statistics and safe anytime-valid inference. Statistical Science 38(4)."
        - "Waudby-Smith & Ramdas (2024). Estimating means of bounded random variables."
    concepts:
      - time_uniform_confidence_sequence
      - anytime_valid_inference
      - optional_stopping_safety
    controls:
      - continuous_far_monitoring
    code:
      - remora/selective/confidence_sequence.py
    tests:
      - tests/test_confidence_sequence.py
    evidence: >-
      An OFFLINE anytime-valid bound computed over the closed REM-020
      longitudinal audit series, not a live monitor: k=0 events in n=168
      adapt cycles gives a time-uniform upper bound of 4.72% on the
      cycle-level false-accept rate (results/far_confidence_sequence_v1.json,
      CLAIM-011), produced by scripts/compute_far_confidence_sequence.py.
      Corrected 2026-09-03: this line and the module docstring previously said
      the sequence is "used by REM-020 to monitor the operational false-accept
      rate continuously". Nothing outside tests and that one script imports
      the module, and REM-020 is a closed audit rather than a running gate,
      so the continuous-monitoring wording claimed a deployment that does not
      exist. What the construction buys is that the bound stays valid although
      the series was inspected repeatedly while it accumulated.
    maturity: implemented_and_tested
    scope_boundary: "A time-uniform Bernoulli-rate bound, distinct from the CRC-inspired empirical selective routing of RES-003; conservative by construction and valid only under the stated Beta-binomial mixture assumptions."
    related_work_section: "docs/09-related-work.md §2"
    in_code_citation: true
    citation_anchor: "Howard"
    compendium_refs:
      - confidence-seq-2021
      - game-theoretic-stat-2023

