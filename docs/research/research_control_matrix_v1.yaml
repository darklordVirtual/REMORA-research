      (NEGATIVE_RESULTS.md §65). Scored by v1.3 (python
      scripts/mutation_evidence_sufficiency.py), which adds cases E21-E23 for
      mapping key order, a rejection contract of twenty inputs (ten in
      cases.json and ten the runner declares because JSON cannot express
      them; seventeen before R18-R20), verdict-envelope checks and eleven
      declared metamorphic relations, 20 survive, each named in the baseline
      and argued equivalent under the pinned contract in
      docs/assurance/mutation_testing_v1.md. The raw output of every sweep row
      is committed in artifacts/evidence-sufficiency-mutation-2026-09-30/.
      The test module scores one representative fault per real-gap family
      against both runners (v1.3 fails, v1.2 does not, an H1 control fails
      both) and checks the relations on generated inputs with Hypothesis at
      150 derandomised examples per property. model.json is a table-driven reference model interpreted over
      61,544 lattice and typed documents on which the checker must agree at
      every point (McKeeman, 1998); it does. A second operator set of 705
      first-order and 200 second-order mutants (scripts/mutation_evidence_sufficiency_ast.py)
      kills 901 of 905, with 4 named survivors argued equivalent; its
      per-mutant redundancy reading (--corpus first-run reconstructs it:
      898 of 905 killed) showed 42 typed-premise faults that only the model
      caught, which became the 23 lattice-derived K1 cases
      (NEGATIVE_RESULTS.md §66, corrected in §67). The record reproduces byte
      for byte with no failures and no crashes. An independent analysis of
      43 faults chosen without reading v1.3, hashed locally but not committed
      publicly, found v1.2 killing 42 on the runner row and v1.3 killing 43
      (docs/assurance/external_adequacy_evidence_sufficiency_v1.md).
      Specification mutation of model.json (python
      scripts/spec_mutation_evidence_sufficiency.py; 446 first-order and 300
      second-order mutants, equivalence computed over eight premise value
      classes) was pre-registered in section 13 of the v1.3 spec before any
      score was read. The runner kills all 392 live first-order mutants; the
      authored cases kill 380, so the pre-registered criterion S-2 is not met.
      The twelve survivors are cross-branch premise faults
      (NEGATIVE_RESULTS.md §68). Rule coverage (python
      scripts/rule_coverage_evidence_sufficiency.py) then defines adequacy
      from model.json alone, MC/DC-style per decisive outcome: 80
      obligations, of which v1.3 discharges 58. The derivation rule, its
      output digest and a held-out catalogue (19 guard-placement and 300
      third-order mutants) were pushed before v1.4 existed (section 14).
      conformance/evidence-sufficiency-v1.4 is v1.3 plus the 22 derived
      cases, and its runner fails on any open obligation. v1.4 discharges
      all 80 and kills every live mutant of both specification catalogues on
      the authored cases alone. The held-out test had little power: v1.3
      already killed 318 of its 319 mutants, and only five of the 22 derived
      cases, all for the §68 family, kill a mutant no other case kills
      (NEGATIVE_RESULTS.md §69). A committed harness for section 8 (python
      scripts/score_heldout_faults.py) reproduces the independent
      analysis's raw rows for all 43 of its faults on v1.2 and v1.3. A
      blind probe (artifacts/evidence-sufficiency-blind-probe-2026-09-30,
      pre-registered) scored 60 code faults and 36 reimplementation variants
      written by context-free agents that did not see the corpus: row 3 of
      v1.4 kills 80 of 83 decision faults and row 1 kills 76, the same as
      v1.3; six faults survive every row (NEGATIVE_RESULTS.md §70).
      Evidence-sufficiency v1.5 answers with class-level checks: rule
      coverage profile v2 (value classes including absence and null, guard
      precedence, state pairs; 274 derived cases), a wider lattice, and
      generated input-contract and return-isolation sections. A second probe
      of 97 faults, locked before v1.5 was committed, went from 74 to 77 of 77
      decision faults on row 3 (73 to 76 on row 1); one fault, verdict value
      equality, survives (NEGATIVE_RESULTS.md §71). v1.6 adds a differential
      test of the whole public API against an executable contract on 2,000
      seeded inputs. On a third probe of 104 faults, locked before v1.6, it
      kills all 61 decision faults and 97 of 104 in all (v1.5: 94); two of
      its three new kills are in classes no probe had named, and five faults
      on the API surface survive (NEGATIVE_RESULTS.md §72). v1.7 adds an API
      surface snapshot, seeded call sequences and the crossed input contract;
      on a fourth probe of 104 faults, locked before v1.7, every decision
      fault dies again and 93 of 104 in all (v1.6: 90); five open survivors
      concern input sizes and public-type behaviour (NEGATIVE_RESULTS.md §73,
      open).
    maturity: library_only
    scope_boundary: >-
      A conformance research artifact, not a governed runtime path: the checker
      decides nothing in a deployment, and the sweep measures the corpus, never
      the checker's correctness. Two operator sets, mutmut 3.8.0 with its
      default operators and nine authored operators; a fault neither
      generates is unmeasured. The specification operators were written by
      the corpus's author after v1.3 and are pre-registered, not blind; their
      state comparison is decided on the declared state values only. The families are a hand
      classification, not a subsumption graph. Every v1.3 check was written
      with the survivor list in view, so the sweep shows the repair and not
      generalisation; only the blind protocol of the v1.3 spec, section 8,
      could show that. The independent analysis selected its faults blind
      but did not commit them publicly before the run, so it does not meet
      that protocol. The reference model
      shares author and specification with the checker, so agreement cannot
      catch a misreading both share, and its lattice is bounded to the
      declared values. The frozen checker's coercion of a scope through
      dict() is recorded as a limit, not repaired.
    related_work_section: "docs/09-related-work.md §14"
    in_code_citation: true
    citation_anchor: "DeMillo"
    compendium_refs: []
    compendium_note: "Software-testing sources outside the compendium's AI-assurance scope; entered from the primary publications named above."

# ── Landscape coverage ──────────────────────────────────────────────────────
# Whole areas of the local AI-assurance compendium that REMORA deliberately does
# NOT implement as controls. Recording them here makes the scope boundary
# explicit and auditable: "not mapped" is a documented decision, not an oversight.
# These are honest boundaries, not roadmap promises.
landscape:
  source: "docs/researchpapers/kompendium_ai_assurance_3utgave.md"
  source_status: "local-only working document (gitignored, not published; ~201 works, 2. edition figure). compendium_refs are validated against this file when present locally and skipped in CI where it is absent."
  not_implemented:
    - theme: "Formal methods, neural-network verification, guaranteed-safe AI"
      compendium_chapter: "Ch. 8 (formal methods, verification, guaranteed safety)"
      representative_refs: [reluplex-2017, shielding-2018, guaranteed-safe-2024]
      reason: "REMORA verifies its policy layer by tests and deterministic invariants, not by formal proof. Neural-network verification and proof-carrying guarantees are out of scope; the safety floor is a policy property, not a proved model property."
    - theme: "Provenance, workload identity, software supply chain"
      compendium_chapter: "Ch. 7 (provenance, identity, supply chain)"
      representative_refs: [slsa-v1, in-toto-2019, spiffe-spec, c2pa-spec]
      reason: "REMORA provides a tamper-evident DecisionEnvelope hash chain, not SBOM/ML-BOM, artifact signing, or SPIFFE-style workload identity. Supply-chain and identity attestation are assumed to be provided by the host environment."
    - theme: "Fairness, differential privacy, training-data protection"
      compendium_chapter: "Ch. 9 (fairness, privacy, data protection)"
      representative_refs: [dp-sgd-2016, membership-inference-2017, gdpr-2016]
      reason: "REMORA governs execution permission at inference time, not model training. Differential privacy, membership-inference defence, and fairness-metric selection are out of scope; the governed agent's model is treated as given."
    - theme: "MLOps, distributed-systems foundations, production drift"
      compendium_chapter: "Ch. 6 (MLOps, system design, production operations)"
      representative_refs: [sculley-debt-2015, mlops-2022, sre-2016]
      reason: "REMORA is a pre-execution governance overlay, not an MLOps platform. Data pipelines, SRE error budgets, and deployment infrastructure are the host's responsibility; REMORA consumes them rather than providing them."
    - theme: "Mechanistic interpretability (model-internal feature analysis)"
      compendium_chapter: "Ch. 2 (interpretability subset)"
      representative_refs: [monosemanticity-2023, scaling-monosem-2024, biology-of-llm-2025]
      reason: "REMORA's causal explanation (RES-001) is post-hoc over the policy model, not model-internal feature/circuit analysis. Mechanistic interpretability of the governed model is out of scope."

# ── Bibliography reconciliation ─────────────────────────────────────────────
# The `entries:` block above maps the research lines REMORA IMPLEMENTS, and its
# rule is deliberately strict: a line requires real code and tests on disk. The
# paper cites far more works than there are lines, which left an unanswered
# question raised in review 2026-08-07: if a source is not an implemented line,
# what role does it actually play? (The counts the rendered view shows are
# computed by the generator; they were hard-coded here until 2026-09-03 and had
# drifted from the file they describe.)
#
# This block answers it for EVERY reference in paper/remora_paper.md, so "not in
# the matrix" becomes a stated role rather than an unexplained absence. It is
# NOT a second implementation claim: only `implemented_line` asserts
# implementation, and it does so by pointing at an entry above.
#
# Roles:
#   implemented_line       covered by a RES-xxx entry; `entry` names it
#   grounds_implementation cited in a code docstring as the basis for a module,
#                          but has no dedicated research line. `code` names the
#                          file and CI verifies the surname appears in it - the
#                          same drift-proofing as citation_anchor above
#   evaluation_source      a dataset/benchmark REMORA evaluates ON, not a method
#                          REMORA implements; `code` names where it is used
#   positioning_only       related-work comparison or framing in the paper. No
#                          code, no evaluation. The majority of paper 2.11
#   standard_or_regulation a standard, regulation or third-party tool REMORA
#                          aligns with or integrates, not a research result
#
# implemented_line now also names `code` and is anchor-checked exactly like
# grounds_implementation and evaluation_source (added 2026-09-03). Until then it
# was the one code-claiming role the anchor check could not reach, so a work
# could be declared implemented while nothing tied it to a file.
#
# Three further blocks keep the reconciliation honest in the other direction:
#   code_only            sources in the codebase with no paper reference
#   related_work_only    works discussed only in docs/09-related-work.md, with
#                        no code and no paper reference. Before 2026-09-03 these
#                        were invisible to every check, so the "bidirectional"
#                        claim above was paper-to-matrix only
#   code_identifiers     every arXiv/RFC identifier that appears in
#                        remora/**/*.py, with the files carrying it. The
#                        generator scans the package and fails on any
#                        identifier not listed here, so a citation cannot enter
#                        the code without entering the register
#
# Verified by scripts/generate_research_control_matrix.py --check and
# tests/test_research_control_matrix.py: every paper reference must appear here
# exactly once, every `entry` must exist, and every `code` path must exist and
# contain the surname.
