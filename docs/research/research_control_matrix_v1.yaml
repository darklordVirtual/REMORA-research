# REMORA Research Control Matrix v1
# Single machine-readable source of truth for the chain:
#   research source -> idea -> REMORA control -> code -> test -> evidence
#   -> maturity -> scope boundary
#
# Every `code` and `tests` path is verified to exist by
# scripts/generate_research_control_matrix.py --check and
# tests/test_research_control_matrix.py. The rendered view is
# docs/research/research_control_matrix.generated.md (regenerated, never
# hand-edited). This makes the research grounding drift-proof: a moved or
# deleted module fails CI, and the literature positioning stays in one place
# (docs/09-related-work.md is the narrative companion, this file is the map).
#
# maturity vocabulary:
#   implemented_and_tested - a REMORA module implements the idea, with tests
#   reference_design       - documented/exemplified only (no dedicated module)
#
# Citation binding (keeps the mapping exact, not merely plausible):
#   in_code_citation: true  -> the source is cited inside the code itself, and
#     `citation_anchor` (an author surname / arXiv id) MUST appear verbatim in
#     at least one of the entry's `code` files. CI fails if it does not, so a
#     citation cannot drift away from the code that implements it.
#   in_code_citation: false -> an idea-family or generic-construct line with no
#     single named source cited in code; the attribution lives in the narrative
#     companion docs/09-related-work.md, not in a code docstring.
#
# Scope: this matrix maps the research lines REMORA actually implements, with
# code + tests on disk. It is deliberately NOT a map of the entire literature
# landscape (that broader catalogue is a separate local working document);
# adding a line here requires real, verified code and tests.
#
# Landscape crosswalk (added 2026-07-21): the broader catalogue is the local-only
# AI-assurance compendium docs/researchpapers/kompendium_ai_assurance_3utgave.md
# (gitignored, ~201 works). Two optional fields make the relationship to that
# landscape explicit WITHOUT turning it into an implementation claim:
#   compendium_refs: [ids]  -> the compendium work-ids this line draws on. These
#     are reference pointers, not code citations: validated locally when the
#     compendium file is present (a listed id must appear in it) and SKIPPED in
#     CI where the gitignored file is absent. Presence here never implies the
#     work is implemented — only that it informs the line.
#   compendium_note: "..."  -> used when a line has no anchor in the local
#     landscape, to state honestly WHY (e.g. its sources sit outside the
#     compendium's scope) instead of leaving the gap unexplained.
# The top-level `landscape:` block below records which whole areas of the
# compendium REMORA deliberately does NOT implement, and why — so the boundary
# is documented, not invisible.

schema_version: "1"
updated: "2026-08-07"

maturity_levels:
  - implemented_and_tested
  - empirically_evaluated_adaptation
  - conceptual_translation_implemented
  - reference_design

