      - tests/test_a2a_declared_operation.py
    evidence: "An approval bound to one task yields a different AuthorizationContext hash under another, while every binding REMORA already checked stays identical. The committed preimage artifact records that a context carrying no task identity hashes byte-identically to the pre-change implementation, so tokens issued since RMR-001 still verify; scripts/generate_authorization_context_vectors.py --check reproduces it exactly. The ExecutionLease and the A2A envelope carry the same pair, signed only when set: an unbound lease or envelope signs its pre-change key set, a lease or envelope checked against another task refuses as task_mismatch and an unbound one as task_unbound, and a task refusal at the dispatcher does not burn the nonce (tests/test_task_bound_lease_and_envelope.py). A loop-safety store keyed on (tenant_id, context_id) keeps denials, authority probes, tool switches after a denial and irreversible effects across task iterations: three denials in three separate tasks reach the default limit that no single task reaches, a new task_id never resets the count, a reset must name a policy decision and keeps the earlier events, state written through one store instance is read by another on the same SQLite file, and an unreadable store raises instead of reporting an empty history (tests/test_loop_safety.py)."
    maturity: implemented_and_tested
    scope_boundary: "Binding only. This is not proof-of-possession: it binds an authorization to a task and does not prove the presenter holds a key, and nothing here closes the AGNTCY profile's PoP requirement. The execution API carries context_id and task_id from the request into the token context, the lease and the loop-safety state (tests/test_task_identity_server_path.py); a deployment makes them mandatory with REMORA_REQUIRE_TASK_IDENTITY, off by default, and no deployment is claimed to run with it. The A2A envelope's task check is a library check with no receiving route. The loop-safety limits are uncalibrated defaults, and authority probes and irreversible effects are counted only when a caller reports them: /assess records denials and tool switches. The declared-operation check (actual within declared within authorized) is a library check of the A2A envelope, with no receiving route (tests/test_a2a_declared_operation.py). LoopHarness itself is not implemented; REMORA keeps the non-decaying state the paper motivates, not its harness."
    related_work_section: "docs/09-related-work.md §11"
    in_code_citation: true
