    evidence: >-
      Gate behaviour on the observable task surface is unit-tested
      (tests/test_remora_toolcall_gate*.py, tests/test_toolcall_scoring.py);
      tests/test_toolcall_benchmark_v2_results.py re-runs the adversarial v2
