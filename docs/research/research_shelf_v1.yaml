# REMORA Research Shelf v1
#
# Machine-readable inventory of external research considered as off-the-shelf
# components. The point of this file is that "sufficient grounding" is a
# CHECKED property, not a promise: scripts/check_research_shelf.py refuses a
# shelf where an unverified source has been adopted, where an adopted entry
# names code or tests that do not exist, or where someone else's reported
# numbers have drifted into looking like REMORA's.
#
# This is not a second frontier roadmap. docs/13-research-frontier-roadmap.md
# holds the narrative work packages and the sequencing argument; this file
# holds the pick-list and its evidence, and the two cross-reference by id.
#
# ── Source verification ladder ───────────────────────────────────────────────
#   VERIFIED_RETRIEVED   title + authors confirmed against the publisher's own
#                        page on the `verified` date
#   UNVERIFIED           listed but not retrieved. MAY NOT be adopted and MAY
#                        NOT be cited in any narrative document until checked
#   RETRIEVAL_FAILED     retrieval attempted and the record did not match
#   INTERNAL             a REMORA finding, not an external work. Requires
#                        `venue: internal` and carries no url; the checker
#                        refuses an INTERNAL entry that cites one, so an
#                        internal item can never borrow external authority
#
# ── Adoption ladder ──────────────────────────────────────────────────────────
#   ADOPTED          shipped; `remora_evidence` names existing code + tests
#   PARTIAL          one slice shipped, remainder scoped in `remaining`
#   SCOPED           decided to build, not started; `blocked_by` names what first
#   PROTOTYPE_ONLY   research track only; must never gate a live decision
#   DECLINED         decided against; `decline_reason` is mandatory
#   UNEVALUATED      on the shelf, no decision taken
#
# ── The rule that keeps this honest ──────────────────────────────────────────
# `reported_results` is ALWAYS the source authors' number on their own setup.
# No REMORA measurement may be recorded here. REMORA numbers live in
# docs/assurance/claim_register_v1.yaml, bound to a result artifact on disk.
# A `remora_results` key is a hard error.

schema_version: "1"
updated: "2026-09-28"

components:

  # ── Task–tool semantics ────────────────────────────────────────────────────

  - id: SHELF-001
    name: "Declarative tool capability/effect contracts"
    source:
      title: "ToolGuardian: Declarative Security for AI Agent-Tool Interactions"
      authors: "Arun Ravindran, Saurabh Deochake"
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2607.21835"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-03"
      reported_results: >-
        Authors report F1 0.86 for denial classification and 88% vetting
        accuracy over 16 MCP-style tools (8 malicious variants) and 20 runtime
        scenarios. Their setup, their numbers.
    roadmap_ref: "RF-10"
    remora_status: >-
      ToolContract + ToolContractRegistry declare capability, effect,
      resource_type, mutation and argument roles; goal_match supplies the
      tri-state tool_matches_goal.
    adoption: ADOPTED
    remora_evidence:
      - remora/toolcall/routing/tool_contract.py
      - remora/toolcall/routing/goal_match.py
      - tests/test_goal_match.py
    declined_parts: >-
      Answer Set Programming is not adopted. The decision engine is a frozen
      first-match table; a solver in the decision path replaces an auditable
      artifact with a search.

  - id: SHELF-002
    name: "Predict declared state change before execution"
    source:
      title: "Sample, Predict, then Proceed: Self-Verification Sampling for Tool Use of LLMs"
      authors: "Shangmin Guo et al."
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2506.02918"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-03"
      reported_results: >-
        Authors report improved BFCL results and fewer hallucinated actions
        from a trained dynamics model. Their setup, their numbers.
    roadmap_ref: "RF-10"
    remora_status: >-
      effect_prediction.py fills expected_effect_matches from the deployment's
      declared state_delta, wired into the engine's conditional gates.
    adoption: ADOPTED
    remora_evidence:
      - remora/toolcall/routing/effect_prediction.py
      - tests/test_effect_prediction.py
      - remora/policy/decision_engine.py
    declined_parts: >-
      The trained dynamics model is refused as an authority. A generative state
      estimate must never establish SUPPORTED; only the declared contract may.
    remaining: >-
      No-op detection needs field-level current state; StateIndex is a flat
      value set by design. Argument-bound delta templates are unimplemented.

  - id: SHELF-003
    name: "Task alignment checked at every step"
    source:
      title: "The Task Shield: Enforcing Task Alignment to Defend Against Indirect Prompt Injection in LLM Agents"
      authors: "Feiran Jia, Tong Wu, Xin Qin, Anna Squicciarini"
      venue: "ACL 2025 (peer-reviewed)"
      url: "https://aclanthology.org/2025.acl-long.1435/"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-03"
      reported_results: >-
        Authors report 2.07% attack success rate and 69.79% task utility on
        AgentDojo with GPT-4o. Their setup, their numbers.
    roadmap_ref: "RF-10"
    remora_status: >-
      goal_match implements the same reframing deterministically, and more
      strictly than a model judge: source_spans must occur verbatim in the task
      text, and resource, effect and target role must all agree.
    adoption: PARTIAL
    remora_evidence:
      - remora/toolcall/routing/goal_match.py
      - tests/test_goal_match.py
    remaining: >-
      Single intent against a single call. No subgoals, no dependency between
      steps, no notion of a call that serves the goal indirectly. Extending
      TaskIntent with subgoals/completion criteria is the next slice.
    blocked_by: "SHELF-020"

  # ── Trajectory and control flow ────────────────────────────────────────────

  - id: SHELF-004
    name: "Plan as a tool dependency graph"
    source:
      title: "IPIGuard: A Novel Tool Dependency Graph-Based Defense Against Indirect Prompt Injection in LLM Agents"
      authors: "Not yet confirmed against the publisher page"
      venue: "EMNLP 2025 (peer-reviewed)"
      url: "https://aclanthology.org/2025.emnlp-main.53/"
      verification: UNVERIFIED
