  # ── Internal prerequisite, not an external component ───────────────────────

  - id: SHELF-020
    name: "Wire the routing context builder into the authoritative execution path"
    source:
      title: "Internal finding — no external source"
      authors: "REMORA code review, 2026-08-03"
      venue: internal
      verification: INTERNAL
      verified: "2026-08-03"
      reported_results: >-
        No external result. Verified by inspection: build_full_observation is
        imported by remora/toolcall/routing/*, the holdout scripts and tests,
        and by neither servers/api.py nor servers/execution_api.py.
        ToolContractRegistry appears only in the contract module, the routing
        evaluation and tests.
    roadmap_ref: "RF-10"
    remora_status: >-
      The whole task–tool semantics layer — ToolContract, TaskIntent,
      goal_match, effect_prediction — is exercised in the research and
      benchmark path and is absent from the path that actually enforces.
      Everything measured about it is therefore measured about a component the
      production route does not run.

      2026-08-04 partial fix: the semantic-binding gap in match_tool_to_intent
      was patched.  source_spans only verified entity presence; a model could
      claim requested_effect="cancel" with source_span="booking B-104" and reach
      SUPPORTED because "booking B-104" appeared in the task.  The fix adds
      action_spans (a separate span field for the effect claim), a versioned
      EFFECT_VOCABULARY (v1), and negation/conditionality detection.  Seven new
      tests pin the attack surface: real-entity-span-wrong-effect → UNKNOWN,
      negation → UNKNOWN, conditional ("before closing") → UNKNOWN.
      effect_consistent() still uses only spans_verifiable_in() for this check;
      match_tool_to_intent is the primary gate and the more critical path.

      2026-08-04 wiring landed: with REMORA_SEMANTIC_BUNDLE_MODULE configured,
      /v1/execution/assess and /execute build their observation through
      build_full_observation over a deployment-declared SemanticBundle
      (signatures + contracts + validators + state; hashes computed from the
      declarations, never declared). The intent arrives only as an opaque
      intent_ref resolved server-side per task_intent_authority_v1.md — it can
      never ride in the request, and request extras asserting semantic verdicts
      are ignored. bundle/state/intent-authority hashes are recorded in the
      assess audit record and bound into the ExecutionLease at execute time.
      Parity 4 in tests/test_shelf020_parity.py pins field-identity between the
      execution path and the builder.
    adoption: PARTIAL
    remora_evidence:
      - remora/toolcall/semantic_bundle.py
      - servers/execution_api.py
      - servers/semantic_bundle_research.py
      - tests/test_shelf020_parity.py
      - tests/test_execution_semantic_wiring.py
      - tests/test_assess_semantic_wiring.py
      - tests/test_semantic_bundle.py
    remaining: >-
      The wiring is configuration-gated: a deployment without
      REMORA_SEMANTIC_BUNDLE_MODULE still runs the registry-only path, recorded
      as empty hashes. Discrimination through the wired path is UNMEASURED —
      SAP v4 has not run, so no accuracy or wrong-call number may be cited for
      it. 2026-08-05: the envelope producer gap is closed — /v1/assess accepts
      an optional tool_call block and runs the SAME builder
      (semantic_call_context → build_full_observation), recording
      tool_contract_bundle_hash / intent_authority_hash into the envelope's
      AuditBlock and upgrading tool_args_hash to the canonical execution
      preimage (tests/test_assess_semantic_wiring.py). On that question-based
      path the verdicts are RECORDED for audit; the gate decision still comes
      from the engine pipeline — decision impact there is a separate,
      unshipped step. The executive metadata registry (risk tier, in
      TOOL_REGISTRY) is still a declaration separate from the semantic bundle.

  # ── Deferred adoptions, kept visible rather than forgotten ─────────────────

  - id: SHELF-023
    name: "Machine-verifiable derivation receipts for derived argument values"
    source:
      title: "Internal finding — no external source"
      authors: "NEGATIVE_RESULTS §35 backlog theme 3, resolved mechanism-side 2026-08-05"
      venue: internal
      verification: INTERNAL
      verified: "2026-08-05"
      reported_results: >-
        No external result. Motivating internal measurement (development set,
        spent): value grounding cost legitimate read autonomy 86.1% -> 56.8%,
        dominated by dates, unit conversions and normalized numbers that are
        correct but not literally in the user's text.
    roadmap_ref: "RF-10"
    remora_status: >-
      DerivationReceipt makes the derivation itself checkable instead of
      relaxing grounding: a proposal declares the source span (verbatim in
      the task text, the same provenance discipline as goal_match's
      source_spans) and a transform from a versioned deterministic whitelist
      (v1: English dates via an internal locale-independent month table,
      number normalization, exact unit conversions, case transforms);
      verification re-executes the transform server-side and compares
      exactly. Models may propose, only re-execution accepts; arithmetic and
      ambiguous conversions are deliberately excluded as receipt-craftable.
      Wired end to end: values_grounded consults verified receipts, episodes
      carry observable proposals, both server APIs accept them
      (extra=forbid), and remora.sdk ships a typed DerivationProposal.
    adoption: ADOPTED
    remora_evidence:
      - remora/toolcall/routing/derivation.py
      - remora/toolcall/routing/compatibility.py
      - tests/test_derivation_receipt.py
      - tests/test_derivation_server_threading.py
    remaining: >-
      Effect on the measured autonomy loss is UNMEASURED: the 86.1% -> 56.8%
      cost was measured on a spent development set, and quantifying the
      recovery requires the new sealed track (NEGATIVE_RESULTS backlog theme
      2 / SAP v4 scope decision). Growing the transform vocabulary is a
      reviewed change; DerivationReceipt numbers may not be cited until that
      round runs.

  - id: SHELF-021
    name: "Postcondition observation after a governed side effect"
    source:
      title: "Internal finding — no external source"
      authors: "REMORA OT simulation + external pattern proposal, 2026-08-04"
      venue: internal
      verification: INTERNAL
      verified: "2026-08-04"
      reported_results: >-
        No external result. Observed in the 2026-08-04 OT shift simulation:
        close_work_order against a work order that did not exist was assessed,
        approved, authorised and dispatched, and surfaced only because the tool
        itself raised. Nothing in the governed path reads the world back to
        check that the declared post-state actually holds.
    roadmap_ref: "RF-10"
    remora_status: >-
      Half of the mechanism exists. ToolContract.state_delta already declares
      the intended post-state, and the execution API separates authorised from
      executed (execution_authorized before the side effect,
      execution_result after). What is absent is an authoritative reader per
      write tool, and a policy for the disagreement case.
    adoption: SCOPED
    remaining: >-
      Deliberately not half-built. Observing a postcondition without deciding
      what happens when observation and declaration disagree — including when
      the re-read itself fails — would produce a field nobody can act on, which
      is the failure mode CallCompatibility's docstring warns about: a guessed
      field is worse than an absent one. Needs: a declared reader per write
      tool, a disagreement policy, and a decision on whether a failed
      postcondition can retroactively change a recorded decision (it cannot —
      the chain is append-only, so it must append a contradiction record).

  - id: SHELF-022
    name: "Adversarial filesystem and shell corpus for tool-call safety"
    source:
      title: "Internal finding — no external source"
      authors: "External pattern proposal, 2026-08-04"
      venue: internal
      verification: INTERNAL
      verified: "2026-08-04"
      reported_results: >-
        No external result. Proposed categories: path traversal, symlink
        escape, Windows path confusion (UNC, 8.3 names, alternate data streams,
        trailing dots), shell startup-file injection, credential exfiltration
        via redirection.
    roadmap_ref: "RF-10"
    remora_status: >-
      Partial coverage exists: remora/agent_hook/shell_ast.py parses shell
      commands structurally rather than by pattern match, and remora/safety/
      covers adversarial text. There is no corpus that exercises the
      filesystem-confusion categories as a measurable benchmark.
    adoption: UNEVALUATED
    remaining: >-
      Real value, but a corpus that produces a number is a claimed benchmark:
      it needs committed artifacts, a claim-register entry, and a
      pre-registered scoring rule, or it becomes exactly the kind of
      unfalsifiable "we tested it" statement this repository refuses. Its own
      round, not a side effect of another one.

  # ── Programmatic Tool Calling ─────────────────────────────────────────────

  - id: SHELF-024
    name: "Programmatic Tool Calling (PTC) — Python as the tool-composition layer"
    source:
      title: "The Bitter Lesson of Tool Calling"
      authors: "Ishan Patel, Sahil Sen, Elias Lumer, and Vamse Kumar Subbiah"
      venue: "arXiv preprint (PricewaterhouseCoopers, Commercial Technology and Innovation Office)"
      url: "https://arxiv.org/abs/2608.06370"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-10"
      reported_results: >-
        Authors' numbers on their own setup: PTC matches or outperforms JSON
        tool calling on 13/14 models in fan-out scenarios; 18.8 pp advantage
        over JSON at chain length ≥12; ~50% wall-clock latency reduction in
        chaining tasks on 13/14 models; context-rot resistance under 128-tool
        context. Paper also introduces the aggregation-accuracy vs enumeration-
        accuracy distinction (correct answer vs tool actually called). Benchmark
        of 200 tasks, 14 models. These are the source authors' numbers on their
        setup; no REMORA measurement exists yet.
    roadmap_ref: "RF-11"
    remora_status: >-
      REMORA already has the governance-and-execution boundary (signed ToolSpec,
      lease-based dispatch, DecisionEnvelope, one-time grants, outbox,
      postcondition evidence). PTC provides a complementary planning-layer
      above that boundary. The key architectural rule adopted: stubs propose,
      REMORA authorises. "Python is computation; REMORA owns authority."
      Three components implemented as a planning-layer prototype:
      (1) stub_generator.py — typed Python stubs from signed ToolSpec; stubs
          return ProposedCall data objects only, never call real APIs;
      (2) call_graph.py — pure AST extraction of the action DAG from an
          LLM-generated plan (no eval/exec of untrusted code);
      (3) governed_batch.py — submits each ProposedCall individually through
          REMORA governance; parallelises independent ACCEPT nodes; full
          per-call audit envelope.
      The authors' subprocess execution model (echo-return stubs, no real
      APIs, argument-serialisation measurement only) is explicitly NOT adopted
      for REMORA's production path: REMORA stubs have no network/process
      authority.
    adoption: SCOPED
    remora_evidence:
      - remora/toolcall/ptc/__init__.py
      - remora/toolcall/ptc/stub_generator.py
      - remora/toolcall/ptc/call_graph.py
      - remora/toolcall/ptc/governed_batch.py
      - remora/toolcall/ptc/_broker.py
      - tests/test_ptc_gptc.py
    declined_parts: >-
      Direct Python → production API: bypasses REMORA security model.
      Authors' subprocess execution environment: no REMORA governance gate.
      Any PTC result number as a REMORA claim: no artifact exists yet.
    remaining: >-
      (a) GPTC ablation benchmark: JSON vs PTC with the same REMORA gate
      in front of both, on BFCL + existing wrong-call tests, with pre-
      registered scoring. Required before any performance claim may enter
      README. (b) Plan-level governance: pre-assess the full action DAG
      (capability surface, resource scope, credential needs, data-flow from
      untrusted sources) before any call executes. (c) New enumeration-
      accuracy metrics: plan_call_recall, executed_call_recall,
      unauthorized_call_rate, grant_binding_failure_rate,
      postcondition_match_rate. (d) Context-rot / capability-surface
      filtering: REMORA decides which tool subset is presented to the
      planner based on current task scope (pairs with RF-01 tool integrity).

  - id: SHELF-025
    name: "Content-bound context intake and four-dimensional Spec Fidelity"
    source:
      title: "SDAD: Spec-Driven Agentic Development for the AI-Native SDLC"
      authors: "Vu Hung Nguyen, Thanh Nguyen"
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2608.20341"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-24"
      reported_results: >-
        The paper proposes Spec Fidelity across completeness, consistency,
        unambiguity and verifiability, and frames context ingestion as part of
        execution. It explicitly lists operational definitions and
        longitudinal baselines for Spec Fidelity/SER as open work; no source
        result is treated as a REMORA measurement.
    remora_status: >-
      REMORA operationalises the narrow intake slice as a signed,
      content-addressed ContextManifest and a signed, non-scalar
      SpecFidelityReceipt whose evaluator identity is bound to key material.
      Every positive or negative finding requires evidence references, missing
      checks remain UNRESOLVED, and an accepted intake requires all four
      dimensions to be SATISFIED. The contract and reference artifact are
      machine-readable and the latter is reproduced byte-for-structure in a
      test.
    adoption: PARTIAL
    remora_evidence:
      - remora/governance/spec_intake.py
      - schemas/spec_intake_v1.yaml
      - artifacts/spec_intake/sdad_spec_fidelity_v1.json
      - tests/test_spec_intake.py
    declined_parts: >-
      Agentic Autonomy Rate as assurance evidence and any scalar Spec Fidelity
      score. Generated-line share is not correctness, and an aggregate can hide
      a failed load-bearing dimension.
    remaining: >-
      Library surface only. RMR-004 must bind the verified manifest hash to the
      final signed ToolSpec, callable identity, credential scope and dispatch
      before this can be called an enforcement control. No semantic-correctness
      or empirical SDAD-effect claim is made.

  # ── Per-decision evidence and authorization-to-effect (brief 2026-08-25) ────

  - id: SHELF-026
    name: "Interoperable per-decision governance evidence record"
    source:
      title: "AIREP: A Protocol for Per-Decision Evidence in AI Runtime Governance"
      authors: "Ali Toygar Abak"
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2608.21363"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-25"
      reported_results: >-
        No empirical evaluation is claimed. The author describes a protocol, a
        reference implementation and a two-language conformance kit. Records
        carry one of five closed verbs (release, block, defer, redact,
        escalate) under a stated policy basis, reference input, output and
        evidence by hash rather than value, declare both what the evidence
        covers and what it does not, and form a SHA-256 chain binding each
        record to its position. Their design, their claims.
    roadmap_ref: "RF-10"
    remora_status: >-
      Not evaluated. REMORA's DecisionEnvelope is the same shape of object
      arrived at independently: a per-decision record, hash-chained, with a
      policy identity and evidence referenced rather than inlined. Two
      differences are already visible without any work. REMORA's action
      vocabulary is ACCEPT/VERIFY/ABSTAIN against AIREP's five verbs, so a
      mapping is a design decision and not a rename. And AIREP's explicit
      non-coverage declaration has no REMORA counterpart: the envelope says
      what was decided, never what the evidence does not reach.
    adoption: PARTIAL
    remora_evidence:
      - servers/api.py
      - schemas/decision_envelope_schema.yaml
      - remora/execution/service.py
      - tests/test_trust_base_coverage.py
    remaining: >-
      Only the non-coverage half is adopted, and it was built from REMORA's
      own gap rather than from the protocol: the audit block now carries
      per-component trust-base identity and an explicit `not_covered` list, so
      a record no longer reads as covering everything it does not mention. The
      wire format is NOT adopted and no interoperability claim is made. A
      mapping test (DecisionEnvelope -> AIREP record, REMORA semantics in the
      vendor namespace) still needs the field-level specification, which the
      abstract does not give; the five-verb vocabulary against REMORA's
      ACCEPT/VERIFY/ABSTAIN remains an open mapping decision.

  - id: SHELF-027
    name: "Authorization revalidated at provider commit, not at request"
    source:
      title: "AID-Guard: Stateful Authorization for Delegated Agent Effects"
      authors: "Yingzhe Tong, Leyu Dai, Songhui Guo"
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2608.21159"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-25"
      reported_results: >-
        Authors report 44/44 attacks blocked and 44/44 matched legitimate
        proposals admitted under complete proposer compromise; all 210 Stripe
        provider-contract trials matching predeclared outcomes; and across
        Stripe and Resend, 40 terminalize-successor schedules, 30 overlapping
        races and 10 crash-recovery schedules completing without duplicate
        effects. A Python/SQLite implementation over two providers. Their
        setup, their numbers.
    roadmap_ref: "RF-10"
    remora_status: >-
      Not evaluated. REMORA binds authorization at decision time: the
      ExecutionLease carries a policy bundle hash and a nonce, and the
      EnforcementGate consumes a one-time jti. What it does not do is
      revalidate provider state at the moment the provider commits the effect,
      which is the gap AID-Guard names. REMORA's outbox lifecycle reconciles a
      stale DISPATCHING to UNKNOWN, so an indeterminate effect is already
      distinguished from an unclaimed intent, but the successor rule
      (a retry admitted only after terminal status or certified no-effect) is
      not expressed.
    adoption: UNEVALUATED
    remaining: >-
      Whether this reduces to the existing outbox states or is a distinct
      property is an open question and must be settled by building the
      reservation semantics against one mutating tool, not by reading. Related
      to the trust-base view-consistency question raised in
      cosai-oasis/ws4-secure-design-agentic-systems#149: both are about
      whether the state an authorization was granted against is the state in
      force when the effect lands.

