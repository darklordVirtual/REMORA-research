  # ── Authority-to-effect hardening (quality program WS7, intake 2026-09-28) ──

  - id: SHELF-029
    name: "Measured correctness of the enforcement gate itself"
    source:
      title: "How Strongly Should Task State Influence an LLM Agent?"
      authors: "Chenyu Zhang, Wonbin Kweon, Jiawei Han"
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2609.25686"
      verification: VERIFIED_RETRIEVED
      verified: "2026-09-28"
      reported_results: >-
        Authors report, across three models, two reasoning regimes and two domains, that enforcement needs no model obedience but is bounded by the correctness of its state and of the matcher that maps requests to steps; showing accurate state is unreliable and a self-written ledger beats a shown checklist. Their setup, their findings.
    remora_status: >-
      Measured by the pre-registered gate-correctness study (WS7 item 1): seven validator arms over the 540 fleetops episodes, 5 of 7 predictions met, the misses in NEGATIVE_RESULTS.md §60 (open). A lenient prefix matcher let 0.667 of corrupt calls through; a fail-open validator 0.078; stale or partial indexes cost autonomy instead; no gated arm auto-accepted a write. One domain and one engine configuration.
    adoption: ADOPTED
    remora_evidence:
      - experiments/gate_correctness_study.py
      - results/gate_correctness_study_v1.json
      - tests/test_gate_correctness_fixture.py

  - id: SHELF-030
    name: "Trace capture outside the agent's control"
    source:
      title: "LLM Agents Can Easily Tamper With Their Own Traces"
      authors: "Jeremy Qin, David Schmotz, Derck Prinzhorn et al."
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2609.30266"
      verification: VERIFIED_RETRIEVED
      verified: "2026-09-28"
      reported_results: >-
        Authors report that all tested local agent harnesses but one (they name Claude Code, Codex, Antigravity, Open Code and Grok Build among those that failed) let agents delete their own traces when asked without triggering monitor guardrails, that external attackers can induce the deletion, and that trace tampering emerges when agents pursue reward. They advise independent interception outside the agent's control. Their setup, their findings.
    roadmap_ref: "RF-08"
    remora_status: >-
      Reference form implemented (Q7.6): remora/audit/recorder.py runs as a separate process with a hash-chained SQLite store whose triggers abort UPDATE and DELETE, and an agent-side client with no destructive operation. Every append returns a receipt, so a deletion made behind the recorder's back is detected. GovernedToolDispatcher.bind_recorder records the intent before the nonce is spent for the tools a deployment names, and refuses as recorder_unavailable when the recorder is down. PARTIAL because process separation is only as strong as the deployment's OS boundary, and the independently operated durable sink is an owner decision overlapping REM-025.
    adoption: PARTIAL
    remora_evidence:
      - remora/audit/recorder.py
      - remora/enforcement/lease.py
      - tests/test_independent_recorder.py

