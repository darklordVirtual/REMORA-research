      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2504.11703"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-07"
      reported_results: >-
        Current version reports attack success rate on AgentDojo reduced from
        39.9% (no defense) to 1.0% while maintaining utility; v1 (titled
        "Progent: Programmable Privilege Control for LLM Agents") reported
        41.2% to 2.2%. Their setup, their numbers.
    roadmap_ref: "RF-10"
    remora_status: >-
      Server-side tool registry, action types, risk tiers, hard guards, an OPA
      adapter and execution leases exist. There is no privilege lattice, so
