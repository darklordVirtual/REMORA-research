  - id: SHELF-032
    name: "Dependency-scoped plan validity (PlanFence)"
    source:
      title: "Fresh Memory, Stale Plans: Dependency-Scoped Validation for Distributed LLM-Agent Memory"
      authors: "Evan Chen, Shiqiang Wang, Christopher G. Brinton"
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2609.03340"
      verification: VERIFIED_RETRIEVED
      verified: "2026-09-28"
      reported_results: >-
        Authors report that in 30 controlled live workflows with a post-plan revision, a freshness-only executor acts on the obsolete plan in every task, while PlanFence completes all tasks without an invalid action. Their setup, their numbers.
    remora_status: >-
      Implemented (Q7.5): remora/governance/plan_binding.py records the revision of each resource a plan read and which of them a write depends on; the digest is signed into the lease, and the dispatcher re-reads the dependencies immediately before the write. A moved dependency refuses as stale_plan, a moved read the write does not depend on is ignored, and an unreadable dependency refuses as plan_state_unverifiable. Dependencies are declared by the plan's author; an under-declared one is not detected.
    adoption: ADOPTED
    remora_evidence:
      - remora/governance/plan_binding.py
      - remora/enforcement/lease.py
      - tests/test_plan_binding.py

