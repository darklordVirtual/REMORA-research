    blocked_by: "SHELF-009"

  # ── Abstention ─────────────────────────────────────────────────────────────

  - id: SHELF-011
    name: "Paired act/abstain benchmark"
    source:
      title: "AgentAbstain: Do LLM Agents Know When Not to Act?"
      authors: >-
        Xun Liu, Yi Evie Zhang, Vira Kasprova, Parisa Rabbani,
        Pardis Sadat Zahraei, Tianyu Zhang, Ali Ebrahimpour-Boroojeny,
        Varun Chandrasekaran
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2607.10059"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-03"
      reported_results: >-
        263 paired tasks across 42 executable sandbox environments, each pair a
        should-act task and a should-abstain variant. Their setup, their
        numbers; REMORA has run nothing against it.
    roadmap_ref: "RF-09"
    remora_status: >-
      ABSTAIN is a first-class route, but no external benchmark tests whether
      it is chosen BEFORE an irreversible commit. The paired structure is what
      makes this worth adopting: a system that always abstains scores badly.
    adoption: SCOPED
    remaining: >-
      Adapter under experiments/, fixture episodes committed, fail-hard scorer,
      offline pytest coverage. No claim register entry until a real run
      produces a result artifact.

