        should-act task and a should-abstain variant. Their setup, their
        numbers; REMORA has run nothing against it.
    roadmap_ref: "RF-09"
    remora_status: >-
      ABSTAIN is a first-class route, but no external benchmark tests whether
      it is chosen BEFORE an irreversible commit. The paired structure is what
      makes this worth adopting: a system that always abstains scores badly.
