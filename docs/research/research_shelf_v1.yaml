    blocked_by: "SHELF-020"

  - id: SHELF-005
    name: "Verify-before-commit separation of speculative and authorised facts"
    source:
      title: "VIGIL: Defending LLM Agents Against Tool-Stream Injection via Verify-Before-Commit"
      authors: "Junda Lin et al."
      venue: "ACL 2026 (peer-reviewed)"
      url: "https://aclanthology.org/2026.acl-long.443/"
      verification: UNVERIFIED
      reported_results: "Not recorded — source not retrieved."
    roadmap_ref: "RF-10"
    remora_status: >-
      Pre-execution decision, exact call binding, execution lease, fresh re-gate
