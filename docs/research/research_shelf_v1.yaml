# REMORA Research Shelf v1
#
# Machine-readable inventory of external research considered as off-the-shelf
# components. The point of this file is that "sufficient grounding" is a
# CHECKED property, not a promise: scripts/check_research_shelf.py refuses a
# shelf where an unverified source has been adopted, where an adopted entry
# names code or tests that do not exist, or where someone else's reported
# numbers have drifted into looking like REMORA's.
#
# This is not a second frontier roadmap. docs/13-research-frontier-roadmap.md
# holds the narrative work packages and the sequencing argument; this file
# holds the pick-list and its evidence, and the two cross-reference by id.
#
# ── Source verification ladder ───────────────────────────────────────────────
#   VERIFIED_RETRIEVED   title + authors confirmed against the publisher's own
#                        page on the `verified` date
#   UNVERIFIED           listed but not retrieved. MAY NOT be adopted and MAY
#                        NOT be cited in any narrative document until checked
#   RETRIEVAL_FAILED     retrieval attempted and the record did not match
#   INTERNAL             a REMORA finding, not an external work. Requires
#                        `venue: internal` and carries no url; the checker
#                        refuses an INTERNAL entry that cites one, so an
#                        internal item can never borrow external authority
#
# ── Adoption ladder ──────────────────────────────────────────────────────────
#   ADOPTED          shipped; `remora_evidence` names existing code + tests
#   PARTIAL          one slice shipped, remainder scoped in `remaining`
#   SCOPED           decided to build, not started; `blocked_by` names what first
#   PROTOTYPE_ONLY   research track only; must never gate a live decision
#   DECLINED         decided against; `decline_reason` is mandatory
#   UNEVALUATED      on the shelf, no decision taken
#
# ── The rule that keeps this honest ──────────────────────────────────────────
# `reported_results` is ALWAYS the source authors' number on their own setup.
# No REMORA measurement may be recorded here. REMORA numbers live in
# docs/assurance/claim_register_v1.yaml, bound to a result artifact on disk.
# A `remora_results` key is a hard error.

schema_version: "1"
updated: "2026-08-24"

components:

  # ── Task–tool semantics ────────────────────────────────────────────────────

  - id: SHELF-001
    name: "Declarative tool capability/effect contracts"
