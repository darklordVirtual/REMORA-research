    adoption: UNEVALUATED

  - id: SHELF-006
    name: "Persistent safety state across a trajectory (shadow memory)"
    source:
      title: "MAGE: Safeguarding LLM Agents against Long-Horizon Threats via Shadow Memory"
      authors: "Yuhui Wang et al."
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2605.03228"
      verification: UNVERIFIED
      reported_results: "Not recorded — source not retrieved."
    roadmap_ref: "RF-10"
    remora_status: >-
      session_count and cumulative_risk exist as PolicyObservation fields but
      are caller-supplied, so they are integration context rather than an
      authoritative safety state built from observed events.
    adoption: UNEVALUATED
    blocked_by: "SHELF-020"

  # ── Information flow and provenance ────────────────────────────────────────

  - id: SHELF-007
    name: "Per-value integrity/confidentiality labels (information-flow control)"
    source:
      title: "Securing AI Agents with Information-Flow Control (Fides)"
      authors: "Manuel Costa et al."
      venue: "Microsoft Research; publication entry lists TMLR"
      url: "https://www.microsoft.com/en-us/research/publication/securing-ai-agents-with-information-flow-control/"
      verification: UNVERIFIED
      reported_results: "Not recorded — source not retrieved."
    roadmap_ref: "RF-02"
    remora_status: >-
      argument_tainted is a single global flag plus a list of untrusted-
      controlled argument names. An argument is effectively tainted or not;
      there is no per-value label, no confidentiality dimension and no
      transitive propagation.
    adoption: UNEVALUATED

  - id: SHELF-008
    name: "Capabilities bound to data, not only to tools"
    source:
      title: "Defeating Prompt Injections by Design (CaMeL)"
      authors: >-
        Edoardo Debenedetti, Ilia Shumailov, Tianqi Fan, Jamie Hayes,
        Nicholas Carlini, Daniel Fabian, Christoph Kern, Chongyang Shi,
        Andreas Terzis, Florian Tramèr
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2503.18813"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-07"
      reported_results: >-
        Authors report CaMeL solves 77% of AgentDojo tasks with provable
        security, against 84% for an undefended system. Their setup, their
        numbers.
    roadmap_ref: "RF-02"
    remora_status: >-
      The propose/decide/execute separation already holds and the agent owns
      neither callables nor credentials. Capability is attached to the tool and
      the lease, not to each datum used as an argument. Since 2026-09-28 (WS8,
      RES-020) capability sets are also scoped to the task, bound into the
      lease, and can require an argument to equal a fact from trusted state,
      which covers some of the same attacks at tool and argument granularity.
      CaMeL's data-flow capabilities and its privileged/quarantined split are
      still not implemented, so this stays UNEVALUATED.
    adoption: UNEVALUATED

  # ── Least privilege ────────────────────────────────────────────────────────

  - id: SHELF-009
    name: "Programmable fine-grained privilege policy"
    source:
      title: "Progent: Securing AI Agents with Privilege Control"
