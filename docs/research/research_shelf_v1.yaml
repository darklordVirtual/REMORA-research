  # ── Abstention ─────────────────────────────────────────────────────────────

  - id: SHELF-011
    name: "Paired act/abstain benchmark"
    source:
      title: "AgentAbstain: Do LLM Agents Know When Not to Act?"
      authors: >-
        Xun Liu, Yi Evie Zhang, Vira Kasprova, Parisa Rabbani,
        Pardis Sadat Zahraei, Tianyu Zhang, Ali Ebrahimpour-Boroojeny,
        Varun Chandrasekaran
      venue: "arXiv preprint"
      url: "https://arxiv.org/abs/2607.10059"
      verification: VERIFIED_RETRIEVED
      verified: "2026-08-03"
      reported_results: >-
