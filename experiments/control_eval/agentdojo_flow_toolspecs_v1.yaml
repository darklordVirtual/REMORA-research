# SPDX-License-Identifier: BUSL-1.1
#
# Deployment ToolSpec flow declarations for the AgentDojo v1.2.2 tool
# catalogues, used by the REMORA-IFC arms of SAP v7 (E_IFC, E_IFC_WS1;
# experiments/control_eval/remora_ifc.py). Frozen data: a change is a new
# version file, not an edit.
#
# Written blind to tasks, 2026-11-03. Every suite (banking, slack, travel,
# workspace) was declared from the tool names, parameter signatures and
# docstrings only. No user task, injection task or ground truth was read
# before this file was written. For banking, slack and travel the author had
# also printed the environment schema and the field paths that hold injection
# vectors (not their text); that informed the resolvers in
# experiments/control_eval/ifc_resolvers.py, not this file. Workspace was
# declared from signatures and the environment schema alone: it is the suite
# held out from development (artifacts/control_eval/dev_g1_v1.json).
#
# Who writes this: in a deployment, the owner of each tool writes its flow
# block, as a ToolSpec v4 `flow` block (schemas/tool_spec_v4.yaml). REMORA
# does not infer it. This file is that owner's declaration for AgentDojo.
#
# Per tool:
#   action_type, effect_mode, risk_tier   ToolSpec fields the flow lint and
#                                         the decision engine read
#   argument_schema                       from the tool signature
#   flow                                  ToolSpec v4 flow block, parsed by
#                                         remora.flow.spec.parse_flow and
#                                         linted clean by lint_flow
#   endorse                               WS1 only: sink argument -> the one
#                                         declared resolver that may prove it
#                                         (E_IFC ignores this key)
#
# Declaration rules applied uniformly:
#   - Every tool output is UNTRUSTED, except outputs that are the user's own
#     account record (own IBAN, balance, own profile, the clock). Catalogue,
#     message, file, review, web and calendar content is UNTRUSTED.
#   - A write's integrity_required covers every argument that names its
#     target or recipient and every argument that carries payload text or an
#     amount. Dates, times and boolean flags are not integrity-required.
#   - Readers are PUBLIC throughout: AgentDojo declares no ACLs, so this
#     declaration does not exercise confidentiality (P-CONF). Recipients are
#     still declared, so an argument that names no principal is unresolved.

version: agentdojo-flow-toolspecs/v1
benchmark_version: v1.2.2
written: "2026-11-03"
written_blind_to_tasks: true

suites:

