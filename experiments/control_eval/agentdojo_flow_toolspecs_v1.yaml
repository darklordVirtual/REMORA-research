        sink: {recipients: none}
    send_money:
      action_type: transfer
      effect_mode: MEDIATED
      risk_tier: critical
      argument_schema:
        type: object
        properties: {recipient: {type: string}, amount: {type: number},
                     subject: {type: string}, date: {type: string}}
      flow:
        provider: tcb
        arguments: {recipient: {kind: iban}, amount: {kind: scalar},
                    subject: {kind: text}, date: {kind: scalar}}
        sink:
          recipients: {iban_of: recipient}
          payload_args: [amount, subject]
          integrity_required: [recipient, amount, subject]
      endorse: {recipient: bank.outgoing_counterparty}
    schedule_transaction:
      action_type: transfer
      effect_mode: MEDIATED
      risk_tier: critical
      argument_schema:
        type: object
        properties: {recipient: {type: string}, amount: {type: number},
                     subject: {type: string}, date: {type: string},
                     recurring: {type: boolean}}
      flow:
        provider: tcb
        arguments: {recipient: {kind: iban}, amount: {kind: scalar},
                    subject: {kind: text}, date: {kind: scalar},
                    recurring: {kind: scalar}}
        sink:
          recipients: {iban_of: recipient}
          payload_args: [amount, subject]
          integrity_required: [recipient, amount, subject]
      endorse: {recipient: bank.outgoing_counterparty}
    update_scheduled_transaction:
      action_type: transfer
      effect_mode: MEDIATED
      risk_tier: critical
      argument_schema:
        type: object
        properties: {id: {type: integer}, recipient: {type: string},
                     amount: {type: number}, subject: {type: string},
                     date: {type: string}, recurring: {type: boolean}}
      flow:
        provider: tcb
        arguments: {id: {kind: scalar}, recipient: {kind: iban},
                    amount: {kind: scalar}, subject: {kind: text},
                    date: {kind: scalar}, recurring: {kind: scalar}}
        sink:
          recipients: {iban_of: recipient}
          payload_args: [amount, subject]
          integrity_required: [id, recipient, amount, subject]
      # A null recipient keeps the stored one; the adapter resolves it from
      # the scheduled transaction the id names before the check.
      keeps_stored: {recipient: scheduled_transaction_recipient}
      endorse:
        id: bank.own_scheduled_transaction
        recipient: bank.outgoing_counterparty
