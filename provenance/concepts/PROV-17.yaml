canonical_name: The authority-to-effect chain, taken together
invariant: The distinctive property is the chain, not any one name. An intention is not an effect. The
  grant is bound to one call, consumed once, refused if the ToolSpec changed, and split so the signer
  does not perform the effect and the executor does not sign. Delegated authority does not widen.
