distinguishing_contribution: 'The combination, measured on a deployed stack with a control: a read-only,
  low-tier tool declared by the deployment, arguments grounded against the deployment''s state index and
  the task text, an intent the deployment resolved itself, and all four grounding signals positive, lets
  the read execute without a person; a production target is excluded unless the deployment opts in with a
  flag that is part of the policy identity and lifts only that clause. On the OT pilot this took the
  five daily-round reads from review to completion (0 of 5 to 5 of 5) while every write still waited for
  an approver and every negative case still refused (artifacts/ot-pilot/grounded-reads-2026-11-03/).
  Shown not to transfer to a benchmark without a deployment intent source (NEGATIVE_RESULTS §102).'
