concept_id: PROV-18
canonical_name: Declared-tool grounded read autonomy, with the production exclusion lifted only by deployment opt-in
invariant: A read executes without a person only when every question the engine can answer from
  declared data is answered positively, and the deployment, not the agent, supplied that data. The tool's
  risk, action type and domain come from the deployment's signed or hashed declaration; the arguments
  are grounded against the deployment's state index and the task text; the call is made under an intent
  the deployment resolved from its own source. Production is excluded by default. A deployment that
  lifts the exclusion does so with one flag that is part of the policy identity, lifts only that clause,
  and accepts the disclosure a grounded read makes to the agent. Writes, higher tiers, calls without a
  resolved authority and calls with any grounding signal unknown or false never reach this path.
