distinguishing_contribution: 'Deterministic authorization that recovers useful work by fetching bounded,
  authorized evidence instead of trusting a learned score: preconditions compiled from a deployment
  registry, settled by tenant-scoped lookups against systems of record, composed as a meet whose caps
  keep their reasons, with a PROVED precondition able to ground the engine''s own signals and a learned
  monitor confined to vetoing or ordering lookups. Measured in Studies B and C (NEGATIVE_RESULTS §95,
  §96), on the M4.1 negative matrix at the Postgres reference backend (docs/assurance/ws1_m4_1_closure_record_v1.md)
  and, in shadow, through the real routes of a deployed stack (§94, 2026-11-04).'
