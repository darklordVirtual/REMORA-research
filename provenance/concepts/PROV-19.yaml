schema_version: remora-concept-record-v1
concept_id: PROV-19
canonical_name: WS1, a deterministic floor with bounded evidence lookups and grounding from proofs
invariant: Authority comes from deterministic composition over proved preconditions, never from a
  learned score. Each precondition is compiled from a deployment-owned registry, bound to the call, the
  tenant, the evidence revision and the policy profile, and settled only by a bounded, tenant-scoped
  lookup against a system of record through a registered verifier. A PROVED precondition may supply the
  engine's grounding signals, so the engine re-decides on facts read from the systems of record; WS1
  itself never raises a decision. A learned monitor may veto or order lookups; it may not select a new
  source, change a verifier outcome, close a prerequisite, weaken a deterministic denial or mint a
  grant. The composition is a meet, every cap keeps its reason, and the record is hash-bound.
