concept_id: PROV-20
canonical_name: Typed monitor-veto discharge under a deployment-signed contract
invariant: A learned monitor's threshold crossing is recorded as a typed, hash-bound, durable event per
  attempt family and stays a veto by default. It is discharged only when a deployment-signed contract
  names the crossed question, the risk obligation, the verifier and the tool, and an independently signed,
  current receipt bound to contract, obligation, verifier, context, evidence revision and monitor profile
  states that the obligation is PROVED. The monitor itself plays no part in the discharge. The result is
  the legacy composition minus that one cap, bounded above by every deterministic cap; an uncovered
  question, an untyped historical veto, an unverifiable or mismatched receipt, expiry or any contradicting
  receipt keeps the veto, and the original crossing and the receipt stay in the audit record.
