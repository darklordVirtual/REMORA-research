distinguishing_contribution: 'Separating what a learned monitor may say from what may lift its veto: the
  crossing becomes a typed event owned by the deployment''s audit, and only a signed deployment contract
  plus an independent, exactly bound verifier receipt can discharge it, with the deterministic authority
  as an unmovable ceiling. The owner ruling of 2026-11-03 (#953) reads INV-M4-04''s "denial" as
  deterministic authority on exactly these conditions. Implemented as an unwired, opt-in prototype
  (library_only) with tests for the SDD §6 rows B-01 to B-12, B-14 and B-17; no study, claim or
  capability is upgraded by it (WS2 SDD v1.4 §7, NEGATIVE_RESULTS §99 to §101 for the gates it waited on).'
