[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "remora"
version = "0.10.0"
description = "Research-grade governance overlay for agentic AI actions with multi-oracle consensus, policy gating, uncertainty routing, and audit-oriented controls"
readme = "README.md"
# PEP 639 SPDX expression. BUSL-1.1 is source-available, not OSI open source;
# commercial use requires a separate REMORA Commercial License (LICENSING.md).
license = "BUSL-1.1"
license-files = [
    "LICENSE",
    "LICENSING.md",
    "COMMERCIAL_LICENSE.md",
    "THIRD_PARTY_NOTICES.md",
    "NOTICE",
]
authors = [{ name = "Stian Skogbrott", email = "support@luftfiber.no" }]
keywords = [
    "agentic-ai", "ai-safety", "ai-governance", "multi-oracle-consensus",
    "lyapunov-stability", "conformal-prediction", "uncertainty-quantification",
    "selective-prediction", "policy-as-code", "thermodynamic-ai",
    "llm", "human-in-the-loop", "audit-trail",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Core LLM API clients
llm = ["openai>=1.0", "groq>=0.5"]
# Cloud provider SDKs for storage / secrets
cloud = ["boto3>=1.26"]
# Cryptography for ZKP and audit integrity features
security = ["cryptography>=41.0"]
# MCP server transport (httpx is the only hard dep for the MCP workers)
mcp = ["httpx>=0.25"]
# REST API gateway (servers/api.py) — FastAPI + ASGI server
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
# Data analysis and visualisation
analysis = ["matplotlib>=3.8", "numpy>=1.26"]
stats = ["scipy>=1.11"]
datasets = ["datasets>=2.0"]
# NLI semantic-entropy backend (NLISemanticBackend in remora/semantic_entropy.py).
# Executed on CI-Linux via .github/workflows/nli-parity.yml (RF-06); local
# Windows execution can be blocked by application control on torch's shm.dll
# (WinError 4551) — see NEGATIVE_RESULTS.md section 3.
nli = ["sentence-transformers>=5.6", "torch>=2.12"]
agentharm = ["inspect-ai>=0.3", "inspect-evals", "openai>=1.0", "pyyaml>=6.0"]
causal = ["pyyaml>=6.0"]
# Documentation
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
# Postgres-backed runtime paths (REM-045): tenant audit chain + enforcement
# gate import psycopg (v3); control-plane storage + audit adapter import
# psycopg2. A wheel-only install of the documented durable storage needs both.
postgres = ["psycopg[binary]>=3.2,<3.4", "psycopg2-binary>=2.9"]
# dev must cover everything `make test` collects: the causal test modules
# import pyyaml at collection time, so a bare ".[dev]" install must include it.
# types-PyYAML is a mypy requirement, not a runtime one: without it the
# quality-gates job fails on `import yaml` in remora/causal/domains/loader.py
# and remora/audit_gates/api.py. It was pinned in requirements-lock.txt but
# never declared by an extra, so `-c` pinned a version pip was never asked to
# install (fixed 2026-07-31).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "sqlglot>=23.0", "mypy>=1.11", "pyyaml>=6.0", "types-PyYAML>=6.0", "httpx>=0.25"]

[project.urls]
Homepage = "https://github.com/darklordVirtual/REMORA-research"
Repository = "https://github.com/darklordVirtual/REMORA-research"
Issues = "https://github.com/darklordVirtual/REMORA-research/issues"

[project.scripts]
remora = "remora.cli:main"

# The wheel must fulfil the documented CLI/API contract (REM-045, external
# review F-01/F-05): `remora serve` / "uvicorn servers.api:app" needs the
# servers/ package, and remora.governance.envelope resolves the canonical
# schemas/ directory relative to the installed package root at runtime.
# force-include keeps schemas/ at the same top-level position it has in a
# repo checkout, so path resolution is identical in both install modes.
[tool.hatch.build.targets.wheel]
packages = ["remora", "servers"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "schemas"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",   # module-import-not-at-top (conditional/deferred imports are intentional)
    "E501",   # line-too-long (handled by formatter, not enforced in linter)
    "E701",   # multiple-statements-on-one-line-colon (compact math style)
    "E702",   # multiple-statements-on-one-line-semicolon (compact math style)
]

[tool.mypy]
# Gate scope: the safety-critical core (policy, enforcement, selective) and
# what they transitively import — enforced in quality-gates.yml. Expand
# package-by-package; do not add blanket ignores to get a package through.
python_version = "3.12"
ignore_missing_imports = true
# warn_unused_ignores stays OFF: `# type: ignore` comments here guard
# optional-dependency imports (scipy, opentelemetry, sqlglot, ...) and are
# unused/used depending on which extras are installed in the environment.
warn_unused_ignores = false
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live and not live_replay_heavy'"
markers = [
    "live: marks tests that require a live Cloudflare Worker (deselect with -m 'not live')",
    "live_replay_heavy: long-running deterministic replay/sandbox tests (run in dedicated job)",
    "unit: fast isolated tests with no external dependencies",
    "integration: tests that wire multiple modules together",
    "slow: tests that take more than 10 seconds (deselect with -m 'not slow')",
    "benchmark: reproducible benchmark runs against committed artifacts",
    "rem014_gate: REM-014 structural verification of the imported AgentHarm artifact",
    "opa_gate: OPA/Rego conformance tests (skip automatically when the opa binary is absent)",
]
