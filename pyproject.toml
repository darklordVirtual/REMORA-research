[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "remora"
version = "0.11.0"
description = "Research-grade policy-gated execution assurance for agentic AI actions with signed tool authority, deterministic governance, verification routing, and audit controls"
readme = "README.md"
# PEP 639 SPDX expression. BUSL-1.1 is source-available, not OSI open source;
# commercial use requires a separate REMORA Commercial License (LICENSING.md).
license = "BUSL-1.1"
license-files = [
    "LICENSE",
    "LICENSING.md",
    "COMMERCIAL_LICENSE.md",
    "THIRD_PARTY_NOTICES.md",
    "NOTICE",
]
authors = [{ name = "Stian Skogbrott", email = "support@luftfiber.no" }]
keywords = [
    "agentic-ai", "ai-safety", "ai-governance", "execution-assurance",
    "tool-governance", "policy-enforcement", "signed-toolspec",
    "selective-prediction", "policy-as-code", "human-in-the-loop",
    "audit-trail", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Core LLM API clients
llm = ["openai>=3.3.1", "groq>=1.6.0"]
# Cloud provider SDKs for storage / secrets
cloud = ["boto3>=1.26"]
# Cryptography for ZKP and audit integrity features
security = ["cryptography>=41.0"]
# MCP server transport (httpx is the only hard dep for the MCP workers)
mcp = ["httpx>=0.25"]
# REST API gateway (servers/api.py) — FastAPI + ASGI server
api = ["fastapi>=0.141.1", "uvicorn[standard]>=0.52.4"]
# Third-party SDK client (remora/sdk) — httpx is its only dependency;
# models and errors import without it (FT-13).
sdk = ["httpx>=0.25"]
# Data analysis and visualisation
analysis = ["matplotlib>=3.11.1", "numpy>=2.4.6"]
stats = ["scipy>=1.17.1"]
datasets = ["datasets>=2.0"]
# NLI semantic-entropy backend (NLISemanticBackend in remora/semantic_entropy.py).
# Executed on CI-Linux via .github/workflows/nli-parity.yml (RF-06); local
# Windows execution can be blocked by application control on torch's shm.dll
# (WinError 4551) — see NEGATIVE_RESULTS.md section 3.
nli = ["sentence-transformers>=6.0.0", "torch>=2.13.0"]
agentharm = ["inspect-ai>=0.3", "inspect-evals", "openai>=3.3.1", "pyyaml>=6.0"]
causal = ["pyyaml>=6.0"]
# Documentation
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=0.26"]
# Postgres-backed runtime paths (REM-045): tenant audit chain + enforcement
# gate import psycopg (v3); control-plane storage + audit adapter import
# psycopg2. A wheel-only install of the documented durable storage needs both.
postgres = ["psycopg[binary]>=3.3.4,<3.4", "psycopg2-binary>=2.9.12"]
# dev must cover everything `make test` collects: the causal test modules
# import pyyaml at collection time, so a bare ".[dev]" install must include it.
# types-PyYAML is a mypy requirement, not a runtime one: without it the
# quality-gates job fails on `import yaml` in remora/causal/domains/loader.py
# and remora/audit_gates/api.py. It was pinned in requirements-lock.txt but
# never declared by an extra, so `-c` pinned a version pip was never asked to
# install (fixed 2026-07-31).
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.3", "sqlglot>=30.17.0", "mypy>=2.3.1", "pyyaml>=6.0", "types-PyYAML>=6.0.12.20260815", "httpx>=0.25", "hypothesis>=6.165.10"]

[project.urls]
Homepage = "https://github.com/darklordVirtual/REMORA-research"
Repository = "https://github.com/darklordVirtual/REMORA-research"
Issues = "https://github.com/darklordVirtual/REMORA-research/issues"

[project.scripts]
remora = "remora.cli:main"

# The wheel must fulfil the documented CLI/API contract (REM-045, external
# review F-01/F-05): `remora serve` / "uvicorn servers.api:app" needs the
# servers/ package, and remora.governance.envelope resolves the canonical
# schemas/ directory relative to the installed package root at runtime.
# force-include keeps schemas/ at the same top-level position it has in a
# repo checkout, so path resolution is identical in both install modes.
[tool.hatch.build.targets.wheel]
packages = ["remora", "servers"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "schemas"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",   # module-import-not-at-top (conditional/deferred imports are intentional)
    "E501",   # line-too-long (handled by formatter, not enforced in linter)
    "E701",   # multiple-statements-on-one-line-colon (compact math style)
    "E702",   # multiple-statements-on-one-line-semicolon (compact math style)
]

[tool.mypy]
# Gate scope: `mypy remora servers` in quality-gates.yml. servers/ was
# outside the gate until 2026-08-20 even though it holds the audit-chain
# hashing, signing and both API surfaces — the largest untyped stretch of the
# trusted computing base. Expand package-by-package; do not add blanket
# ignores to get a package through.
python_version = "3.12"
ignore_missing_imports = true
# warn_unused_ignores stays OFF: `# type: ignore` comments here guard
# optional-dependency imports (scipy, opentelemetry, sqlglot, ...) and are
# unused/used depending on which extras are installed in the environment.
warn_unused_ignores = false
warn_redundant_casts = true

# Default mypy does not check the BODIES of unannotated functions, so an
# untyped function on the ACCEPT path was invisible to the gate no matter how
# wide its scope. These five packages are the trusted computing base and must
# be annotated; the rest of the tree is expanded as it is cleaned up.
[[tool.mypy.overrides]]
module = [
    "remora.policy.*",
    "remora.enforcement.*",
    "remora.execution.*",
    "remora.governance.*",
    "servers.*",
]
disallow_untyped_defs = true

# The BFCL semantic bundle is a FROZEN evaluation artifact: its SHA-256 is
# recorded in data/routing_bench_bfcl_v4_cext3/manifest.json and the sealed
# C-ext3 result binds to those exact bytes (CLAIM-019). Type-annotation
# cleanups would change the hash without changing behaviour, so the file is
# excluded from the gate instead of edited.
[[tool.mypy.overrides]]
module = "remora.toolcall.routing.bfcl_semantic_bundle"
ignore_errors = true

[tool.coverage.run]
# Branch coverage on: a statement-only number counts a half-taken `if` as
# fully covered, which is exactly where fail-closed guards hide. servers/ is
# measured too — it holds the audit-chain hashing, signing and both API
# surfaces, and was outside the measurement entirely until 2026-08-20.
branch = true
source = ["remora", "servers"]
omit = [
    "*/__pycache__/*",
    # Frozen evaluation artifact, hash-sealed in the C-ext3 manifest; it runs
    # only inside the spent sealed track and must not be edited for coverage.
    "remora/toolcall/routing/bfcl_semantic_bundle.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live and not live_replay_heavy'"
markers = [
    "live: marks tests that require a live Cloudflare Worker (deselect with -m 'not live')",
    "live_replay_heavy: long-running deterministic replay/sandbox tests (run in dedicated job)",
    "docgate: asserts on repository documents and registers rather than runtime behaviour; run as its own CI job so documentation drift and a governance regression do not fail the same way",
    "slow: tests that take more than 10 seconds (deselect with -m 'not slow')",
    "rem014_gate: REM-014 structural verification of the imported AgentHarm artifact",
    "opa_gate: OPA/Rego conformance tests (skip automatically when the opa binary is absent)",
]

[tool.mutmut]
# Issue #280: mutation testing over the grant/lease/PEP consumption paths.
# Scoped deliberately: these four files carry the one-time-consumption and
# exact-call-binding guarantees, and the selected tests are the remora-only
# suites that exercise them (~10 s), so a full mutant sweep stays tractable.
# Run from WSL/Linux (mutmut has no native Windows support):
#   mutmut run && mutmut results
source_paths = ["remora"]
only_mutate = [
    "remora/enforcement/token.py",
    "remora/enforcement/gate.py",
    "remora/enforcement/lease.py",
    "remora/enforcement/nonce_store.py",
]
# The refusal tests import servers.api inside test functions, and api.py
# hashes schemas/ files at import; both must exist in the mutants sandbox.
also_copy = ["servers/", "schemas/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests/test_token_key_lifecycle.py",
    "tests/test_execution_lease.py",
    "tests/test_lease_signing_contracts.py",
    "tests/test_lease_verification_contracts.py",
    "tests/test_lease_authority_custody.py",
    "tests/test_lease_nonce_durability.py",
    "tests/test_custody_split_dispatch.py",
    "tests/test_enforcement_gate_timestamps.py",
    "tests/test_enforcement_ledger_sqlite.py",
    "tests/test_enforcement_properties.py",
    "tests/test_gate_replay_properties.py",
    "tests/test_dispatch_clock_consistency.py",
    "tests/test_sqlite_memory_refused.py",
]
