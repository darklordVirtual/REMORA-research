{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://remora.dev/schemas/decision_envelope/v2",
  "title": "REMORA DecisionEnvelope v2",
  "type": "object",
  "required": [
    "request",
    "assessment",
    "gate",
    "reviewer_context",
    "follow_up",
    "history",
    "policy_learning",
    "audit",
    "effect"
  ],
  "additionalProperties": false,
  "properties": {
    "request": {
      "type": "object",
      "required": [
        "request_id",
        "domain",
        "risk_tier",
        "proposed_action",
        "action_type",
        "target_environment"
      ],
      "additionalProperties": false,
      "properties": {
        "request_id": { "type": "string" },
        "domain": { "type": "string" },
        "risk_tier": { "type": "string" },
        "proposed_action": { "type": "string" },
        "action_type": { "type": "string" },
        "target_environment": { "type": "string" }
      }
    },
    "assessment": {
      "type": "object",
      "required": [
        "oracle_votes",
        "thermodynamic",
        "evidence_quality",
        "policy_triggers"
      ],
      "additionalProperties": false,
      "properties": {
        "oracle_votes": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "thermodynamic": {
          "type": "object",
          "additionalProperties": true
        },
        "evidence_quality": {
          "type": "object",
          "additionalProperties": true
        },
        "policy_triggers": {
          "type": "array",
          "items": { "type": "string" }
        }
      }
    },
    "gate": {
      "type": "object",
      "required": ["outcome", "blocked_action", "allowed_next_steps"],
      "additionalProperties": false,
      "properties": {
        "outcome": { "type": "string" },
        "blocked_action": { "type": ["string", "null"] },
        "allowed_next_steps": {
          "type": "array",
          "items": { "type": "string" }
        }
      }
    },
    "reviewer_context": {
      "type": "object",
      "required": ["asset", "missing_critical_data"],
      "additionalProperties": false,
      "properties": {
        "asset": {
          "type": "object",
          "additionalProperties": true
        },
        "missing_critical_data": {
          "type": "array",
          "items": { "type": "string" }
        }
      }
    },
    "follow_up": {
      "type": "object",
      "required": ["required", "type", "requested_evidence", "sla_hours"],
      "additionalProperties": false,
      "properties": {
        "required": { "type": "boolean" },
        "type": { "type": ["string", "null"] },
        "requested_evidence": {
          "type": "array",
          "items": { "type": "string" }
        },
        "sla_hours": { "type": ["integer", "null"] }
      }
    },
    "history": {
      "type": "object",
      "required": ["similar_cases_found", "decision_pattern", "known_blockers", "synthetic"],
      "additionalProperties": false,
      "properties": {
        "similar_cases_found": { "type": "integer" },
        "decision_pattern": {
          "type": "object",
          "additionalProperties": true
        },
        "known_blockers": {
          "type": "array",
          "items": { "type": "string" }
        },
        "synthetic": { "type": "boolean" }
      }
    },
    "policy_learning": {
      "type": "object",
      "required": ["candidate_rule_update", "requires_policy_owner_approval"],
      "additionalProperties": false,
      "properties": {
        "candidate_rule_update": { "type": "boolean" },
        "requires_policy_owner_approval": { "type": "boolean" }
      }
    },
    "causal_explanation": {
      "type": ["object", "null"],
      "additionalProperties": true
    },
    "effect": {
      "type": "object",
      "required": ["executed"],
      "additionalProperties": false,
      "properties": {
        "executed":       { "type": "boolean" },
        "tool_call_hash": { "type": ["string", "null"] },
        "effect_outcome": { "type": ["string", "null"] },
        "ledger_entry":   { "type": "object" }
      }
    },
    "audit": {
      "type": "object",
      "required": ["policy_version", "hash", "previous_hash", "signature"],
      "additionalProperties": false,
      "properties": {
        "policy_version":      { "type": "string" },
        "hash":                { "type": ["string", "null"] },
        "previous_hash":       { "type": ["string", "null"] },
        "genesis":             { "type": "boolean" },
        "signature":           { "type": ["string", "null"] },
        "schema_version":      { "type": "string" },
        "timestamp_utc":       { "type": ["string", "null"] },
        "tenant_id":           { "type": ["string", "null"] },
        "actor_identity":      { "type": ["string", "null"] },
        "policy_bundle_hash":  { "type": ["string", "null"] },
        "tool_args_hash":      { "type": ["string", "null"] },
        "data_classification": { "type": ["string", "null"] },
        "retention_policy":    { "type": ["string", "null"] },
        "tool_contract_bundle_hash": { "type": ["string", "null"] },
        "intent_authority_hash":     { "type": ["string", "null"] },

        "//policy_components": [
          "Per-component trust-base identity for this decision, and what it",
          "does not reach. policy_bundle_hash is a composite over the same",
          "components: it can say THAT the trust base differed and never",
          "which part, so two independently signed records carrying only the",
          "composite cannot be joined component by component.",
          "",
          "`covers` maps a component name to its digest. A component that is",
          "configured but absent -- OPA with no policy path set -- carries",
          "null rather than being dropped: present-and-unset and",
          "not-a-component-here are different facts.",
          "",
          "`not_covered` names trust-base elements this decision depends on",
          "that carry no digest here. Required, and required to be present",
          "even when empty: a record that lists coverage and stays silent",
          "about the rest reads as complete coverage, which is the inference",
          "an evidence layer exists to prevent."
        ],
        "policy_components": {
          "type": ["object", "null"],
          "required": ["covers", "not_covered"],
          "additionalProperties": false,
          "properties": {
            "covers": {
              "type": "object",
              "additionalProperties": { "type": ["string", "null"] }
            },
            "not_covered": {
              "type": "array",
              "items": { "type": "string" }
            }
          }
        }
      }
    }
  }
}
