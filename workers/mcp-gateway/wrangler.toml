name = "remora-mcp-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ── The REMORA container ──────────────────────────────────────────────────────
# Always on. Measured cold start is 4.1-4.4 s on `basic`; wake-on-demand would
# pay that on every cold MCP call to save roughly $7/month, which is a bad
# trade for one tenant. See docs/design/cloudflare-mcp-gateway-v1.md.
[[containers]]
class_name = "RemoraContainer"
image = "../../deploy/ot-pilot/Dockerfile"
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

# ── European jurisdiction ─────────────────────────────────────────────────────
# The execution state this container writes is not operational telemetry. It is
# the tenant audit chain, the one-time-grant ledger and the DecisionEnvelope
# store: a record of who authorised which action against which system. Where it
# is processed is a compliance question, so the constraint is expressed as a
# jurisdiction rather than as a region list. `eu` maps to EEUR and WEUR and is
# a boundary, not a preference.
#
# Placement alone is not a GDPR guarantee. It constrains where the container
# runs; the database it connects to must be in the same jurisdiction, and that
# is a separate decision recorded in DOC-319.
[containers.constraints]
jurisdiction = "eu"

# ── The execution domain (ADR-A) ──────────────────────────────────────────────
# Same image, different custody. This container holds the Ed25519 PUBLIC key and
# the downstream tool credentials; it never receives the private lease key, so it
# can verify every lease it will ever see and mint none.
#
# A second container doubles the container cost at idle. That is the price of the
# property: as long as one process both decides and executes, a compromise there
# is an authority-forgery risk rather than only a replay risk, and no amount of
# configuration inside one process changes that.
[[containers]]
class_name = "RemoraExecutionContainer"
image = "../../deploy/ot-pilot/Dockerfile"
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

[containers.constraints]
jurisdiction = "eu"

# ── The exeQta knowledge graph ────────────────────────────────────────────────
# Bound to the Worker, never handed to the container. The container asks
# graph.internal over plain HTTP and the outbound handler answers from here.
[[d1_databases]]
binding = "GRAPH_DB"
database_name = "aion-hub"
database_id = "71257339-0c51-4696-9567-d156cc9dcee3"

# Durable execution state: audit chain, review queue, one-time-grant ledger.
# A separate database from the graph — execution state is not knowledge.
[[d1_databases]]
binding = "STATE_DB"
database_name = "remora-execution-state"
database_id = "e5afbc4a-b32e-4fd1-8aa4-881f24ae9efa"

[vars]
# Same boundary as the container above. Named here rather than hardcoded so a
# deployment that must sit elsewhere changes one file, and so the two settings
# are visibly next to each other.
PROPOSAL_JURISDICTION = "eu"
# The tenant the graph tools speak for. Never an argument a caller can set.
REMORA_KG_TENANT = "luftfiber"
# This gateway is a test deployment. The label describes the deployment, not
# the data it reads: a production deployment sets "prod" and the ACCEPT paths
# exclude it again for disclosure blast radius.
REMORA_TARGET_ENVIRONMENT = "staging"

[[durable_objects.bindings]]
name = "REMORA"
class_name = "RemoraContainer"

[[durable_objects.bindings]]
name = "EXECUTION"
class_name = "RemoraExecutionContainer"

[[durable_objects.bindings]]
name = "PROPOSALS"
class_name = "ProposalDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoraContainer", "ProposalDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RemoraExecutionContainer"]

# REMORA_AGENT_TOKEN is a secret: `wrangler secret put REMORA_AGENT_TOKEN`.
# It is the OPERATOR token. It deliberately cannot approve anything — role
# separation is enforced server-side, so a gateway compromise cannot
# self-approve a mutating call.
